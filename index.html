<body class="bg-[#F8FAF9] text-[#0F172A] min-h-screen flex flex-col">

  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ---------------- Normalize String Helper ---------------- */
    function normalizeStr(str) {
      if (!str) return '';
      let s = String(str);
      const arabicDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
      for (let i = 0; i < 10; i++) {
        s = s.split(arabicDigits[i]).join(String(i));
      }
      s = s.replace(/[أإآ]/g, 'ا')
           .replace(/[ة]/g, 'ه')
           .replace(/[ى]/g, 'ي')
           .replace(/[\u064B-\u065F]/g, '');
      return s.toLowerCase().replace(/[\s\-\+\(\)\_]/g, '');
    }

    /* ---------------- Neon Postgres & Cloud Storage Client ---------------- */
    const LOCAL_STORAGE_KEY = 'almustashar_neon_synced_v1';
    const CLOUD_FALLBACK_URL = 'https://api.restful-api.dev/objects/ff8081819ff5b11001a0329c847c0a24';

    const DB = {
      async getAll() {
        // 1. Try Vercel + Neon Postgres API
        try {
          const res = await fetch('/api/db', { cache: 'no-cache' });
          if (res.ok) {
            const data = await res.json();
            if (data && Array.isArray(data.applicants)) {
              localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data.applicants));
              return data.applicants;
            }
          }
        } catch(e) {}

        // 2. Direct Cloud Storage
        try {
          const res = await fetch(CLOUD_FALLBACK_URL, { cache: 'no-cache' });
          if (res.ok) {
            const json = await res.json();
            if (json && json.data && Array.isArray(json.data.applicants)) {
              localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(json.data.applicants));
              return json.data.applicants;
            }
          }
        } catch(e) {}

        // 3. Local Cache
        try {
          const local = localStorage.getItem(LOCAL_STORAGE_KEY) || localStorage.getItem('almustashar_synced_data_v6');
          if (local) return JSON.parse(local);
        } catch(e) {}

        return [];
      },

      async save(applicant) {
        // 1. Save to Local Cache
        try {
          const list = await this.getAll();
          const updated = [applicant, ...list.filter(a => a.code !== applicant.code && normalizeStr(a.phone) !== normalizeStr(applicant.phone))];
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(updated));
        } catch(e) {}

        // 2. Push to Neon Postgres API
        try {
          await fetch('/api/db', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ applicant })
          });
        } catch(e) {}

        // 3. Push to Cloud Storage Mirror
        try {
          const list = await this.getAll();
          const updated = [applicant, ...list.filter(a => a.code !== applicant.code && normalizeStr(a.phone) !== normalizeStr(applicant.phone))];
          await fetch(CLOUD_FALLBACK_URL, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: 'Almustashar Portal Database',
              data: { applicants: updated, updatedAt: new Date().toISOString() }
            })
          });
        } catch(e) {}
      },

      async delete(code) {
        try {
          await fetch(`/api/db?code=${encodeURIComponent(code)}`, { method: 'DELETE' });
        } catch(e) {}
      }
    };

    /* ---------------- Icons ---------------- */
    const Icon = {

        </svg>

      Shield: ({ size = 18 }) => (

          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
        </svg>
      )
    };

    const STAGES = [

              >

              <button

      );
    }

    /* ---------------- Google-Style Form ---------------- */
    function GoogleStyleForm({ onSubmit, isSubmitting }) {
      const [data, setData] = useState({
        fullName: "",
        phone: "",
        email: "",
        nationality: "",
        city: "",
        age: "",
        education: "",
        currentJob: "",
        yearsExperience: "",
        expectedSalary: "",
        skills: "",
        vatExperience: "",
        photoBase64: null,
        cvFile: null,
      });
      const [error, setError] = useState("");

      const set = (k, v) => setData(d => ({ ...d, [k]: v }));

      const handlePhoto = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => set("photoBase64", ev.target.result);
        reader.readAsDataURL(file);
      };

      const handleCv = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          set("cvFile", {
            name: file.name,
            size: (file.size / 1024).toFixed(0) + " KB",
            dataUrl: ev.target.result,
            type: file.type || 'application/pdf'
          });
        };
        reader.readAsDataURL(file);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!data.fullName.trim()) { setError("يرجى كتابة الاسم الرباعي كاملاً."); return; }
        if (!data.phone.trim()) { setError("يرجى كتابة رقم الهاتف (واتساب)."); return; }
        if (!data.education.trim()) { setError("يرجى تحديد أو كتابة المؤهل العلمي."); return; }
        if (!data.yearsExperience.trim()) { setError("يرجى تحديد سنوات الخبرة."); return; }
        setError("");
        onSubmit(data);
      };

      return (
        <div className="max-w-2xl mx-auto px-3.5 md:px-6 py-6 md:py-10 space-y-5 animate-fade-in text-right">
          
          {/* Main Top Header Card */}
          <div className="g-card g-header p-6 md:p-8 space-y-4 shadow-sm border border-slate-200">
            <div className="flex items-center justify-between border-b border-slate-100 pb-4">
              <div className="flex items-center gap-2.5">
                <div className="w-10 h-10 rounded-xl bg-brand-800 text-white flex items-center justify-center shadow-sm">
                  <Icon.Scale size={20} />
                </div>
                <div>
                  <h3 className="font-extrabold text-xs md:text-sm text-slateText-title">المستشار للمحاماة والاستشارات القانونية</h3>

                </div>
              </div>
              <span className="text-[11px] font-bold px-3 py-1 bg-brand-50 text-brand-800 rounded-full border border-brand-200/80">
                توظيف مباشر
              </span>
            </div>

            <div>
              <h1 className="text-xl md:text-2xl font-black text-slateText-title leading-snug">
                استمارة التقديم على وظيفة محاسب مالي

              <p className="text-xs md:text-sm text-slateText-muted mt-2 leading-relaxed">
                يسر مكتب المستشار للمحاماة بالرياض استقبال طلبات الانضمام لفريق العمل المالي. يرجى تعبئة الحقول أدناه وإرفاق سيرتك الذاتية وصورتك الشخصية.
              </p>
            </div>

            <div className="flex flex-wrap items-center gap-2 pt-2">
              <span className="text-[11px] font-bold bg-slate-100 text-slateText-body px-3 py-1 rounded-lg">📍 مدينة الرياض</span>
              <span className="text-[11px] font-bold bg-slate-100 text-slateText-body px-3 py-1 rounded-lg">💼 دوام كامل</span>
              <span className="text-[11px] font-bold bg-slate-100 text-slateText-body px-3 py-1 rounded-lg">⚖️ قسم الحسابات والإدارة المالية</span>
            </div>

            <div className="pt-3 border-t border-slate-100 flex items-center justify-between text-[11px] font-semibold text-slateText-muted">
              <span>جميع البيانات تخضع لسرية تامة لأغراض التوظيف</span>
              <span className="text-red-500 font-bold">* حقول إلزامية</span>

          {/* Validation Alert */}
          {error && (

          <form onSubmit={handleSubmit} className="space-y-5">

            {/* Section 1: Personal Details */}

              <div>

                  الاسم الرباعي <span className="text-red-500 font-bold">*</span>

                  type="text"

                  onChange={e => set("fullName", e.target.value)}

                    type="email"
                    dir="ltr"

              </div>
            </div>

              <div>

                    onChange={e => set("yearsExperience", e.target.value)}

      const normalizedQ = normalizeStr(searchQuery);
      const filteredApplicants = normalizedQ ? applicants.filter(a => {
        const normCode = normalizeStr(a.code);

        return normCode.includes(normalizedQ) || normPhone.includes(normalizedQ) || normName.includes(normalizedQ);
      }) : applicants;

      const handleManualSearch = async (e) => {
        if (e) e.preventDefault();
        if (!searchQuery.trim()) return;
        setLoading(true);
        setHasSearched(true);
        const fresh = await onRefresh();
        setLoading(false);
        const normQ = normalizeStr(searchQuery);
        if (!normQ) return;
        const found = fresh.find(a => 
          normalizeStr(a.code).includes(normQ) ||
          normalizeStr(a.phone).includes(normQ) ||
          normalizeStr(a.fullName).includes(normQ)
        );
        setSelectedApplicant(found || null);
      };

      const getStageIdx = (status) => {
        if (status === 'SUBMITTED') return 0;
        if (status === 'RECEIVED' || status === 'CV_VIEWED') return 2;
        if (status === 'SHORTLISTED') return 3;
        if (status === 'INTERVIEW_SCHEDULED') return 4;

    function App() {
      const [view, setView] = useState("form");
      const [applicants, setApplicants] = useState([]);
      const [activeApplicant, setActiveApplicant] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isAdminModalOpen, setIsAdminModalOpen] = useState(false);
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);

      const refreshData = async () => {
        const list = await DB.getAll();
        setApplicants(list);
        return list;
      };

      useEffect(() => {
        refreshData();
      }, []);

      const handleFormSubmit = async (formData) => {
        setIsSubmitting(true);
        const currentList = await DB.getAll();
        const nextNum = currentList.length + 1;
        const newCode = 'APP-' + String(nextNum).padStart(4, '0');

        const newApp = {
          id: String(Date.now()),
          code: newCode,
          status: 'SUBMITTED',
          submittedAt: new Date().toLocaleDateString('ar-SA'),
          interview: null,
          ...formData
        };

        await DB.save(newApp);
        const updated = [newApp, ...currentList.filter(a => a.code !== newApp.code && normalizeStr(a.phone) !== normalizeStr(newApp.phone))];
        setApplicants(updated);
        setActiveApplicant(newApp);
        setIsSubmitting(false);
        setView("success");
      };

      const updateStatus = async (code, newStatus) => {
        const target = applicants.find(a => a.code === code);
        if (target) {
          const updatedTarget = { ...target, status: newStatus };
          await DB.save(updatedTarget);
          const updated = applicants.map(a => a.code === code ? updatedTarget : a);
          setApplicants(updated);
          if (activeApplicant?.code === code) setActiveApplicant(updatedTarget);
        }
      };

      const scheduleInt = async (code, interviewData) => {
        const target = applicants.find(a => a.code === code);
        if (target) {
          const updatedTarget = { ...target, status: 'INTERVIEW_SCHEDULED', interview: interviewData };
          await DB.save(updatedTarget);
          const updated = applicants.map(a => a.code === code ? updatedTarget : a);
          setApplicants(updated);
          if (activeApplicant?.code === code) setActiveApplicant(updatedTarget);
        }
      };

      const deleteApplicant = async (code) => {
        if (confirm(`هل أنت متأكد من حذف المتقدم ${code} نهائياً؟`)) {
          await DB.delete(code);
          const updated = applicants.filter(a => a.code !== code);
          setApplicants(updated);
          if (activeApplicant?.code === code) setActiveApplicant(null);
        }
      };

      const resetAll = async () => {
        if (confirm('هل تريد تصفير جميع بيانات المتقدمين والبدء من الصفر؟')) {
          await DB.delete('');
          localStorage.clear();
          setApplicants([]);
          setActiveApplicant(null);
          alert('تم تصفير قاعدة البيانات بنجاح.');
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#F8FAF9]">
          <Navbar view={view} setView={setView} />

          <main className="flex-1">
            {view === "form" && (
              <GoogleStyleForm
                onSubmit={handleFormSubmit}
                isSubmitting={isSubmitting}
              />
            )}

            {view === "success" && activeApplicant && (
              <SuccessScreen
                applicant={activeApplicant}
                goDashboard={() => setView("dashboard")}
              />
            )}

            {view === "dashboard" && (
              <ApplicantDashboard
                applicants={applicants}
                activeApplicant={activeApplicant}
                onRefresh={refreshData}
                onGoApply={() => setView("form")}
              />
            )}

            {view === "admin" && isAdminLoggedIn && (
              <AdminDashboardView
                applicants={applicants}
                onUpdateStatus={updateStatus}
                onScheduleInterview={scheduleInt}
                onDeleteApplicant={deleteApplicant}
                onResetAll={resetAll}
              />
            )}
          </main>

          <footer className="mt-auto bg-white border-t border-[#E2E8F0] py-5 px-3 text-xs text-slateText-muted">
            <div className="max-w-2xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-center sm:text-right">
              <div className="flex items-center gap-1.5">
                <Icon.Scale size={15} />
                <span className="font-bold text-slateText-body">مكتب المستشار للمحاماة والاستشارات القانونية — الرياض</span>
              </div>
              <div
                onClick={() => setIsAdminModalOpen(true)}
                className="cursor-default select-none text-[11px] text-slateText-light hover:text-slateText-muted"
              >
                © 2026 جميع الحقوق محفوظة · بوابة التوظيف
              </div>
            </div>
          </footer>

          {isAdminModalOpen && (
            <AdminAuthModal
              onSuccess={() => {
                setIsAdminModalOpen(false);
                setIsAdminLoggedIn(true);
                setView("admin");
              }}
              onClose={() => setIsAdminModalOpen(false)}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
