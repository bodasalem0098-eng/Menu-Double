    function fmtHMS(ms) {
      if (ms < 0) ms = 0;
      const s = Math.floor(ms / 1000);
      const h = String(Math.floor(s / 3600)).padStart(2, "0");
      const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
      const sec = String(s % 60).padStart(2, "0");
      return `${h}:${m}:${sec}`;
    }

      if (status === "DECISION" || status === "UNDER_REVIEW") return { bg: c.infoSoft, text: c.infoText };
      if (status === "INTERVIEW_SCHEDULED" || status === "INTERVIEW_COMPLETED") return { bg: c.accentSoft, text: c.accentText };

            const nodeColor = done ? c.success : current ? c.primary : c.borderStrong;

            return (
              <div key={s.key || i} className={isH ? "flex-1 flex flex-col items-center" : "flex flex-row items-start gap-3 pb-6"}>
                <div className={isH ? "flex items-center w-full" : "flex flex-col items-center"}>

        const file = e.target.files[0];
        if (!file) return;
        set("cvFile", { name: file.name, size: (file.size / 1024).toFixed(0) + " KB" });
      };

      const validate = () => {
        if (step === 0 && (!data.fullName || !data.phone)) return "الاسم ورقم الهاتف مطلوبان.";
        if (step === 1 && !data.yearsExperience) return "يرجى كتابة سنوات الخبرة.";
        return "";
      };

      const next = () => {
        const e = validate();
        if (e) { setStepError(e); return; }
        setStepError("");
        if (step < FORM_STEPS.length - 1) setStep(step + 1);
      };
      const back = () => { setStepError(""); step > 0 ? setStep(step - 1) : setView("jobDetails"); };

      return (
        <div className="max-w-3xl mx-auto px-4 py-6 md:py-8 animate-fade-in text-right space-y-4">
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs font-bold text-slateText-body">التقديم على: {job.title}</span>
            <span className="text-[11px] text-slateText-muted">حفظ تلقائي للمسودة</span>
          </div>

          <div className="my-6">
            <PipelineRail c={palette.light} steps={FORM_STEPS.map((t, i) => ({ key: i, label: t }))} activeIndex={step} orientation="horizontal" size="sm" />
          </div>

          <div className="clean-card p-6 md:p-8 space-y-5">
            {step === 0 && (
              <div className="grid sm:grid-cols-2 gap-3.5">
                <Field label="الاسم الكامل *" value={data.fullName} onChange={v => set("fullName", v)} placeholder="اكتب اسمك كاملاً" />
                <Field label="رقم الهاتف (واتساب) *" value={data.phone} onChange={v => set("phone", v)} placeholder="05XXXXXXXX" />
                <Field label="البريد الإلكتروني" value={data.email} onChange={v => set("email", v)} placeholder="example@email.com" />
                <Field label="الجنسية" value={data.nationality} onChange={v => set("nationality", v)} placeholder="سعودي / مصري / أردني..." />
                <Field label="مدينة الإقامة" value={data.city} onChange={v => set("city", v)} placeholder="الرياض" />
                <Field label="العمر" type="number" value={data.dob} onChange={v => set("dob", v)} placeholder="28" />
              </div>
            )}

            {step === 1 && (
              <div className="grid sm:grid-cols-2 gap-3.5">
                <Field label="المسمى الوظيفي الحالي" value={data.currentJob} onChange={v => set("currentJob", v)} placeholder="محاسب عام" />
                <Field label="سنوات الخبرة *" type="number" value={data.yearsExperience} onChange={v => set("yearsExperience", v)} placeholder="3" />
                <Field label="المؤهل العلمي" value={data.education} onChange={v => set("education", v)} placeholder="بكالوريوس محاسبة" />
                <Field label="الراتب المتوقع (ريال)" value={data.expectedSalary} onChange={v => set("expectedSalary", v)} placeholder="8,500 ريال" />
              </div>
            )}

            {step === 2 && (
              <div className="space-y-3.5">
                <Field label="البرامج المحاسبية والأنظمة التي تجيدها" value={data.skills} onChange={v => set("skills", v)} placeholder="Odoo, SAP, Excel, سماك, دفترة..." />
                <Field label="الشهادات المهنية إن وجدت (SOCPA, CMA, IFRS)" value={data.certifications} onChange={v => set("certifications", v)} placeholder="شهادات معتمدة..." />
              </div>
            )}

            {step === 3 && (
              <div className="grid sm:grid-cols-2 gap-4">
                <div className="p-4 bg-slate-50 rounded-2xl border border-slate-200 text-center">
                  <label className="block text-xs font-bold text-slateText-body mb-2">الصورة الشخصية</label>
                  {data.photoBase64 ? (
                    <img src={data.photoBase64} alt="" className="w-16 h-16 rounded-xl object-cover mx-auto" />
                  ) : (
                    <label className="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white rounded-xl text-xs font-bold cursor-pointer border border-slate-200 shadow-sm">
                      <Icon.Upload size={14} /> <span>رفع صورة</span>
                      <input type="file" accept="image/*" onChange={handlePhotoUpload} className="hidden" />
                    </label>
                  )}
                </div>

                <div className="p-4 bg-slate-50 rounded-2xl border border-slate-200 text-center">
                  <label className="block text-xs font-bold text-slateText-body mb-2">السيرة الذاتية (CV)</label>
                  {data.cvFile ? (
                    <span className="text-xs font-bold text-green-600 block py-2">✓ {data.cvFile.name}</span>
                  ) : (
                    <label className="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white rounded-xl text-xs font-bold cursor-pointer border border-slate-200 shadow-sm">
                      <Icon.Upload size={14} /> <span>رفع ملف CV</span>
                      <input type="file" accept=".pdf,.doc,.docx" onChange={handleCvUpload} className="hidden" />
                    </label>
                  )}
                </div>
              </div>
            )}

            {step === 4 && (
              <div className="space-y-4">
                {job.questions.map(q => (
                  <div key={q.id}>
                    <span className="text-xs font-bold text-slateText-body block mb-1">{q.label}</span>
                    {q.type === "text" && (
                      <input value={data.answers[q.id] || ""} onChange={e => setAnswer(q.id, e.target.value)} className="w-full h-10 rounded-xl px-3 text-xs outline-none border border-slate-200 bg-slate-50 text-right focus:border-brand-800" />
                    )}
                    {q.type === "select" && (
                      <select value={data.answers[q.id] || ""} onChange={e => setAnswer(q.id, e.target.value)} className="w-full h-10 rounded-xl px-3 text-xs outline-none border border-slate-200 bg-slate-50 focus:border-brand-800">
                        <option value="">اختر...</option>
                        {q.options.map(o => <option key={o} value={o}>{o}</option>)}
                      </select>
                    )}
                    {q.type === "yesno" && (
                      <div className="flex gap-2">
                        {["نعم", "لا"].map(opt => (
                          <button key={opt} type="button" onClick={() => setAnswer(q.id, opt)} className={`px-5 h-9 rounded-xl text-xs font-bold border transition-colors ${
                            data.answers[q.id] === opt ? 'bg-brand-800 text-white border-brand-800' : 'bg-slate-50 text-slateText-body border-slate-200'
                          }`}>{opt}</button>
                        ))}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}

            {step === 5 && (
              <div className="space-y-3 text-xs">
                <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                  <div className="flex justify-between"><span>الاسم:</span><strong>{data.fullName}</strong></div>
                  <div className="flex justify-between"><span>الهاتف:</span><strong dir="ltr">{data.phone}</strong></div>
                  <div className="flex justify-between"><span>الخبرة:</span><strong>{data.yearsExperience} سنوات</strong></div>
                  <div className="flex justify-between"><span>الراتب المتوقع:</span><strong>{data.expectedSalary || "غير محدد"}</strong></div>
                </div>
                <p className="text-[11px] text-slateText-muted">بالضغط على إرسال، تؤكد صحة البيانات المدخلة وموافقتك على مراجعتها من لجنة التوظيف.</p>
              </div>
            )}

            {stepError && <p className="text-xs text-red-500 flex items-center gap-1.5"><Icon.AlertCircle size={13} />{stepError}</p>}

            <div className="mt-6 pt-5 border-t border-slate-100 flex items-center justify-between">
              <button type="button" onClick={back} className="text-xs font-bold text-slateText-muted hover:text-slateText-title">➔ السابق</button>
              {step < FORM_STEPS.length - 1 ? (
                <button type="button" onClick={next} className="px-6 h-10 bg-brand-800 text-white rounded-xl text-xs font-bold hover:bg-brand-900 shadow-sm">المتابعة ➔</button>
              ) : (
                <button type="button" onClick={() => onSubmit(data)} className="px-7 h-10 bg-brand-800 text-white rounded-xl text-xs font-bold hover:bg-brand-900 shadow-sm">إرسال الطلب نهائياً ✓</button>
              )}
            </div>
          </div>
        </div>
      );
    }

    function Field({ label, value, onChange, placeholder, type = "text" }) {
      return (
        <label className="block text-right">
          <span className="text-[11px] font-bold text-slateText-body block mb-1">{label}</span>
          <input
            type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder}
            className="w-full h-10 px-3 rounded-xl border border-slate-200 text-xs outline-none bg-slate-50/50 text-right focus:border-brand-800"
          />
        </label>
      );
    }

    /* ---------------- Success Screen ---------------- */
    function SuccessScreen({ applicationId, job, goDashboard }) {
      return (
        <div className="max-w-md mx-auto px-4 py-14 text-center animate-fade-in space-y-4">
          <div className="w-16 h-16 rounded-full bg-green-50 text-green-600 border border-green-200 flex items-center justify-center mx-auto">
            <Icon.CheckCircle2 size={32} color="#16A34A" />
          </div>
          <h1 className="text-xl md:text-2xl font-extrabold text-slateText-title">تم استلام طلبك بنجاح!</h1>
          <p className="text-xs text-slateText-muted leading-relaxed">
            تم استلام ملفك للتقديم على وظيفة <strong className="text-slateText-title">{job.title}</strong> في مكتب المستشار للمحاماة.
          </p>
          <div className="inline-block px-5 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-bold">
            <span className="text-slateText-muted">رقم الطلب: </span>
            <strong className="text-brand-800 font-mono text-sm">#{applicationId}</strong>
          </div>
          <div className="pt-3">
            <button onClick={goDashboard} className="px-7 h-11 bg-brand-800 text-white rounded-xl text-xs font-bold shadow-sm hover:bg-brand-900">
              الدخول للوحة متابعة الطلب والمقابلة ➔
            </button>
          </div>
        </div>
      );
    }

    /* ---------------- Full Applicant Dashboard ---------------- */
    function Dashboard({ job, applicationId, stageIndex, tab, setTab, setView, simOffset, setSimOffset, attendance, setAttendance, interviewTime, now, applicantData }) {
      const nav = [
        { id: "overview", label: "نظرة عامة والمسار", icon: Icon.LayoutDashboard },
        { id: "interviews", label: "غرفة المقابلة المرئية", icon: Icon.Video },
        { id: "applications", label: "طلباتي المسجلة", icon: Icon.FileText },
        { id: "notifications", label: "التنبيهات", icon: Icon.Bell },
        { id: "profile", label: "ملفي الشخصي", icon: Icon.User },
      ];

      return (
        <div className="max-w-6xl mx-auto px-4 py-6 md:py-8 flex flex-col md:flex-row gap-6 animate-fade-in text-right">
          
          {/* Sidebar */}
          <div className="hidden md:flex flex-col w-56 shrink-0 pl-5 border-l border-slate-200">
            {nav.map(n => (

            </button>
          </div>

          {/* Mobile Tabs */}
          <div className="flex md:hidden gap-1.5 overflow-x-auto pb-2 no-scrollbar">
            {nav.map(n => (
              <button key={n.id} onClick={() => setTab(n.id)} className={`shrink-0 flex items-center gap-1 px-3 h-8 rounded-xl text-[11px] font-bold ${
                tab === n.id ? 'bg-brand-800 text-white' : 'bg-slate-100 text-slateText-body'
              }`}>
                <n.icon size={12} /> {n.label}
              </button>
            ))}
          </div>

          {/* Main Tab Content */}
          <div className="flex-1 min-w-0 space-y-4">
            
            {tab === "overview" && (
              <div className="space-y-4">
                <div>
                  <h1 className="text-xl font-extrabold text-slateText-title">لوحة متابعة الطلب</h1>
                  <p className="text-xs text-slateText-muted mt-0.5">تفاصيل حالة طلبك المباشرة ومراحل المراجعة.</p>
                </div>

                <div className="clean-card p-6 space-y-5">
                  <div className="flex items-start justify-between flex-wrap gap-2">
                    <div>
                      <p className="text-[11px] font-mono font-bold text-brand-800 bg-brand-50 px-2 py-0.5 rounded border border-brand-100 inline-block">#{applicationId}</p>
                      <h3 className="text-base font-bold text-slateText-title mt-1">{job.title}</h3>
                    </div>
                    <span className="text-xs font-bold px-3 py-1 rounded-full bg-purple-50 text-purple-800 border border-purple-200">
                      {STAGES[stageIndex].label}
                    </span>
                  </div>

                  <div className="mt-6 overflow-x-auto no-scrollbar">
                    <div style={{ minWidth: 600 }}>

                    </div>

                </div>

                <InterviewCard job={job} interviewTime={interviewTime} now={now} attendance={attendance} setAttendance={setAttendance} simOffset={simOffset} setSimOffset={setSimOffset} />

                <div className="grid grid-cols-3 gap-3">
                  <div className="clean-card p-4 text-center">
                    <span className="text-[11px] font-bold text-slateText-muted block">حالة الـ CV</span>
                    <strong className="text-xs text-slateText-title block mt-1">تم الفحص ✓</strong>
                  </div>
                  <div className="clean-card p-4 text-center">
                    <span className="text-[11px] font-bold text-slateText-muted block">نوع المقابلة</span>
                    <strong className="text-xs text-slateText-title block mt-1">Google Meet</strong>
                  </div>
                  <div className="clean-card p-4 text-center">
                    <span className="text-[11px] font-bold text-slateText-muted block">التنبيهات</span>
                    <strong className="text-xs text-slateText-title block mt-1">2 جديد</strong>

              </div>

            {tab === "interviews" && (
              <div className="space-y-4">
                <h1 className="text-xl font-extrabold text-slateText-title">غرفة المقابلات الشخصية</h1>
                <InterviewCard job={job} interviewTime={interviewTime} now={now} attendance={attendance} setAttendance={setAttendance} simOffset={simOffset} setSimOffset={setSimOffset} />
              </div>
            )}

            {tab === "applications" && (
              <div className="space-y-3">
                <h1 className="text-xl font-extrabold text-slateText-title mb-3">طلبات التوظيف المسجلة</h1>
                <div className="clean-card p-4 flex items-center justify-between">
                  <div>
                    <strong className="text-xs font-bold text-slateText-title block">{job.title}</strong>
                    <span className="text-[11px] font-mono text-slateText-muted">#{applicationId} · مسجل حديثاً</span>
                  </div>
                  <span className="text-xs font-bold px-3 py-1 rounded-full bg-purple-50 text-purple-800 border border-purple-200">
                    {STAGES[stageIndex].label}
                  </span>
                </div>
              </div>
            )}

            {tab === "notifications" && (
              <div className="space-y-2.5">
                <h1 className="text-xl font-extrabold text-slateText-title mb-3">مركز التنبيهات</h1>
                {[
                  { t: "تمت جدولة المقابلة المرئية", d: "تم تحديد موعد المقابلة عبر Google Meet.", time: "منذ ساعتين", icon: Icon.Video, unread: true },
                  { t: "ترشيح للقائمة المختصرة", d: "تم قبول ملفك للمرحلة المتقدمة.", time: "منذ يوم", icon: Icon.CheckCircle2, unread: true },
                  { t: "تم فحص السيرة الذاتية", d: "اطلع مسؤول التوظيف على ملفك.", time: "منذ يومين", icon: Icon.FileText, unread: false },
                ].map((n, i) => (
                  <div key={i} className={`clean-card p-4 flex items-center justify-between gap-3 ${n.unread ? 'bg-brand-50/40 border-brand-200' : ''}`}>

                ))}
              </div>
            )}

            {tab === "profile" && (
              <div className="space-y-3">
                <h1 className="text-xl font-extrabold text-slateText-title mb-3">الملف الشخصي للمتقدم</h1>
                <div className="clean-card p-5 grid sm:grid-cols-2 gap-3 text-xs">

                  <div><span className="text-slateText-muted block">المدينة:</span> <strong className="text-slateText-title">{applicantData?.city || "الرياض"}</strong></div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    /* ---------------- Interview Card with Live Countdown ---------------- */
    function InterviewCard({ job, interviewTime, now, attendance, setAttendance, simOffset, setSimOffset }) {
      const diff = interviewTime - now;
      const joinWindowMs = 10 * 60 * 1000;
      const graceMs = 15 * 60 * 1000;
      const canJoin = diff <= joinWindowMs && diff > -graceMs && attendance !== "COMPLETED" && attendance !== "NO_SHOW";
      const missed = diff <= -graceMs;

      useEffect(() => {
        if (missed && attendance === "WAITING") setAttendance("NO_SHOW");
      }, [missed, attendance]);

      return (
        <div className="clean-card p-6 text-right space-y-4">
          <div className="flex items-center justify-between flex-wrap gap-2">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-purple-50 text-purple-700 flex items-center justify-center">
                <Icon.Video size={18} />
              </div>
              <div>
                <strong className="text-sm font-bold text-slateText-title block">مقابلة مرئية مجدولة (Google Meet)</strong>
                <span className="text-xs text-slateText-muted">{job.title}</span>
              </div>
            </div>
            <AttendanceBadge attendance={attendance} />
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 pt-2">
            <div className="p-3 rounded-xl bg-slate-50 border border-slate-100"><span className="text-[10px] font-bold text-slateText-muted block">التاريخ</span><strong className="text-xs text-slateText-title">25 أغسطس 2026</strong></div>
            <div className="p-3 rounded-xl bg-slate-50 border border-slate-100"><span className="text-[10px] font-bold text-slateText-muted block">الوقت</span><strong className="text-xs text-slateText-title">07:00 مساءً</strong></div>
            <div className="p-3 rounded-xl bg-slate-50 border border-slate-100"><span className="text-[10px] font-bold text-slateText-muted block">المدة</span><strong className="text-xs text-slateText-title">30 دقيقة</strong></div>
            <div className="p-3 rounded-xl bg-slate-50 border border-slate-100"><span className="text-[10px] font-bold text-slateText-muted block">المنصة</span><strong className="text-xs text-slateText-title">Google Meet</strong></div>
          </div>

          <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200 flex items-center justify-between flex-wrap gap-3">
            <div>
              <p className="text-[11px] font-bold text-slateText-muted">
                {diff > joinWindowMs ? "الوقت المتبقي حتى بدء المقابلة:" : missed ? "حالة نافذة المقابلة:" : "يمكنك الانضمام الآن:"}
              </p>
              <p className="text-xl font-bold text-slateText-title mt-0.5 font-mono" dir="ltr">
                {missed ? "انتهت الجلسة" : diff > joinWindowMs ? fmtHMS(diff) : "متاح للانضمام"}
              </p>
            </div>

            {!missed && attendance !== "COMPLETED" ? (
              <a
                href="https://meet.google.com/xyz-lawfirm-hr"
                target="_blank"
                onClick={() => setAttendance("JOINED")}
                className={`inline-flex items-center gap-2 text-xs font-bold px-6 h-10 rounded-xl shadow-sm transition-transform active:scale-95 ${
                  canJoin ? 'bg-purple-700 text-white hover:bg-purple-800' : 'bg-slate-200 text-slate-400 pointer-events-none'
                }`}
              >
                <Icon.PlayCircle size={16} /> <span>دخول المقابلة الآن</span>
              </a>
            ) : null}
          </div>

          <div className="pt-3 border-t border-slate-100 flex items-center justify-between flex-wrap gap-2 text-xs">
            <span className="text-[11px] text-slateText-muted flex items-center gap-1"><Icon.HelpCircle size={13} /> تسريع المؤقت للاختبار (مهلة 15 دقيقة):</span>
            <div className="flex gap-1.5">
              <button onClick={() => setSimOffset(s => s + 5)} className="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-100 hover:bg-slate-200 text-slateText-body flex items-center gap-1"><Icon.FastForward size={11} /> +5 د</button>
              <button onClick={() => setSimOffset(s => s + 20)} className="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-100 hover:bg-slate-200 text-slateText-body flex items-center gap-1"><Icon.FastForward size={11} /> +20 د</button>
              <button onClick={() => { setSimOffset(0); setAttendance("WAITING"); }} className="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-100 hover:bg-slate-200 text-slateText-body flex items-center gap-1"><Icon.RotateCcw size={11} /> إعادة</button>
            </div>
          </div>
        </div>
      );
    }

    function AttendanceBadge({ attendance }) {
      const map = {
        WAITING: { bg: 'bg-blue-50 text-blue-800 border-blue-200', label: "بانتظار الموعد" },
        JOINED: { bg: 'bg-green-50 text-green-800 border-green-200', label: "تم الانضمام ✓" },
        COMPLETED: { bg: 'bg-brand-50 text-brand-800 border-brand-200', label: "اكتملت المقابلة" },
        NO_SHOW: { bg: 'bg-red-50 text-red-800 border-red-200', label: "لم يتم الحضور" },
      }[attendance] || { bg: 'bg-blue-50 text-blue-800 border-blue-200', label: "قيد الانتظار" };
      return <span className={`text-[11px] font-bold px-3 py-1 rounded-full border ${map.bg}`}>{map.label}</span>;
    }

    /* ---------------- Secret Admin Auth Modal ---------------- */
    function AdminAuthModal({ onSuccess, onClose }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      const handleLogin = (e) => {
        e.preventDefault();
        const validEmails = ['bodasalem0098@gmail.com', 'moabdo038@gmail.com', 'admin@almustashar.com'];
        if (!validEmails.includes(email.trim().toLowerCase())) {
          setErrorMsg('البريد الإلكتروني غير مصرح له بالدخول.');
          return;
        }
        if (password.trim() !== '102044') {
          setErrorMsg('كلمة المرور غير صحيحة.');
          return;
        }
        onSuccess();
      };

      return (
        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in text-right">
          <div className="bg-white rounded-3xl p-6 max-w-sm w-full border border-slate-200 shadow-xl space-y-4">
            <div className="text-center">
              <div className="w-11 h-11 rounded-2xl bg-brand-50 text-brand-800 flex items-center justify-center mx-auto mb-2">
                <Icon.ShieldCheck size={22} />
              </div>
              <h3 className="font-bold text-base text-slateText-title">دخول نظام إدارة التوظيف</h3>
            </div>

            {errorMsg && <div className="p-2 bg-red-50 text-red-600 text-xs font-bold rounded-xl text-center">{errorMsg}</div>}

            <form onSubmit={handleLogin} className="space-y-3">
              <div>
                <label className="block text-[11px] font-bold text-slateText-body mb-1">البريد الإلكتروني</label>
                <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="bodasalem0098@gmail.com" required className="w-full h-10 px-3 rounded-xl text-xs outline-none border border-slate-200 bg-slate-50 text-right focus:border-brand-800" />
              </div>
              <div>
                <label className="block text-[11px] font-bold text-slateText-body mb-1">كلمة المرور</label>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••" required className="w-full h-10 px-3 rounded-xl text-xs outline-none border border-slate-200 bg-slate-50 text-center font-mono tracking-widest text-sm focus:border-brand-800" />
              </div>
              <div className="flex gap-2 pt-1">
                <button type="submit" className="flex-1 h-10 bg-brand-800 text-white rounded-xl text-xs font-bold shadow-sm hover:bg-brand-900">دخول</button>
                <button type="button" onClick={onClose} className="px-4 h-10 border border-slate-200 text-slateText-body rounded-xl text-xs font-bold hover:bg-slate-50">إلغاء</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    /* ---------------- Main App Root ---------------- */
    function App() {
      const [view, setView] = useState("landing");
      const [jobId, setJobId] = useState(JOBS[0].id);
      const job = JOBS.find(j => j.id === jobId) || JOBS[0];
      const [applied, setApplied] = useState(false);
      const [applicationId, setApplicationId] = useState("APP-10482");
      const [applicantData, setApplicantData] = useState(null);
      const [dashboardTab, setDashboardTab] = useState("overview");
      const [stageIndex, setStageIndex] = useState(4);
      const [isAdminModalOpen, setIsAdminModalOpen] = useState(false);

      const baseNow = useRef(Date.now()).current;
      const interviewTime = baseNow + 8 * 60 * 1000;
      const [simOffset, setSimOffset] = useState(0);
      const [attendance, setAttendance] = useState("WAITING");
      const [tick, setTick] = useState(0);
      useEffect(() => { const t = setInterval(() => setTick(x => x + 1), 1000); return () => clearInterval(t); }, []);
      const now = baseNow + tick * 1000 + simOffset * 60 * 1000;

      const openJob = (id) => { setJobId(id); setView("jobDetails"); };
      const startApply = () => setView("apply");

      const handleFormSubmit = (data) => {
        const id = "APP-" + (10000 + Math.floor(Math.random() * 89999));
        setApplicationId(id);
        setApplicantData(data);
        setApplied(true);
        setView("success");
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#F8FAF9]">
          <Navbar view={view} setView={setView} applied={applied} onOpenAdmin={() => setIsAdminModalOpen(true)} />

          <main className="flex-1">
            {view === "landing" && <Landing setView={setView} openJob={openJob} />}
            {view === "jobDetails" && <JobDetails job={job} setView={setView} startApply={startApply} />}
            {view === "apply" && <ApplicationForm job={job} setView={setView} onSubmit={handleFormSubmit} />}
            {view === "success" && <SuccessScreen applicationId={applicationId} job={job} goDashboard={() => setView("dashboard")} />}
            {view === "dashboard" && (
              <Dashboard
                job={job} applicationId={applicationId}
                stageIndex={stageIndex} tab={dashboardTab} setTab={setDashboardTab} setView={setView}
                simOffset={simOffset} setSimOffset={setSimOffset} attendance={attendance} setAttendance={setAttendance}
                interviewTime={interviewTime} now={now} applicantData={applicantData}
              />
            )}
          </main>

          {/* Footer */}
          <footer className="mt-auto bg-white border-t border-[#E2E8F0] py-6 px-4 text-xs text-slateText-muted">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-right">
              <div className="flex items-center gap-2">
                <Icon.Scale size={16} color="#0C3831" />
                <span className="font-bold text-slateText-body">مكتب المستشار للمحاماة والاستشارات القانونية — الرياض</span>
              </div>
              <div 
                onClick={() => setIsAdminModalOpen(true)} 
                className="cursor-default select-none text-[11px] text-slateText-light hover:text-slateText-muted transition-colors"
              >
                © 2026 جميع الحقوق محفوظة لمكتب المستشار للمحاماة · بوابة التوظيف الذكية
              </div>
            </div>
          </footer>

          {isAdminModalOpen && (
            <AdminAuthModal 
              onSuccess={() => {
                setIsAdminModalOpen(false);
                setStageIndex(4);
                setView("dashboard");
                alert("تم تسجيل الدخول بنجاح.");
              }}
              onClose={() => setIsAdminModalOpen(false)}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
