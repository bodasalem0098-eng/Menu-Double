    function fmtHMS(ms) {
      if (ms < 0) ms = 0;
      const s = Math.floor(ms / 1000);
      const h = String(Math.floor(s / 3600)).padStart(2, "0");
      const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
      const sec = String(s % 60).padStart(2, "0");
      return `${h}:${m}:${sec}`;
    }

      if (status === "ACCEPTED") return { bg: c.successSoft, text: c.successText };
      if (status === "REJECTED") return { bg: c.dangerSoft, text: c.dangerText };
      if (status === "DECISION" || status === "UNDER_REVIEW") return { bg: c.infoSoft, text: c.infoText };
      if (status === "INTERVIEW_SCHEDULED" || status === "INTERVIEW_COMPLETED") return { bg: c.accentSoft, text: c.accentText };
      return { bg: c.primarySoft, text: c.primaryText };

      return (
        <div style={{ display: "flex", flexDirection: isH ? "row" : "column", width: "100%" }}>
          {steps.map((s, i) => {
            const done = i < activeIndex;
            const current = i === activeIndex;
            const nodeColor = done ? c.success : current ? c.primary : c.borderStrong;
            const nodeBg = done ? c.successSoft : current ? c.primarySoft : "transparent";
            return (
              <div key={s.key || i} className={isH ? "flex-1 flex flex-col items-center" : "flex flex-row items-start gap-3 pb-6"}>
                <div className={isH ? "flex items-center w-full" : "flex flex-col items-center"}>
                  {isH && (
                    <>
                      {i !== 0 && <div style={{ flex: 1, height: 2, background: done || current ? c.success : c.border }} />}
                      <div
                        style={{
                          width: 32, height: 32, borderRadius: 999, border: `2px solid ${nodeColor}`,
                          background: nodeBg, display: "flex", alignItems: "center", justifyContent: "center",
                          color: nodeColor, flexShrink: 0,
                        }}
                      >
                        {done ? <Icon.Check size={14} color={c.success} /> : current ? (

                <div className={isH ? "mt-2 text-center px-1" : ""}>

                    <span style={{ background: c.success }} className="w-1.5 h-1.5 rounded-full shrink-0" />
                    {r}
                  </li>
                ))}
              </ul>
            </div>

            <div className="mt-6">
              <h3 style={{ color: c.text }} className="text-xs md:text-sm font-bold mb-2">المهارات المطلوبة</h3>
              <div className="flex flex-wrap gap-1.5">
                {job.skills.map(s => (
                  <span key={s} style={{ background: c.primarySoft, color: c.primaryText }} className="text-xs font-bold px-3 py-1 rounded-full">{s}</span>
                ))}
              </div>
            </div>

            <div style={{ borderTop: `1px solid ${c.border}` }} className="mt-8 pt-5 flex items-center justify-between flex-wrap gap-3">
              <span style={{ color: c.textFaint }} className="text-xs font-semibold">{job.applicants} مرشحين تقدموا لهذه الوظيفة</span>
              <button
                onClick={startApply}
                style={{ background: c.primary, color: "#fff" }}
                className="inline-flex items-center gap-2 text-xs font-bold px-7 h-11 rounded-full hover:opacity-90 shadow-sm"
              >
                بدء التقديم على هذه الوظيفة ➔
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ---------------- 6-Step Application Form ---------------- */
    const FORM_STEPS = ["المعلومات الشخصية", "المعلومات المهنية", "الخبرات والمهارات", "المستندات", "أسئلة الوظيفة", "المراجعة والإرسال"];

    function ApplicationForm({ c, job, setView, onSubmit }) {
      const [step, setStep] = useState(0);
      const [data, setData] = useState({
        fullName: "", phone: "", email: "", nationality: "", city: "", dob: "",
        currentJob: "", yearsExperience: "", previousCompany: "", education: "بكالوريوس محاسبة",
        skills: "", certifications: "", expectedSalary: "", noticePeriod: "",
        photoBase64: null, cvFile: null, cvError: "", linkedin: "", portfolio: "",
        answers: {},
      });
      const [stepError, setStepError] = useState("");

      const set = (k, v) => setData(d => ({ ...d, [k]: v }));
      const setAnswer = (id, v) => setData(d => ({ ...d, answers: { ...d.answers, [id]: v } }));

      const handlePhotoUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => set("photoBase64", event.target.result);
        reader.readAsDataURL(file);
      };

      const handleCvUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        set("cvFile", { name: file.name, size: (file.size / 1024).toFixed(0) + " KB" });
      };

      const validate = () => {
        if (step === 0 && (!data.fullName || !data.phone)) return "الاسم ورقم الهاتف مطلوبان.";
        if (step === 1 && !data.yearsExperience) return "يرجى كتابة سنوات الخبرة.";
        return "";
      };

      const next = () => {
        const e = validate();
        if (e) { setStepError(e); return; }
        setStepError("");
        if (step < FORM_STEPS.length - 1) setStep(step + 1);
      };
      const back = () => { setStepError(""); step > 0 ? setStep(step - 1) : setView("jobDetails"); };

      return (
        <div className="max-w-3xl mx-auto px-5 md:px-8 py-8 animate-fade-in text-right">
          <div className="flex items-center justify-between mb-2">
            <span style={{ color: c.textMuted }} className="text-xs font-bold">التقديم على: {job.title}</span>
            <span style={{ color: c.textFaint }} className="text-[11px]">حفظ تلقائي للمسودة</span>
          </div>

          <div className="my-6">
            <PipelineRail c={c} steps={FORM_STEPS.map((t, i) => ({ key: i, label: t }))} activeIndex={step} orientation="horizontal" size="sm" />
          </div>

          <div style={{ background: c.surface, border: `1px solid ${c.border}`, boxShadow: c.shadow }} className="rounded-3xl p-6 md:p-8">
            {step === 0 && (
              <div className="grid sm:grid-cols-2 gap-3.5">
                <Field c={c} label="الاسم الكامل *" value={data.fullName} onChange={v => set("fullName", v)} placeholder="اكتب اسمك كاملاً" />
                <Field c={c} label="رقم الهاتف (واتساب) *" value={data.phone} onChange={v => set("phone", v)} placeholder="05XXXXXXXX" />
                <Field c={c} label="البريد الإلكتروني" value={data.email} onChange={v => set("email", v)} placeholder="example@email.com" />
                <Field c={c} label="الجنسية" value={data.nationality} onChange={v => set("nationality", v)} placeholder="سعودي / مصري / أردني..." />
                <Field c={c} label="مدينة الإقامة" value={data.city} onChange={v => set("city", v)} placeholder="الرياض" />
                <Field c={c} label="العمر" type="number" value={data.dob} onChange={v => set("dob", v)} placeholder="28" />
              </div>
            )}

            {step === 1 && (
              <div className="grid sm:grid-cols-2 gap-3.5">
                <Field c={c} label="المسمى الوظيفي الحالي" value={data.currentJob} onChange={v => set("currentJob", v)} placeholder="محاسب عام" />
                <Field c={c} label="سنوات الخبرة *" type="number" value={data.yearsExperience} onChange={v => set("yearsExperience", v)} placeholder="3" />
                <Field c={c} label="المؤهل العلمي" value={data.education} onChange={v => set("education", v)} placeholder="بكالوريوس محاسبة" />
                <Field c={c} label="الراتب المتوقع (ريال)" value={data.expectedSalary} onChange={v => set("expectedSalary", v)} placeholder="8,500 ريال" />
              </div>
            )}

            {step === 2 && (
              <div className="space-y-3.5">
                <Field c={c} label="البرامج المحاسبية والأنظمة التي تجيدها" value={data.skills} onChange={v => set("skills", v)} placeholder="Odoo, SAP, Excel, سماك, دفترة..." />
                <Field c={c} label="الشهادات المهنية إن وجدت (SOCPA, CMA, IFRS)" value={data.certifications} onChange={v => set("certifications", v)} placeholder="شهادات معتمدة..." />
              </div>
            )}

            {step === 3 && (
              <div className="grid sm:grid-cols-2 gap-4">
                <div style={{ border: `1.5px dashed ${c.borderStrong}`, background: c.surfaceAlt }} className="rounded-2xl p-4 text-center">
                  <label className="block text-xs font-bold mb-2">الصورة الشخصية</label>
                  {data.photoBase64 ? (
                    <img src={data.photoBase64} alt="" className="w-16 h-16 rounded-xl object-cover mx-auto" />
                  ) : (
                    <label className="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white rounded-xl text-xs font-bold cursor-pointer border">
                      <Icon.Upload size={14} /> <span>رفع صورة</span>
                      <input type="file" accept="image/*" onChange={handlePhotoUpload} className="hidden" />
                    </label>
                  )}
                </div>

                <div style={{ border: `1.5px dashed ${c.borderStrong}`, background: c.surfaceAlt }} className="rounded-2xl p-4 text-center">
                  <label className="block text-xs font-bold mb-2">السيرة الذاتية (CV)</label>
                  {data.cvFile ? (
                    <span className="text-xs font-bold text-green-600 block py-2">✓ {data.cvFile.name}</span>
                  ) : (
                    <label className="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white rounded-xl text-xs font-bold cursor-pointer border">
                      <Icon.Upload size={14} /> <span>رفع ملف CV</span>
                      <input type="file" accept=".pdf,.doc,.docx" onChange={handleCvUpload} className="hidden" />
                    </label>
                  )}
                </div>
              </div>
            )}

            {step === 4 && (
              <div className="space-y-4">
                {job.questions.map(q => (
                  <div key={q.id}>
                    <span style={{ color: c.textMuted }} className="text-xs font-bold block mb-1">{q.label}</span>
                    {q.type === "text" && (
                      <input value={data.answers[q.id] || ""} onChange={e => setAnswer(q.id, e.target.value)} style={{ border: `1px solid ${c.border}`, background: c.surfaceAlt, color: c.text }} className="w-full h-10 rounded-xl px-3 text-xs outline-none text-right" />
                    )}
                    {q.type === "select" && (
                      <select value={data.answers[q.id] || ""} onChange={e => setAnswer(q.id, e.target.value)} style={{ border: `1px solid ${c.border}`, background: c.surfaceAlt, color: c.text }} className="w-full h-10 rounded-xl px-3 text-xs outline-none">
                        <option value="">اختر...</option>
                        {q.options.map(o => <option key={o} value={o}>{o}</option>)}
                      </select>
                    )}
                    {q.type === "yesno" && (
                      <div className="flex gap-2">
                        {["نعم", "لا"].map(opt => (
                          <button key={opt} type="button" onClick={() => setAnswer(q.id, opt)} style={{
                            border: `1px solid ${data.answers[q.id] === opt ? c.primary : c.border}`,
                            background: data.answers[q.id] === opt ? c.primarySoft : c.surfaceAlt,
                            color: data.answers[q.id] === opt ? c.primaryText : c.textMuted,
                          }} className="px-5 h-9 rounded-full text-xs font-bold">{opt}</button>
                        ))}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}

            {step === 5 && (
              <div className="space-y-3 text-xs">
                <div style={{ background: c.surfaceAlt, border: `1px solid ${c.border}` }} className="rounded-xl p-3 space-y-1.5">
                  <div className="flex justify-between"><span>الاسم:</span><strong>{data.fullName}</strong></div>
                  <div className="flex justify-between"><span>الهاتف:</span><strong dir="ltr">{data.phone}</strong></div>
                  <div className="flex justify-between"><span>الخبرة:</span><strong>{data.yearsExperience} سنوات</strong></div>
                  <div className="flex justify-between"><span>الراتب المتوقع:</span><strong>{data.expectedSalary || "غير محدد"}</strong></div>
                </div>
                <p style={{ color: c.textFaint }} className="text-[11px]">بالضغط على إرسال، تؤكد صحة البيانات المدخلة وموافقتك على مراجعتها من لجنة التوظيف.</p>
              </div>
            )}

            {stepError && <p style={{ color: c.dangerText }} className="text-xs mt-3 flex items-center gap-1.5"><Icon.AlertCircle size={13} />{stepError}</p>}

            <div style={{ borderTop: `1px solid ${c.border}` }} className="mt-6 pt-5 flex items-center justify-between">
              <button type="button" onClick={back} style={{ color: c.textMuted }} className="inline-flex items-center gap-1 text-xs font-bold">➔ السابق</button>
              {step < FORM_STEPS.length - 1 ? (
                <button type="button" onClick={next} style={{ background: c.primary, color: "#fff" }} className="inline-flex items-center gap-1 text-xs font-bold px-6 h-10 rounded-full hover:opacity-90">المتابعة ➔</button>
              ) : (
                <button type="button" onClick={() => onSubmit(data)} style={{ background: c.primary, color: "#fff" }} className="inline-flex items-center gap-1 text-xs font-bold px-7 h-10 rounded-full hover:opacity-90 shadow-sm">إرسال الطلب نهائياً ✓</button>
              )}
            </div>
          </div>
        </div>
      );
    }

    function Field({ c, label, value, onChange, placeholder, type = "text" }) {
      return (
        <label className="block text-right">
          <span style={{ color: c.textMuted }} className="text-[11px] font-bold block mb-1">{label}</span>
          <div style={{ border: `1px solid ${c.border}`, background: c.surfaceAlt }} className="flex items-center px-3 h-10 rounded-xl">
            <input
              type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder}
              style={{ color: c.text, background: "transparent" }} className="text-xs outline-none w-full placeholder:opacity-50 text-right"
            />
          </div>
        </label>
      );
    }

    /* ---------------- Success Screen ---------------- */
    function SuccessScreen({ c, applicationId, job, goDashboard }) {
      return (
        <div className="max-w-md mx-auto px-5 py-16 text-center animate-fade-in space-y-4">
          <div style={{ background: c.successSoft }} className="w-16 h-16 rounded-full flex items-center justify-center mx-auto border border-green-200">
            <Icon.CheckCircle2 size={32} color={c.success} />
          </div>
          <h1 style={{ fontFamily: "Sora", color: c.text }} className="text-2xl font-extrabold">تم استلام طلبك بنجاح!</h1>
          <p style={{ color: c.textMuted }} className="text-xs leading-relaxed">
            تم استلام ملفك للتقديم على وظيفة <strong style={{ color: c.text }}>{job.title}</strong> في مكتب المستشار للمحاماة.
          </p>
          <div style={{ background: c.surfaceAlt, border: `1px solid ${c.border}`, fontFamily: "JetBrains Mono" }} className="inline-block px-5 py-2 rounded-full text-xs font-bold">
            <span style={{ color: c.textFaint }}>رقم الطلب: </span>
            <span style={{ color: c.primaryText }}>#{applicationId}</span>
          </div>
          <div className="pt-3">
            <button onClick={goDashboard} style={{ background: c.primary, color: "#fff" }} className="inline-flex items-center gap-2 text-xs font-bold px-7 h-11 rounded-full shadow-sm hover:opacity-90">
              الدخول للوحة متابعة الطلب والمقابلة ➔
            </button>
          </div>
        </div>
      );
    }

    /* ---------------- Full Applicant Dashboard ---------------- */
    function Dashboard({ c, theme, setTheme, job, applicationId, stageIndex, tab, setTab, setView, simOffset, setSimOffset, attendance, setAttendance, interviewTime, now, applicantData }) {
      const nav = [
        { id: "overview", label: "نظرة عامة والمسار", icon: Icon.LayoutDashboard },
        { id: "interviews", label: "غرفة المقابلة المرئية", icon: Icon.Video },
        { id: "applications", label: "طلباتي المسجلة", icon: Icon.FileText },
        { id: "notifications", label: "التنبيهات", icon: Icon.Bell },
        { id: "profile", label: "ملفي الشخصي", icon: Icon.User },
        { id: "settings", label: "الإعدادات والمظهر", icon: Icon.Settings },
      ];

      const status = STAGES[stageIndex].key;
      const sc = statusColors(c, status);

      return (
        <div className="max-w-6xl mx-auto px-5 md:px-8 py-8 flex flex-col md:flex-row gap-6 animate-fade-in text-right">
          
          {/* Sidebar */}
          <div style={{ borderLeft: `1px solid ${c.border}` }} className="hidden md:flex flex-col w-56 shrink-0 pl-5">
            {nav.map(n => (
              <button key={n.id} onClick={() => setTab(n.id)} style={{
                background: tab === n.id ? c.primarySoft : "transparent",
                color: tab === n.id ? c.primaryText : c.textMuted,
              }} className="flex items-center gap-2 px-3.5 h-10 rounded-xl text-xs font-bold mb-1 transition-colors">
                <n.icon size={16} /> <span>{n.label}</span>
              </button>
            ))}
            <button onClick={() => setView("landing")} style={{ color: c.textFaint }} className="flex items-center gap-2 px-3.5 h-10 rounded-xl text-xs font-medium mt-6">
              <Icon.LogOut size={15} /> <span>الرئيسية</span>
            </button>
          </div>

          {/* Mobile Tabs */}
          <div className="flex md:hidden gap-1.5 overflow-x-auto pb-2 no-scrollbar">
            {nav.map(n => (
              <button key={n.id} onClick={() => setTab(n.id)} style={{
                background: tab === n.id ? c.primarySoft : c.surfaceAlt, color: tab === n.id ? c.primaryText : c.textMuted,
              }} className="shrink-0 flex items-center gap-1 px-3 h-8 rounded-full text-[11px] font-bold">
                <n.icon size={12} /> {n.label}
              </button>
            ))}
          </div>

          {/* Main Tab Content */}
          <div className="flex-1 min-w-0 space-y-5">
            
            {tab === "overview" && (
              <div className="space-y-4">
                <div>
                  <h1 style={{ fontFamily: "Sora", color: c.text }} className="text-xl font-extrabold">مرحباً بك في لوحة المتقدم</h1>
                  <p style={{ color: c.textMuted }} className="text-xs mt-0.5">تفاصيل حالة طلبك المباشرة ومراحل المراجعة.</p>
                </div>

                <div style={{ background: c.surface, border: `1px solid ${c.border}`, boxShadow: c.shadow }} className="rounded-3xl p-6">
                  <div className="flex items-start justify-between flex-wrap gap-2">
                    <div>
                      <p style={{ color: c.textFaint }} className="text-[11px] font-mono font-bold">رقم الطلب: #{applicationId}</p>
                      <h3 style={{ color: c.text, fontFamily: "Sora" }} className="text-base font-bold mt-0.5">{job.title}</h3>
                    </div>
                    <span style={{ background: sc.bg, color: sc.text }} className="text-xs font-bold px-3 py-1 rounded-full">{STAGES[stageIndex].label}</span>
                  </div>

                  <div className="mt-6 overflow-x-auto no-scrollbar">
                    <div style={{ minWidth: 600 }}>
                      <PipelineRail c={c} steps={STAGES} activeIndex={stageIndex} orientation="horizontal" size="sm" />
                    </div>
                  </div>
                </div>

                {/* Interview Card if scheduled */}
                <InterviewCard c={c} job={job} interviewTime={interviewTime} now={now} attendance={attendance} setAttendance={setAttendance} simOffset={simOffset} setSimOffset={setSimOffset} />

                {/* Stats */}
                <div className="grid grid-cols-3 gap-3">
                  <div style={{ background: c.surfaceAlt, border: `1px solid ${c.border}` }} className="rounded-2xl p-4 text-center">
                    <span style={{ color: c.textFaint }} className="text-[11px] font-bold block">حالة الـ CV</span>
                    <strong style={{ color: c.text }} className="text-xs block mt-1">تم الفحص ✓</strong>
                  </div>
                  <div style={{ background: c.surfaceAlt, border: `1px solid ${c.border}` }} className="rounded-2xl p-4 text-center">
                    <span style={{ color: c.textFaint }} className="text-[11px] font-bold block">نوع المقابلة</span>
                    <strong style={{ color: c.text }} className="text-xs block mt-1">Google Meet</strong>
                  </div>
                  <div style={{ background: c.surfaceAlt, border: `1px solid ${c.border}` }} className="rounded-2xl p-4 text-center">
                    <span style={{ color: c.textFaint }} className="text-[11px] font-bold block">التنبيهات</span>
                    <strong style={{ color: c.text }} className="text-xs block mt-1">2 جديد</strong>
                  </div>
                </div>
              </div>
            )}

            {tab === "interviews" && (
              <div className="space-y-4">
                <h1 style={{ fontFamily: "Sora", color: c.text }} className="text-xl font-extrabold">غرفة المقابلات الشخصية</h1>
                <InterviewCard c={c} job={job} interviewTime={interviewTime} now={now} attendance={attendance} setAttendance={setAttendance} simOffset={simOffset} setSimOffset={setSimOffset} expanded />
              </div>
            )}

            {tab === "applications" && (
              <div className="space-y-3">
                <h1 style={{ fontFamily: "Sora", color: c.text }} className="text-xl font-extrabold mb-3">طلبات التوظيف المسجلة</h1>
                <div style={{ background: c.surface, border: `1px solid ${c.border}` }} className="rounded-2xl p-4 flex items-center justify-between">
                  <div>
                    <strong style={{ color: c.text }} className="text-xs font-bold block">{job.title}</strong>
                    <span style={{ color: c.textFaint }} className="text-[11px] font-mono font-semibold">#{applicationId} · مسجل حديثاً</span>
                  </div>
                  <span style={{ background: sc.bg, color: sc.text }} className="text-xs font-bold px-3 py-1 rounded-full">{STAGES[stageIndex].label}</span>
                </div>
              </div>
            )}

            {tab === "notifications" && (
              <div className="space-y-2.5">
                <h1 style={{ fontFamily: "Sora", color: c.text }} className="text-xl font-extrabold mb-3">مركز التنبيهات</h1>
                {[
                  { t: "تمت جدولة المقابلة المرئية", d: "تم تحديد موعد المقابلة عبر Google Meet.", time: "منذ ساعتين", icon: Icon.Video, unread: true },
                  { t: "ترشيح للقائمة المختصرة", d: "تم قبول ملفك للمرحلة المتقدمة.", time: "منذ يوم", icon: Icon.CheckCircle2, unread: true },
                  { t: "تم فحص السيرة الذاتية", d: "اطلع مسؤول التوظيف على ملفك.", time: "منذ يومين", icon: Icon.FileText, unread: false },
                ].map((n, i) => (
                  <div key={i} style={{ background: n.unread ? c.primarySoft : c.surface, border: `1px solid ${c.border}` }} className="rounded-2xl p-4 flex items-center justify-between gap-3">
                    <div className="flex items-center gap-3">
                      <div style={{ background: c.surfaceAlt, color: c.primaryText }} className="w-9 h-9 rounded-xl flex items-center justify-center shrink-0">
                        <n.icon size={16} />
                      </div>
                      <div>
                        <strong style={{ color: c.text }} className="text-xs font-bold block">{n.t}</strong>
                        <span style={{ color: c.textMuted }} className="text-[11px] block mt-0.5">{n.d}</span>
                      </div>
                    </div>
                    <span style={{ color: c.textFaint }} className="text-[10px] shrink-0 font-medium">{n.time}</span>
                  </div>
                ))}
              </div>
            )}

            {tab === "profile" && (
              <div className="space-y-3">
                <h1 style={{ fontFamily: "Sora", color: c.text }} className="text-xl font-extrabold mb-3">الملف الشخصي للمتقدم</h1>
                <div style={{ background: c.surface, border: `1px solid ${c.border}` }} className="rounded-3xl p-5 grid sm:grid-cols-2 gap-3 text-xs">
                  <div><span style={{ color: c.textFaint }} className="block">الاسم الكامل:</span> <strong>{applicantData?.fullName || "أحمد علي"}</strong></div>
                  <div><span style={{ color: c.textFaint }} className="block">رقم الهاتف:</span> <strong dir="ltr">{applicantData?.phone || "0501234567"}</strong></div>
                  <div><span style={{ color: c.textFaint }} className="block">المؤهل:</span> <strong>{applicantData?.education || "بكالوريوس محاسبة"}</strong></div>
                  <div><span style={{ color: c.textFaint }} className="block">المدينة:</span> <strong>{applicantData?.city || "الرياض"}</strong></div>
                </div>
              </div>
            )}

            {tab === "settings" && (
              <div className="space-y-3">
                <h1 style={{ fontFamily: "Sora", color: c.text }} className="text-xl font-extrabold mb-3">الإعدادات والمظهر</h1>
                <div style={{ background: c.surface, border: `1px solid ${c.border}` }} className="rounded-2xl p-4 flex items-center justify-between">
                  <div>
                    <strong style={{ color: c.text }} className="text-xs font-bold block">مظهر المنصة</strong>
                    <span style={{ color: c.textMuted }} className="text-[11px]">التبديل بين الوضع الليلي والنهاري.</span>
                  </div>
                  <button onClick={() => setTheme(theme === "light" ? "dark" : "light")} style={{ border: `1px solid ${c.borderStrong}`, color: c.text }} className="text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-1.5">
                    {theme === "light" ? <Icon.Moon size={14} /> : <Icon.Sun size={14} />} {theme === "light" ? "الوضع الليلي" : "الوضع النهاري"}
                  </button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    /* ---------------- Interview Card with Live Countdown & Simulator ---------------- */
    function InterviewCard({ c, job, interviewTime, now, attendance, setAttendance, simOffset, setSimOffset }) {
      const diff = interviewTime - now;
      const joinWindowMs = 10 * 60 * 1000;
      const graceMs = 15 * 60 * 1000;
      const canJoin = diff <= joinWindowMs && diff > -graceMs && attendance !== "COMPLETED" && attendance !== "NO_SHOW";
      const missed = diff <= -graceMs;

      useEffect(() => {
        if (missed && attendance === "WAITING") setAttendance("NO_SHOW");
      }, [missed, attendance]);

      return (
        <div style={{ background: c.surface, border: `1px solid ${c.border}`, boxShadow: c.shadow }} className="rounded-3xl p-6 text-right space-y-4">
          <div className="flex items-center justify-between flex-wrap gap-2">
            <div className="flex items-center gap-3">
              <div style={{ background: c.accentSoft, color: c.accentText }} className="w-10 h-10 rounded-xl flex items-center justify-center">
                <Icon.Video size={18} />
              </div>
              <div>
                <strong style={{ color: c.text }} className="text-sm font-bold block">مقابلة مرئية مجدولة (Google Meet)</strong>
                <span style={{ color: c.textMuted }} className="text-xs">{job.title}</span>
              </div>
            </div>
            <AttendanceBadge c={c} attendance={attendance} />
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 pt-2">
            <div style={{ background: c.surfaceAlt }} className="p-3 rounded-xl"><span style={{ color: c.textFaint }} className="text-[10px] font-bold block">التاريخ</span><strong style={{ color: c.text }} className="text-xs">25 أغسطس 2026</strong></div>
            <div style={{ background: c.surfaceAlt }} className="p-3 rounded-xl"><span style={{ color: c.textFaint }} className="text-[10px] font-bold block">الوقت</span><strong style={{ color: c.text }} className="text-xs">07:00 مساءً</strong></div>
            <div style={{ background: c.surfaceAlt }} className="p-3 rounded-xl"><span style={{ color: c.textFaint }} className="text-[10px] font-bold block">المدة</span><strong style={{ color: c.text }} className="text-xs">30 دقيقة</strong></div>
            <div style={{ background: c.surfaceAlt }} className="p-3 rounded-xl"><span style={{ color: c.textFaint }} className="text-[10px] font-bold block">المنصة</span><strong style={{ color: c.text }} className="text-xs">Google Meet</strong></div>
          </div>

          <div style={{ background: c.surfaceAlt, border: `1px solid ${c.border}` }} className="rounded-2xl p-4 flex items-center justify-between flex-wrap gap-3">
            <div>
              <p style={{ color: c.textFaint }} className="text-[11px] font-bold">
                {diff > joinWindowMs ? "الوقت المتبقي حتى بدء المقابلة:" : missed ? "حالة نافذة المقابلة:" : "يمكنك الانضمام الآن:"}
              </p>
              <p style={{ color: c.text, fontFamily: "JetBrains Mono" }} className="text-xl font-bold mt-0.5" dir="ltr">
                {missed ? "انتهت الجلسة" : diff > joinWindowMs ? fmtHMS(diff) : "متاح للانضمام"}
              </p>
            </div>

            {!missed && attendance !== "COMPLETED" ? (
              <a
                href="https://meet.google.com/xyz-lawfirm-hr"
                target="_blank"
                onClick={() => setAttendance("JOINED")}
                style={{ background: canJoin ? c.primary : c.border, color: canJoin ? "#fff" : c.textFaint, pointerEvents: canJoin ? "auto" : "none" }}
                className="inline-flex items-center gap-2 text-xs font-bold px-6 h-10 rounded-full shadow-sm"
              >
                <Icon.PlayCircle size={16} /> <span>دخول المقابلة الآن</span>
              </a>
            ) : null}
          </div>

          {/* Prototype Time Accelerator */}
          <div style={{ borderTop: `1px solid ${c.border}` }} className="pt-3 flex items-center justify-between flex-wrap gap-2 text-xs">
            <span style={{ color: c.textFaint }} className="text-[11px] flex items-center gap-1"><Icon.HelpCircle size={13} /> تسريع المؤقت للاختبار (مهلة 15 دقيقة):</span>
            <div className="flex gap-1.5">
              <button onClick={() => setSimOffset(s => s + 5)} style={{ border: `1px solid ${c.border}`, color: c.textMuted }} className="px-2.5 py-1 rounded-full text-[11px] font-bold flex items-center gap-1"><Icon.FastForward size={11} /> +5 د</button>
              <button onClick={() => setSimOffset(s => s + 20)} style={{ border: `1px solid ${c.border}`, color: c.textMuted }} className="px-2.5 py-1 rounded-full text-[11px] font-bold flex items-center gap-1"><Icon.FastForward size={11} /> +20 د</button>
              <button onClick={() => { setSimOffset(0); setAttendance("WAITING"); }} style={{ border: `1px solid ${c.border}`, color: c.textMuted }} className="px-2.5 py-1 rounded-full text-[11px] font-bold flex items-center gap-1"><Icon.RotateCcw size={11} /> إعادة</button>
            </div>
          </div>
        </div>
      );
    }

    function AttendanceBadge({ c, attendance }) {
      const map = {
        WAITING: { bg: c.infoSoft, text: c.infoText, label: "بانتظار الموعد" },
        JOINED: { bg: c.successSoft, text: c.successText, label: "تم الانضمام ✓" },
        COMPLETED: { bg: c.primarySoft, text: c.primaryText, label: "اكتملت المقابلة" },
        NO_SHOW: { bg: c.dangerSoft, text: c.dangerText, label: "لم يتم الحضور" },
      }[attendance] || { bg: c.infoSoft, text: c.infoText, label: "قيد الانتظار" };
      return <span style={{ background: map.bg, color: map.text }} className="text-[11px] font-bold px-3 py-1 rounded-full">{map.label}</span>;
    }

    /* ---------------- Secret Admin Auth Modal ---------------- */
    function AdminAuthModal({ onSuccess, onClose, c }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      const handleLogin = (e) => {
        e.preventDefault();
        const validEmails = ['bodasalem0098@gmail.com', 'moabdo038@gmail.com', 'admin@almustashar.com'];
        if (!validEmails.includes(email.trim().toLowerCase())) {
          setErrorMsg('البريد الإلكتروني غير مصرح له بالدخول.');
          return;
        }
        if (password.trim() !== '102044') {
          setErrorMsg('كلمة المرور غير صحيحة.');
          return;
        }
        onSuccess();
      };

      return (
        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in text-right">
          <div style={{ background: c.surface, border: `1px solid ${c.border}`, boxShadow: c.shadow }} className="rounded-3xl p-6 max-w-sm w-full space-y-4">
            <div className="text-center">
              <div style={{ background: c.primarySoft, color: c.primaryText }} className="w-11 h-11 rounded-2xl flex items-center justify-center mx-auto mb-2">
                <Icon.ShieldCheck size={22} />
              </div>
              <h3 style={{ color: c.text }} className="font-bold text-base">دخول نظام إدارة التوظيف</h3>
            </div>

            {errorMsg && <div className="p-2 bg-red-50 text-red-600 text-xs font-bold rounded-xl text-center">{errorMsg}</div>}

            <form onSubmit={handleLogin} className="space-y-3">
              <div>
                <label className="block text-[11px] font-bold mb-1">البريد الإلكتروني</label>
                <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="bodasalem0098@gmail.com" required style={{ border: `1px solid ${c.border}`, background: c.surfaceAlt, color: c.text }} className="w-full h-10 px-3 rounded-xl text-xs outline-none text-right" />
              </div>
              <div>
                <label className="block text-[11px] font-bold mb-1">كلمة المرور</label>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••" required style={{ border: `1px solid ${c.border}`, background: c.surfaceAlt, color: c.text }} className="w-full h-10 px-3 rounded-xl text-xs outline-none text-center font-mono" />
              </div>
              <div className="flex gap-2 pt-1">
                <button type="submit" style={{ background: c.primary, color: "#fff" }} className="flex-1 h-10 rounded-xl text-xs font-bold shadow-sm">دخول</button>
                <button type="button" onClick={onClose} style={{ border: `1px solid ${c.border}`, color: c.text }} className="px-4 h-10 rounded-xl text-xs font-bold">إلغاء</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    /* ---------------- Main Root App ---------------- */
    function App() {
      const [theme, setTheme] = useState("light");
      const c = palette[theme];
      const [view, setView] = useState("landing");
      const [jobId, setJobId] = useState(JOBS[0].id);
      const job = JOBS.find(j => j.id === jobId) || JOBS[0];
      const [applied, setApplied] = useState(false);
      const [applicationId, setApplicationId] = useState("APP-10482");
      const [applicantData, setApplicantData] = useState(null);
      const [dashboardTab, setDashboardTab] = useState("overview");
      const [stageIndex, setStageIndex] = useState(4);
      const [isAdminModalOpen, setIsAdminModalOpen] = useState(false);

      const baseNow = useRef(Date.now()).current;
      const interviewTime = baseNow + 8 * 60 * 1000;
      const [simOffset, setSimOffset] = useState(0);
      const [attendance, setAttendance] = useState("WAITING");
      const [tick, setTick] = useState(0);
      useEffect(() => { const t = setInterval(() => setTick(x => x + 1), 1000); return () => clearInterval(t); }, []);
      const now = baseNow + tick * 1000 + simOffset * 60 * 1000;

      const openJob = (id) => { setJobId(id); setView("jobDetails"); };
      const startApply = () => setView("apply");

      const handleFormSubmit = (data) => {
        const id = "APP-" + (10000 + Math.floor(Math.random() * 89999));
        setApplicationId(id);
        setApplicantData(data);
        setApplied(true);
        setView("success");
      };

      return (
        <div style={{ background: c.bg, color: c.text, minHeight: "100vh" }} className="flex flex-col">
          <Navbar c={c} theme={theme} setTheme={setTheme} view={view} setView={setView} applied={applied} onOpenAdmin={() => setIsAdminModalOpen(true)} />

          <main className="flex-1">
            {view === "landing" && <Landing c={c} setView={setView} openJob={openJob} />}
            {view === "jobDetails" && <JobDetails c={c} job={job} setView={setView} startApply={startApply} />}
            {view === "apply" && <ApplicationForm c={c} job={job} setView={setView} onSubmit={handleFormSubmit} />}
            {view === "success" && <SuccessScreen c={c} applicationId={applicationId} job={job} goDashboard={() => setView("dashboard")} />}
            {view === "dashboard" && (
              <Dashboard
                c={c} theme={theme} setTheme={setTheme} job={job} applicationId={applicationId}
                stageIndex={stageIndex} tab={dashboardTab} setTab={setDashboardTab} setView={setView}
                simOffset={simOffset} setSimOffset={setSimOffset} attendance={attendance} setAttendance={setAttendance}
                interviewTime={interviewTime} now={now} applicantData={applicantData}
              />
            )}
          </main>

          {/* Footer */}
          <footer style={{ borderTop: `1px solid ${c.border}`, background: c.surface }} className="py-8 px-5 md:px-8 text-xs text-center text-slate-500">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <Icon.Scale size={16} color={c.primaryText} />
                <span className="font-bold" style={{ color: c.text }}>مكتب المستشار للمحاماة والاستشارات القانونية</span>
              </div>
              <div 
                onClick={() => setIsAdminModalOpen(true)} 
                className="cursor-pointer select-none text-[11px] hover:opacity-80"
                style={{ color: c.textFaint }}
              >
                © 2026 جميع الحقوق محفوظة لمكتب المستشار للمحاماة · بوابة التوظيف الذكية
              </div>
            </div>
          </footer>

          {isAdminModalOpen && (
            <AdminAuthModal 
              c={c}
              onSuccess={() => {
                setIsAdminModalOpen(false);
                setStageIndex(4);
                setView("dashboard");
                alert("تم تسجيل الدخول بنجاح.");
              }}
              onClose={() => setIsAdminModalOpen(false)}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
