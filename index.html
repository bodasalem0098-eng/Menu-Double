<body class="bg-[#F8FAF9] text-[#0F172A] min-h-screen flex flex-col">

  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ---------------- Normalize String Helper ---------------- */
    function normalizeStr(str) {
      if (!str) return '';
      let s = String(str);
      const arabicDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
      for (let i = 0; i < 10; i++) {
        s = s.split(arabicDigits[i]).join(String(i));
      }
      s = s.replace(/[أإآ]/g, 'ا')
           .replace(/[ة]/g, 'ه')
           .replace(/[ى]/g, 'ي')
           .replace(/[\u064B-\u065F]/g, '');
      return s.toLowerCase().replace(/[\s\-\+\(\)\_]/g, '');
    }

    /* ---------------- Neon Postgres & Cloud Storage Client ---------------- */
    const LOCAL_STORAGE_KEY = 'almustashar_neon_synced_v1';
    const CLOUD_FALLBACK_URL = 'https://api.restful-api.dev/objects/ff8081819ff5b11001a0329c847c0a24';

    const DB = {
      async getAll() {
        // 1. Try Vercel + Neon Postgres API
        try {
          const res = await fetch('/api/db', { cache: 'no-cache' });
          if (res.ok) {
            const data = await res.json();
            if (data && Array.isArray(data.applicants)) {
              localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data.applicants));
              return data.applicants;
            }
          }
        } catch(e) {}

        // 2. Direct Cloud Storage
        try {
          const res = await fetch(CLOUD_FALLBACK_URL, { cache: 'no-cache' });
          if (res.ok) {
            const json = await res.json();
            if (json && json.data && Array.isArray(json.data.applicants)) {
              localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(json.data.applicants));
              return json.data.applicants;
            }
          }
        } catch(e) {}

        // 3. Local Cache
        try {
          const local = localStorage.getItem(LOCAL_STORAGE_KEY) || localStorage.getItem('almustashar_synced_data_v6');
          if (local) return JSON.parse(local);
        } catch(e) {}

        return [];
      },

      async save(applicant) {
        // 1. Save to Local Cache
        try {
          const list = await this.getAll();
          const updated = [applicant, ...list.filter(a => a.code !== applicant.code && normalizeStr(a.phone) !== normalizeStr(applicant.phone))];
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(updated));
        } catch(e) {}

        // 2. Push to Neon Postgres API
        try {
          await fetch('/api/db', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ applicant })
          });
        } catch(e) {}

        // 3. Push to Cloud Storage Mirror
        try {
          const list = await this.getAll();
          const updated = [applicant, ...list.filter(a => a.code !== applicant.code && normalizeStr(a.phone) !== normalizeStr(applicant.phone))];
          await fetch(CLOUD_FALLBACK_URL, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: 'Almustashar Portal Database',
              data: { applicants: updated, updatedAt: new Date().toISOString() }
            })
          });
        } catch(e) {}
      },

      async delete(code) {
        try {
          await fetch(`/api/db?code=${encodeURIComponent(code)}`, { method: 'DELETE' });
        } catch(e) {}
      }
    };

    /* ---------------- Icons ---------------- */
    const Icon = {
      Scale: ({ size = 18 }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>
        </svg>
      ),
      CheckCircle2: ({ size = 18, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
        </svg>
      ),
      Upload: ({ size = 18 }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>
        </svg>
      ),
      Video: ({ size = 18 }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/>
        </svg>
      ),
      Check: ({ size = 18, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      ),
      Circle: ({ size = 18, color = "currentColor", fill = "none" }) => (

      Trash: ({ size = 16 }) => (

          <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
        </svg>
      ),
      RefreshCw: ({ size = 16, className = "" }) => (
        <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
        </svg>
      ),
      Shield: ({ size = 18 }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
        </svg>
      )
    };

    const STAGES = [
      { key: "SUBMITTED", label: "تم الإرسال" },
      { key: "RECEIVED", label: "تم الاستلام" },
      { key: "CV_VIEWED", label: "فحص الـ CV" },
      { key: "SHORTLISTED", label: "القائمة المختصرة" },
      { key: "INTERVIEW_SCHEDULED", label: "مقابلة مجدولة" },
      { key: "INTERVIEW_COMPLETED", label: "تمت المقابلة" },
      { key: "DECISION", label: "القرار النهائي" },
    ];

    /* ---------------- Navbar ---------------- */
    function Navbar({ view, setView }) {
      return (
        <header className="bg-white border-b border-[#E2E8F0] sticky top-0 z-40 px-3 md:px-4 py-2.5">
          <div className="max-w-3xl mx-auto flex items-center justify-between">
            <button onClick={() => setView("form")} className="flex items-center gap-2.5 text-right">
              <div className="w-8 h-8 rounded-lg bg-brand-800 text-white flex items-center justify-center">
                <Icon.Scale size={16} />
              </div>
              <div>
                <h1 className="font-extrabold text-xs md:text-sm text-slateText-title leading-tight">المستشار للمحاماة</h1>
                <p className="text-[10px] text-brand-700 font-semibold">والاستشارات القانونية</p>
              </div>
            </button>

            <div className="flex items-center gap-1.5">
              <button
                onClick={() => setView("form")}
                className={`text-[11px] md:text-xs font-bold px-3 py-1.5 rounded-lg transition-colors ${view === 'form' ? 'bg-brand-800 text-white' : 'bg-slate-100 text-slateText-body'}`}
              >
                استمارة التقديم
              </button>
              <button
                onClick={() => setView("dashboard")}
                className={`text-[11px] md:text-xs font-bold px-3 py-1.5 rounded-lg transition-colors ${view === 'dashboard' ? 'bg-brand-800 text-white' : 'bg-slate-100 text-slateText-body'}`}
              >
                استعلام عن طلب
              </button>
            </div>
          </div>
        </header>
      );
    }

    /* ---------------- Google-Style Form ---------------- */
    function GoogleStyleForm({ onSubmit, isSubmitting }) {
      const [data, setData] = useState({
        fullName: "",
        phone: "",
        email: "",
        nationality: "",
        city: "",
        age: "",
        education: "",
        currentJob: "",
        yearsExperience: "",
        expectedSalary: "2,500 ريال",
        skills: "",
        vatExperience: "",
        photoBase64: null,
        cvFile: null,
      });
      const [error, setError] = useState("");

      const set = (k, v) => setData(d => ({ ...d, [k]: v }));

      const handlePhoto = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => set("photoBase64", ev.target.result);
        reader.readAsDataURL(file);
      };

      const handleCv = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        set("cvFile", { name: file.name, size: (file.size / 1024).toFixed(0) + " KB" });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!data.fullName.trim()) { setError("يرجى كتابة الاسم الكامل."); return; }
        if (!data.phone.trim()) { setError("يرجى كتابة رقم الهاتف."); return; }
        if (!data.education.trim()) { setError("يرجى كتابة المؤهل العلمي."); return; }
        if (!data.yearsExperience.trim()) { setError("يرجى كتابة سنوات الخبرة."); return; }
        setError("");
        onSubmit(data);
      };

      return (
        <div className="max-w-2xl mx-auto px-3 md:px-4 py-5 md:py-8 space-y-4 animate-fade-in text-right">
          
          <div className="g-card g-header p-5 md:p-7 space-y-2.5">
            <h1 className="text-xl md:text-2xl font-extrabold text-slateText-title">استمارة التقديم على وظيفة محاسب مالي</h1>
            <p className="text-xs text-slateText-muted leading-relaxed">
              مكتب المستشار للمحاماة والاستشارات القانونية — الرياض.<br />
              الراتب المحدد: <strong>2,500 ريال</strong>. يرجى تعبئة جميع الحقول المطلوبة بدقة.
            </p>
            <div className="pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] text-red-500 font-semibold">
              <span>* تشير إلى حقل مطلوب</span>
            </div>
          </div>

          {error && (
            <div className="p-3 bg-red-50 text-red-600 rounded-xl text-xs font-bold text-center border border-red-200">
              {error}
            </div>
          )}

          <form onSubmit={handleSubmit} className="space-y-4">

            {/* 1. Personal Info */}
            <div className="g-card p-5 md:p-6 space-y-4">
              <h2 className="text-xs font-bold text-brand-800 uppercase tracking-wide">1. البيانات الشخصية</h2>
              
              <div>
                <label className="block text-xs font-bold text-slateText-body mb-1.5">الاسم الرباعي <span className="text-red-500">*</span></label>
                <input
                  type="text"
                  value={data.fullName}
                  onChange={e => set("fullName", e.target.value)}
                  placeholder="إجابتك"
                  className="w-full h-11 px-3.5 rounded-xl border border-slate-200 text-xs bg-slate-50/50 outline-none text-right focus:border-brand-800 focus:bg-white"
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <div>
                  <label className="block text-xs font-bold text-slateText-body mb-1.5">رقم الهاتف (واتساب) <span className="text-red-500">*</span></label>
                  <input
                    type="tel"
                    dir="ltr"
                    value={data.phone}
                    onChange={e => set("phone", e.target.value)}
                    placeholder="05XXXXXXXX"
                    className="w-full h-11 px-3.5 rounded-xl border border-slate-200 text-xs bg-slate-50/50 outline-none text-right focus:border-brand-800 focus:bg-white"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slateText-body mb-1.5">البريد الإلكتروني</label>
                  <input
                    type="email"
                    dir="ltr"
                    value={data.email}
                    onChange={e => set("email", e.target.value)}
                    placeholder="example@gmail.com"
                    className="w-full h-11 px-3.5 rounded-xl border border-slate-200 text-xs bg-slate-50/50 outline-none text-right focus:border-brand-800 focus:bg-white"
                  />
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
                <div>
                  <label className="block text-xs font-bold text-slateText-body mb-1.5">الجنسية</label>
                  <input
                    type="text"
                    value={data.nationality}
                    onChange={e => set("nationality", e.target.value)}
                    placeholder="إجابتك"
                    className="w-full h-11 px-3.5 rounded-xl border border-slate-200 text-xs bg-slate-50/50 outline-none text-right focus:border-brand-800"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slateText-body mb-1.5">مدينة الإقامة</label>
                  <input
                    type="text"
                    value={data.city}
                    onChange={e => set("city", e.target.value)}
                    placeholder="الرياض / غيرها"
                    className="w-full h-11 px-3.5 rounded-xl border border-slate-200 text-xs bg-slate-50/50 outline-none text-right focus:border-brand-800"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slateText-body mb-1.5">العمر</label>
                  <input
                    type="number"
                    value={data.age}
                    onChange={e => set("age", e.target.value)}
                    placeholder="مثال: 26"
                    className="w-full h-11 px-3.5 rounded-xl border border-slate-200 text-xs bg-slate-50/50 outline-none text-right focus:border-brand-800"
                  />
                </div>
              </div>
            </div>

            {/* 2. Professional & Experience */}
            <div className="g-card p-5 md:p-6 space-y-4">
              <h2 className="text-xs font-bold text-brand-800 uppercase tracking-wide">2. المؤهلات والخبرات</h2>

              <div>
                <label className="block text-xs font-bold text-slateText-body mb-1.5">المؤهل العلمي <span className="text-red-500">*</span></label>
                <input
                  type="text"
                  value={data.education}
                  onChange={e => set("education", e.target.value)}
                  placeholder="بكالوريوس محاسبة / دبلوم..."
                  className="w-full h-11 px-3.5 rounded-xl border border-slate-200 text-xs bg-slate-50/50 outline-none text-right focus:border-brand-800"
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <div>
                  <label className="block text-xs font-bold text-slateText-body mb-1.5">سنوات الخبرة في المحاسبة <span className="text-red-500">*</span></label>
                  <input
                    type="text"
                    value={data.yearsExperience}
                    onChange={e => set("yearsExperience", e.target.value)}
                    placeholder="مثال: سنتين / 3 سنوات"
                    className="w-full h-11 px-3.5 rounded-xl border border-slate-200 text-xs bg-slate-50/50 outline-none text-right focus:border-brand-800"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slateText-body mb-1.5">الوظيفة الحالية أو السابقة</label>
                  <input
                    type="text"
                    value={data.currentJob}
                    onChange={e => set("currentJob", e.target.value)}
                    placeholder="محاسب عام / غير موظف حالياً"
                    className="w-full h-11 px-3.5 rounded-xl border border-slate-200 text-xs bg-slate-50/50 outline-none text-right focus:border-brand-800"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slateText-body mb-1.5">البرامج المحاسبية والأنظمة التي تجيدها</label>
                <input
                  type="text"
                  value={data.skills}
                  onChange={e => set("skills", e.target.value)}
                  placeholder="Excel, Odoo, SAP, دفترة, سماك..."
                  className="w-full h-11 px-3.5 rounded-xl border border-slate-200 text-xs bg-slate-50/50 outline-none text-right focus:border-brand-800"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slateText-body mb-1.5">الراتب المحدد للوظيفة</label>
                <input
                  type="text"
                  value={data.expectedSalary}
                  onChange={e => set("expectedSalary", e.target.value)}
                  className="w-full h-11 px-3.5 rounded-xl border border-slate-200 text-xs bg-slate-100 outline-none text-right font-bold text-brand-800"
                />
              </div>
            </div>

            {/* 3. Questions */}
            <div className="g-card p-5 md:p-6 space-y-4">
              <h2 className="text-xs font-bold text-brand-800 uppercase tracking-wide">3. الأسئلة المهنية</h2>

              <div>
                <label className="block text-xs font-bold text-slateText-body mb-2">هل لديك خبرة في ضريبة القيمة المضافة ZATCA وإعداد الإقرارات؟</label>
                <div className="flex gap-2">
                  {["نعم", "لا"].map(opt => (
                    <button
                      key={opt}
                      type="button"
                      onClick={() => set("vatExperience", opt)}
                      className={`px-5 h-9 rounded-xl text-xs font-bold border transition-colors ${
                        data.vatExperience === opt ? 'bg-brand-800 text-white border-brand-800' : 'bg-slate-50 text-slateText-body border-slate-200'
                      }`}
                    >
                      {opt}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {/* 4. Attachments */}
            <div className="g-card p-5 md:p-6 space-y-4">
              <h2 className="text-xs font-bold text-brand-800 uppercase tracking-wide">4. المستندات والمرفقات</h2>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 text-center">
                  <label className="block text-xs font-bold text-slateText-body mb-2">الصورة الشخصية</label>
                  {data.photoBase64 ? (
                    <img src={data.photoBase64} alt="" className="w-14 h-14 rounded-lg object-cover mx-auto" />
                  ) : (
                    <label className="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white rounded-lg text-xs font-bold cursor-pointer border border-slate-200 shadow-sm">
                      <Icon.Upload size={13} /> <span>إرفاق صورة</span>
                      <input type="file" accept="image/*" onChange={handlePhoto} className="hidden" />
                    </label>
                  )}
                </div>

                <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 text-center">
                  <label className="block text-xs font-bold text-slateText-body mb-2">السيرة الذاتية (CV)</label>
                  {data.cvFile ? (

      const filteredApplicants = normalizedQ ? applicants.filter(a => {
        const normCode = normalizeStr(a.code);

        if (e) e.preventDefault();

        if (status === 'INTERVIEW_SCHEDULED') return 4;

    /* ---------------- Main Root App ---------------- */
    function App() {
      const [view, setView] = useState("form");
      const [applicants, setApplicants] = useState([]);
      const [activeApplicant, setActiveApplicant] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isAdminModalOpen, setIsAdminModalOpen] = useState(false);
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);

      const refreshData = async () => {
        const list = await DB.getAll();
        setApplicants(list);
        return list;
      };

      useEffect(() => {
        refreshData();
      }, []);

      const handleFormSubmit = async (formData) => {
        setIsSubmitting(true);
        const currentList = await DB.getAll();
        const nextNum = currentList.length + 1;
        const newCode = 'APP-' + String(nextNum).padStart(4, '0');

        const newApp = {
          id: String(Date.now()),
          code: newCode,
          status: 'SUBMITTED',
          submittedAt: new Date().toLocaleDateString('ar-SA'),
          interview: null,
          ...formData
        };

        await DB.save(newApp);
        const updated = [newApp, ...currentList.filter(a => a.code !== newApp.code && normalizeStr(a.phone) !== normalizeStr(newApp.phone))];
        setApplicants(updated);
        setActiveApplicant(newApp);
        setIsSubmitting(false);
        setView("success");
      };

      const updateStatus = async (code, newStatus) => {
        const target = applicants.find(a => a.code === code);
        if (target) {
          const updatedTarget = { ...target, status: newStatus };
          await DB.save(updatedTarget);
          const updated = applicants.map(a => a.code === code ? updatedTarget : a);
          setApplicants(updated);
          if (activeApplicant?.code === code) setActiveApplicant(updatedTarget);
        }
      };

      const scheduleInt = async (code, interviewData) => {
        const target = applicants.find(a => a.code === code);
        if (target) {
          const updatedTarget = { ...target, status: 'INTERVIEW_SCHEDULED', interview: interviewData };
          await DB.save(updatedTarget);
          const updated = applicants.map(a => a.code === code ? updatedTarget : a);
          setApplicants(updated);
          if (activeApplicant?.code === code) setActiveApplicant(updatedTarget);
        }
      };

      const deleteApplicant = async (code) => {
        if (confirm(`هل أنت متأكد من حذف المتقدم ${code} نهائياً؟`)) {
          await DB.delete(code);
          const updated = applicants.filter(a => a.code !== code);
          setApplicants(updated);
          if (activeApplicant?.code === code) setActiveApplicant(null);
        }
      };

      const resetAll = async () => {
        if (confirm('هل تريد تصفير جميع بيانات المتقدمين والبدء من الصفر؟')) {
          await DB.delete('');
          localStorage.clear();
          setApplicants([]);
          setActiveApplicant(null);
          alert('تم تصفير قاعدة البيانات بنجاح.');
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#F8FAF9]">
          <Navbar view={view} setView={setView} />

          <main className="flex-1">
            {view === "form" && (
              <GoogleStyleForm
                onSubmit={handleFormSubmit}
                isSubmitting={isSubmitting}
              />
            )}

            {view === "success" && activeApplicant && (
              <SuccessScreen
                applicant={activeApplicant}
                goDashboard={() => setView("dashboard")}
              />
            )}

            {view === "dashboard" && (
              <ApplicantDashboard
                applicants={applicants}
                activeApplicant={activeApplicant}
                onRefresh={refreshData}
                onGoApply={() => setView("form")}
              />
            )}

            {view === "admin" && isAdminLoggedIn && (
              <AdminDashboardView
                applicants={applicants}
                onUpdateStatus={updateStatus}
                onScheduleInterview={scheduleInt}
                onDeleteApplicant={deleteApplicant}
                onResetAll={resetAll}
              />
            )}
          </main>

          <footer className="mt-auto bg-white border-t border-[#E2E8F0] py-5 px-3 text-xs text-slateText-muted">
            <div className="max-w-2xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-center sm:text-right">
              <div className="flex items-center gap-1.5">
                <Icon.Scale size={15} />
                <span className="font-bold text-slateText-body">مكتب المستشار للمحاماة والاستشارات القانونية — الرياض</span>
              </div>
              <div
                onClick={() => setIsAdminModalOpen(true)}
                className="cursor-default select-none text-[11px] text-slateText-light hover:text-slateText-muted"
              >
                © 2026 جميع الحقوق محفوظة · بوابة التوظيف
              </div>
            </div>
          </footer>

          {isAdminModalOpen && (
            <AdminAuthModal
              onSuccess={() => {
                setIsAdminModalOpen(false);
                setIsAdminLoggedIn(true);
                setView("admin");
              }}
              onClose={() => setIsAdminModalOpen(false)}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
