<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>المستشار للمحاماة | التقديم على وظيفة محاسب</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            sun: {
              50: '#FFFAF0',
              100: '#FFF3D4',
              200: '#FFE59E',
              300: '#FFD466',
              400: '#FFC233',
              500: '#F59E0B',
              600: '#D97706',
              700: '#B45309',
              800: '#78350F',
              900: '#451A03',
            },
            neutralDark: '#1E1B18',
            neutralMuted: '#6B6255',
          }
        }
      }
    }
  </script>

  <style>
    * { 
      font-family: 'Cairo', sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }
    body { 
      background-color: #FFFDF7; 
      color: #1E1B18; 
      overflow-x: hidden;
    }
    .custom-shadow {
      box-shadow: 0 4px 20px -2px rgba(245, 158, 11, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.04);
    }
    .card-shadow {
      box-shadow: 0 10px 30px -5px rgba(217, 119, 6, 0.07), 0 0 0 1px rgba(254, 243, 199, 0.8);
    }
    /* Google form style top bar */
    .g-stripe {
      background: linear-gradient(135deg, #F59E0B 0%, #FBBF24 50%, #FDE68A 100%);
    }
    /* Hide scrollbar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#FFFDF7] min-h-screen text-[#1E1B18]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // LOCAL STORAGE KEYS
    const STORAGE_KEY = 'hireflow_applicants_v2';
    const SEQ_KEY = 'hireflow_seq_v2';

    function App() {
      const [view, setView] = useState('form'); // form, success, track, adminLogin, admin
      const [applicants, setApplicants] = useState([]);
      const [lastSubmittedCode, setLastSubmittedCode] = useState('');
      const [selectedApplicant, setSelectedApplicant] = useState(null);
      const [activeAdminTab, setActiveAdminTab] = useState('list'); // list, kanban, interviews

      // Load initial data
      useEffect(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            setApplicants(JSON.parse(saved));
          } catch(e) {
            setApplicants([]);
          }
        } else {
          setApplicants([]);
        }
      }, []);

      // Save to localStorage
      const saveApplicants = (newList) => {
        setApplicants(newList);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(newList));
      };

      // Form submission handler with clean sequential numbering APP-0001, APP-0002...
      const handleFormSubmit = (formData) => {
        let currentSeq = parseInt(localStorage.getItem(SEQ_KEY) || '0', 10);
        currentSeq += 1;
        localStorage.setItem(SEQ_KEY, currentSeq.toString());

        const codeStr = 'APP-' + String(currentSeq).padStart(4, '0');

        const newApplicant = {
          id: String(Date.now()),
          code: codeStr,
          submittedAt: new Date().toLocaleDateString('ar-SA', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
          status: 'SUBMITTED', // SUBMITTED, UNDER_REVIEW, CV_VIEWED, SHORTLISTED, INTERVIEW_SCHEDULED, ACCEPTED, REJECTED
          cvViewed: false,
          cvViewedAt: null,
          interview: null,
          notes: [],
          ...formData
        };

        const updated = [newApplicant, ...applicants];
        saveApplicants(updated);
        setLastSubmittedCode(codeStr);
        setView('success');
      };

      // Change status
      const updateApplicantStatus = (id, newStatus) => {
        const updated = applicants.map(app => {
          if (app.id === id) {
            return {
              ...app,
              status: newStatus,
              cvViewed: newStatus === 'CV_VIEWED' ? true : app.cvViewed,
              cvViewedAt: newStatus === 'CV_VIEWED' && !app.cvViewedAt ? new Date().toLocaleDateString('ar-SA') : app.cvViewedAt
            };
          }
          return app;
        });
        saveApplicants(updated);
        if (selectedApplicant && selectedApplicant.id === id) {
          setSelectedApplicant(updated.find(a => a.id === id));
        }
      };

      // Schedule interview
      const handleScheduleInterview = (id, interviewData) => {
        const updated = applicants.map(app => {
          if (app.id === id) {
            return {
              ...app,
              status: 'INTERVIEW_SCHEDULED',
              interview: interviewData
            };
          }
          return app;
        });
        saveApplicants(updated);
        if (selectedApplicant && selectedApplicant.id === id) {
          setSelectedApplicant(updated.find(a => a.id === id));
        }
      };

      // Add note
      const handleAddNote = (id, noteText) => {
        const updated = applicants.map(app => {
          if (app.id === id) {
            return {
              ...app,
              notes: [...(app.notes || []), { text: noteText, date: new Date().toLocaleDateString('ar-SA') }]
            };
          }
          return app;
        });
        saveApplicants(updated);
        if (selectedApplicant && selectedApplicant.id === id) {
          setSelectedApplicant(updated.find(a => a.id === id));
        }
      };

      // Reset all data
      const handleResetAll = () => {
        if (confirm('هل تريد مسح جميع المتقدمين وإعادة ترقيم الطلبات من APP-0001؟')) {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(SEQ_KEY);
          setApplicants([]);
          setSelectedApplicant(null);
          alert('تم مسح جميع البيانات وتصفير العداد إلى 0001 بنجاح.');
        }
      };

      return (
        <div className="min-h-screen flex flex-col pb-16 md:pb-6">
          
          {/* TOP BAR */}
          <header className="bg-white/90 backdrop-blur-md border-b border-amber-100 sticky top-0 z-40 px-4 py-3">
            <div className="max-w-3xl mx-auto flex items-center justify-between">
              <div 
                className="flex items-center gap-2.5 cursor-pointer"
                onClick={() => setView('form')}
              >
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-yellow-400 flex items-center justify-center text-white text-xl shadow-md shadow-amber-500/20">
                  ⚖️
                </div>
                <div>
                  <h1 className="font-bold text-sm text-neutralDark leading-tight">المستشار للمحاماة</h1>
                  <p className="text-[11px] text-amber-800/80 font-medium">بوابة استقطاب الكفاءات</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                {view !== 'admin' && view !== 'adminLogin' && (
                  <button
                    onClick={() => setView('track')}
                    className={`text-xs font-bold px-3.5 py-2 rounded-xl transition-all ${
                      view === 'track' 
                        ? 'bg-amber-100 text-amber-900 border border-amber-300' 
                        : 'bg-white text-neutralMuted border border-amber-200 hover:bg-amber-50'
                    }`}
                  >
                    🔍 متابعة طلبي
                  </button>
                )}

                {view === 'admin' ? (
                  <button
                    onClick={() => setView('form')}
                    className="text-xs font-bold px-3.5 py-2 rounded-xl bg-amber-100 text-amber-900 border border-amber-200"
                  >
                    📝 واجهة التقديم
                  </button>
                ) : (
                  <button
                    onClick={() => setView('adminLogin')}
                    className="text-xs font-bold px-3.5 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-white shadow-sm shadow-amber-500/25 flex items-center gap-1"
                  >
                    <span>🛡️</span>
                    <span className="hidden sm:inline">لوحة المدير</span>
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="flex-1 max-w-3xl w-full mx-auto px-4 py-4 md:py-6">
            
            {/* VIEW 1: APPLICATION FORM (Google Form + Premium Style) */}
            {view === 'form' && (
              <ApplicantForm onSubmit={handleFormSubmit} />
            )}

            {/* VIEW 2: SUCCESS SCREEN */}
            {view === 'success' && (
              <SuccessCard 
                code={lastSubmittedCode} 
                onGoTrack={() => setView('track')} 
                onNewApply={() => setView('form')}
              />
            )}

            {/* VIEW 3: TRACK APPLICATION */}
            {view === 'track' && (
              <TrackView applicants={applicants} defaultCode={lastSubmittedCode} />
            )}

            {/* VIEW 4: ADMIN LOGIN */}
            {view === 'adminLogin' && (
              <AdminLogin onLogin={() => setView('admin')} />
            )}

            {/* VIEW 5: ADMIN DASHBOARD */}
            {view === 'admin' && (
              <AdminDashboard 
                applicants={applicants}
                activeTab={activeAdminTab}
                setActiveTab={setActiveAdminTab}
                selectedApplicant={selectedApplicant}
                setSelectedApplicant={setSelectedApplicant}
                onUpdateStatus={updateApplicantStatus}
                onScheduleInterview={handleScheduleInterview}
                onAddNote={handleAddNote}
                onResetAll={handleResetAll}
              />
            )}

          </main>

          {/* BOTTOM QUICK BAR FOR MOBILE */}
          <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-amber-100 p-2 flex justify-around items-center z-40 text-[11px] font-bold text-neutralMuted">
            <button 
              onClick={() => setView('form')} 
              className={`flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl ${view === 'form' ? 'text-amber-600 bg-amber-50' : ''}`}
            >
              <span className="text-lg">✍️</span>
              <span>تقديم جديد</span>
            </button>
            <button 
              onClick={() => setView('track')} 
              className={`flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl ${view === 'track' ? 'text-amber-600 bg-amber-50' : ''}`}
            >
              <span className="text-lg">🔍</span>
              <span>متابعة الطلب</span>
            </button>
            <button 
              onClick={() => setView(view === 'admin' ? 'admin' : 'adminLogin')} 
              className={`flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl ${view === 'admin' || view === 'adminLogin' ? 'text-amber-600 bg-amber-50' : ''}`}
            >
              <span className="text-lg">🛡️</span>
              <span>لوحة الإدارة</span>
            </button>
          </div>

        </div>
      );
    }

    /* =========================================================================
       1. APPLICANT REGISTRATION & APPLICATION FORM (Google Form Style)
       ========================================================================= */
    function ApplicantForm({ onSubmit }) {
      const [formData, setFormData] = useState({
        // Personal
        fullName: '',
        phone: '',
        email: '',
        age: '',
        nationality: '',
        maritalStatus: '',
        city: '',
        // Professional
        qualification: '',
        major: '',
        yearsExperience: '',
        currentJob: '',
        previousCompany: '',
        expectedSalary: '',
        accountingSoftware: '',
        excelLevel: '',
        hasVatExp: '',
        hasIfrsExp: '',
        // Uploads
        photoBase64: null,
        photoName: '',
        cvBase64: null,
        cvName: '',
        notesApplicant: '',
      });

      const [errors, setErrors] = useState({});
      const [isSubmitting, setIsSubmitting] = useState(false);

      const handlePhotoUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          alert('يرجى اختيار صورة صحيحة (JPG أو PNG)');
          return;
        }
        const reader = new FileReader();
        reader.onloadend = () => {
          setFormData(prev => ({
            ...prev,
            photoBase64: reader.result,
            photoName: file.name
          }));
        };
        reader.readAsDataURL(file);
      };

      const handleCvUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 8 * 1024 * 1024) {
          alert('حجم السيرة الذاتية يجب أن لا يتجاوز 8 ميجابايت');
          return;
        }
        const reader = new FileReader();
        reader.onloadend = () => {
          setFormData(prev => ({
            ...prev,
            cvBase64: reader.result,
            cvName: file.name
          }));
        };
        reader.readAsDataURL(file);
      };

      const validate = () => {
        const newErr = {};
        if (!formData.fullName.trim()) newErr.fullName = 'الاسم الرباعي مطلوب';
        if (!formData.phone.trim()) newErr.phone = 'رقم الهاتف مطلوب للتواصل';
        if (!formData.age.trim()) newErr.age = 'العمر مطلوب';
        if (!formData.nationality.trim()) newErr.nationality = 'الجنسية مطلوبة';
        if (!formData.city.trim()) newErr.city = 'المدينة الحالية مطلوبة';
        if (!formData.qualification.trim()) newErr.qualification = 'المؤهل مطلوب';
        if (!formData.yearsExperience.trim()) newErr.yearsExperience = 'سنوات الخبرة مطلوبة';
        if (!formData.photoBase64) newErr.photo = 'الصورة الشخصية إلزامية';
        if (!formData.cvBase64) newErr.cv = 'السيرة الذاتية (CV) إلزامية';

        setErrors(newErr);
        if (Object.keys(newErr).length > 0) {
          // Scroll to top error
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return false;
        }
        return true;
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!validate()) return;
        setIsSubmitting(true);
        setTimeout(() => {
          onSubmit(formData);
          setIsSubmitting(false);
        }, 500);
      };

      return (
        <form onSubmit={handleSubmit} className="space-y-4 md:space-y-6">
          
          {/* HEADER CARD (Google Form Top Banner) */}
          <div className="bg-white rounded-3xl overflow-hidden card-shadow border border-amber-100">
            <div className="h-3.5 g-stripe w-full"></div>
            <div className="p-6 md:p-8">
              <div className="flex items-center gap-2 text-xs font-extrabold text-amber-700 bg-amber-50 border border-amber-200 px-3 py-1 rounded-full w-fit mb-3">
                <span>💼</span>
                <span>فرصة وظيفية متاحة</span>
              </div>
              <h2 className="text-2xl md:text-3xl font-extrabold text-neutralDark tracking-tight">
                استمارة التقديم — وظيفة محاسب
              </h2>
              <p className="text-sm text-neutralMuted mt-2 leading-relaxed">
                مكتب <strong>المستشار للمحاماة والاستشارات القانونية</strong> يبحث عن محاسب مالي ذو كفاءة. 
                يرجى تعبئة النموذج التالي بدقة وإرفاق الصورة والسيرة الذاتية.
              </p>
              <div className="mt-4 pt-4 border-t border-amber-100 flex flex-wrap gap-4 text-xs font-semibold text-amber-900">
                <span>📍 الموقع: الرياض (حضوري)</span>
                <span>⏰ الدوام: كامل</span>
                <span className="text-red-500 font-bold">* الحقول المؤشرة مطلوبة</span>
              </div>
            </div>
          </div>

          {/* SECTION 1: PERSONAL INFO */}
          <div className="bg-white rounded-3xl p-6 md:p-7 card-shadow border border-amber-100 space-y-4">
            <div className="flex items-center gap-2 border-b border-amber-100 pb-3">
              <div className="w-8 h-8 rounded-xl bg-amber-100 text-amber-800 flex items-center justify-center font-bold text-sm">1</div>
              <h3 className="font-extrabold text-base text-neutralDark">المعلومات الشخصية والاتصال</h3>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {/* Full Name */}
              <div className="md:col-span-2">
                <label className="block text-xs font-bold text-neutralDark mb-1.5">
                  الاسم الرباعي كاملاً <span className="text-red-500">*</span>
                </label>
                <input 
                  type="text"
                  placeholder="اكتب اسمك كما في الهوية..."
                  value={formData.fullName}
                  onChange={e => setFormData({ ...formData, fullName: e.target.value })}
                  className={`w-full h-12 px-4 rounded-2xl bg-[#FFFDF7] border ${errors.fullName ? 'border-red-400 bg-red-50/20' : 'border-amber-200 focus:border-amber-500'} text-sm focus:outline-none transition-colors`}
                />
                {errors.fullName && <p className="text-[11px] text-red-500 mt-1 font-semibold">{errors.fullName}</p>}
              </div>

              {/* Phone */}
              <div>
                <label className="block text-xs font-bold text-neutralDark mb-1.5">
                  رقم الهاتف (واتساب) <span className="text-red-500">*</span>
                </label>
                <input 
                  type="tel"
                  dir="ltr"
                  placeholder="05XXXXXXXX"
                  value={formData.phone}
                  onChange={e => setFormData({ ...formData, phone: e.target.value })}
                  className={`w-full h-12 px-4 rounded-2xl bg-[#FFFDF7] border ${errors.phone ? 'border-red-400 bg-red-50/20' : 'border-amber-200 focus:border-amber-500'} text-sm text-right focus:outline-none transition-colors`}
                />
                {errors.phone && <p className="text-[11px] text-red-500 mt-1 font-semibold">{errors.phone}</p>}
              </div>

              {/* Email */}
              <div>
                <label className="block text-xs font-bold text-neutralDark mb-1.5">
                  البريد الإلكتروني
                </label>
                <input 
                  type="email"
                  dir="ltr"
                  placeholder="example@gmail.com"
                  value={formData.email}
                  onChange={e => setFormData({ ...formData, email: e.target.value })}
                  className="w-full h-12 px-4 rounded-2xl bg-[#FFFDF7] border border-amber-200 focus:border-amber-500 text-sm text-right focus:outline-none"
                />
              </div>

              {/* Age */}
              <div>
                <label className="block text-xs font-bold text-neutralDark mb-1.5">
                  العمر (بالسنوات) <span className="text-red-500">*</span>
                </label>
                <input 
                  type="number"
                  placeholder="مثال: 27"
                  value={formData.age}
                  onChange={e => setFormData({ ...formData, age: e.target.value })}
                  className={`w-full h-12 px-4 rounded-2xl bg-[#FFFDF7] border ${errors.age ? 'border-red-400' : 'border-amber-200 focus:border-amber-500'} text-sm focus:outline-none`}
                />
                {errors.age && <p className="text-[11px] text-red-500 mt-1 font-semibold">{errors.age}</p>}
              </div>

              {/* Nationality */}
              <div>
                <label className="block text-xs font-bold text-neutralDark mb-1.5">
                  الجنسية <span className="text-red-500">*</span>
                </label>
                <input 
                  type="text"
                  placeholder="مثال: سعودي / مصري / أردني..."
                  value={formData.nationality}
                  onChange={e => setFormData({ ...formData, nationality: e.target.value })}
                  className={`w-full h-12 px-4 rounded-2xl bg-[#FFFDF7] border ${errors.nationality ? 'border-red-400' : 'border-amber-200 focus:border-amber-500'} text-sm focus:outline-none`}
                />
                {errors.nationality && <p className="text-[11px] text-red-500 mt-1 font-semibold">{errors.nationality}</p>}
              </div>

              {/* Marital Status */}
              <div>
                <label className="block text-xs font-bold text-neutralDark mb-1.5">
                  الحالة الاجتماعية
                </label>
                <select 
                  value={formData.maritalStatus}
                  onChange={e => setFormData({ ...formData, maritalStatus: e.target.value })}
                  className="w-full h-12 px-4 rounded-2xl bg-[#FFFDF7] border border-amber-200 focus:border-amber-500 text-sm focus:outline-none"
                >
                  <option value="">اختر...</option>
                  <option value="أعزب/عزباء">أعزب / عزباء</option>
                  <option value="متزوج/ة">متزوج / ة</option>
                  <option value="أخرى">أخرى</option>
                </select>
              </div>

              {/* City */}
              <div>
                <label className="block text-xs font-bold text-neutralDark mb-1.5">
                  مدينة الإقامة الحالية <span className="text-red-500">*</span>
                </label>
                <input 
                  type="text"
                  placeholder="مثال: الرياض"
                  value={formData.city}
                  onChange={e => setFormData({ ...formData, city: e.target.value })}
                  className={`w-full h-12 px-4 rounded-2xl bg-[#FFFDF7] border ${errors.city ? 'border-red-400' : 'border-amber-200 focus:border-amber-500'} text-sm focus:outline-none`}
                />
                {errors.city && <p className="text-[11px] text-red-500 mt-1 font-semibold">{errors.city}</p>}
              </div>
            </div>
          </div>

          {/* SECTION 2: PROFESSIONAL & ACCOUNTING INFO */}
          <div className="bg-white rounded-3xl p-6 md:p-7 card-shadow border border-amber-100 space-y-4">
            <div className="flex items-center gap-2 border-b border-amber-100 pb-3">
              <div className="w-8 h-8 rounded-xl bg-amber-100 text-amber-800 flex items-center justify-center font-bold text-sm">2</div>
              <h3 className="font-extrabold text-base text-neutralDark">المؤهلات والخبرة المحاسبية</h3>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {/* Qualification */}
              <div>
                <label className="block text-xs font-bold text-neutralDark mb-1.5">
                  المؤهل العلمي <span className="text-red-500">*</span>
                </label>
                <select 
                  value={formData.qualification}
                  onChange={e => setFormData({ ...formData, qualification: e.target.value })}
                  className={`w-full h-12 px-4 rounded-2xl bg-[#FFFDF7] border ${errors.qualification ? 'border-red-400' : 'border-amber-200 focus:border-amber-500'} text-sm focus:outline-none`}
                >
                  <option value="">اختر المؤهل...</option>
                  <option value="بكالوريوس محاسبة">بكالوريوس محاسبة</option>
                  <option value="بكالوريوس مالية">بكالوريوس مالية / اقتصاد</option>
                  <option value="دبلوم محاسبة">دبلوم محاسبة</option>

    /* =========================================================================
       3. TRACK APPLICATION STATUS
       ========================================================================= */
    function TrackView({ applicants, defaultCode }) {
      const [query, setQuery] = useState(defaultCode || '');
      const [found, setFound] = useState(() => {
        if (defaultCode) {
          return applicants.find(a => a.code === defaultCode) || null;
        }
        return applicants[0] || null;
      });

      const handleSearch = (e) => {
        e.preventDefault();
        const q = query.trim().toLowerCase();
        const res = applicants.find(a => 
          a.code.toLowerCase() === q ||
          (a.phone && a.phone.includes(q)) ||
          (a.email && a.email.toLowerCase().includes(q))
        );
        setFound(res || null);
      };

      const stages = [
        { key: 'SUBMITTED', label: 'تم الاستلام' },
        { key: 'CV_VIEWED', label: 'فحص الـ CV' },
        { key: 'SHORTLISTED', label: 'القائمة المختصرة' },
        { key: 'INTERVIEW_SCHEDULED', label: 'مقابلة مجدولة' },
        { key: 'DECISION', label: 'القرار النهائي' },
      ];

      const getStageIdx = (status) => {
        if (status === 'SUBMITTED') return 0;
        if (status === 'UNDER_REVIEW' || status === 'CV_VIEWED') return 1;
        if (status === 'SHORTLISTED') return 2;
        if (status === 'INTERVIEW_SCHEDULED') return 3;
        if (status === 'ACCEPTED' || status === 'REJECTED') return 4;
        return 0;
      };

      return (
        <div className="max-w-xl mx-auto my-4 space-y-5">
          {/* Search bar */}
          <div className="bg-white rounded-3xl p-6 card-shadow border border-amber-100">
            <h2 className="font-extrabold text-base text-neutralDark mb-1.5">متابعة حالة طلب التوظيف</h2>
            <p className="text-xs text-neutralMuted mb-4">أدخل رقم الطلب (#APP-0001) أو رقم هاتفك لمعرفة حالة طلبك</p>

            <form onSubmit={handleSearch} className="flex gap-2">
              <input 
                type="text" 
                placeholder="مثال: APP-0001 أو 05XXXXXXXX"
                value={query}
                onChange={e => setQuery(e.target.value)}
                className="flex-1 h-12 px-4 rounded-2xl bg-[#FFFDF7] border border-amber-200 focus:border-amber-500 text-sm focus:outline-none"
              />
              <button 
                type="submit"
                className="px-6 h-12 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-2xl text-xs shadow-md shadow-amber-500/20"
              >
                استعلام
              </button>
            </form>
          </div>

          {/* Details Card */}
          {found ? (
            <div className="bg-white rounded-3xl p-6 md:p-8 card-shadow border border-amber-100 space-y-6">
              
              {/* Header */}
              <div className="flex items-start justify-between border-b border-amber-100 pb-4">
                <div className="flex items-center gap-3">
                  {found.photoBase64 ? (
                    <img src={found.photoBase64} alt={found.fullName} className="w-14 h-14 rounded-2xl object-cover border border-amber-200 shadow-sm" />
                  ) : (
                    <div className="w-14 h-14 rounded-2xl bg-amber-100 text-amber-800 flex items-center justify-center font-bold text-xl">
                      👤
                    </div>
                  )}
                  <div>
                    <span className="font-mono text-xs font-bold text-amber-600 bg-amber-50 px-2.5 py-0.5 rounded-full border border-amber-200">
                      {found.code}
                    </span>
                    <h3 className="font-extrabold text-lg text-neutralDark mt-1">{found.fullName}</h3>
                    <p className="text-xs text-neutralMuted">وظيفة: محاسب مالي</p>
                  </div>
                </div>

                <span className={`text-xs font-bold px-3 py-1 rounded-full ${
                  found.status === 'ACCEPTED' ? 'bg-green-100 text-green-800' :
                  found.status === 'REJECTED' ? 'bg-red-100 text-red-800' :
                  found.status === 'INTERVIEW_SCHEDULED' ? 'bg-purple-100 text-purple-800' :
                  found.status === 'SHORTLISTED' ? 'bg-amber-100 text-amber-800' :
                  'bg-orange-50 text-amber-700'
                }`}>
                  {found.status}
                </span>
              </div>

              {/* TIMELINE */}
              <div>
                <h4 className="text-xs font-bold text-neutralMuted mb-4">مسار مراجعة الطلب</h4>
                <div className="flex justify-between relative">
                  <div className="absolute top-4 right-2 left-2 h-1 bg-amber-100 z-0"></div>
                  {stages.map((st, i) => {
                    const currentIdx = getStageIdx(found.status);
                    const isDone = i <= currentIdx;
                    const isCurrent = i === currentIdx;
                    return (
                      <div key={st.key} className="flex flex-col items-center relative z-10 w-16 text-center">
                        <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-all ${
                          isDone 
                            ? 'bg-amber-500 text-white shadow-md shadow-amber-500/30' 
                            : 'bg-white border-2 border-amber-200 text-amber-300'
                        } ${isCurrent ? 'ring-4 ring-amber-200' : ''}`}>
                          {isDone ? '✓' : i + 1}
                        </div>
                        <span className={`text-[10px] font-bold mt-2 ${isCurrent ? 'text-amber-700' : 'text-neutralMuted'}`}>
                          {st.label}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* INTERVIEW DETAILS */}
              {found.interview && (
                <div className="bg-gradient-to-br from-amber-50 to-orange-50 border-2 border-amber-200 rounded-3xl p-5 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-amber-800 flex items-center gap-1.5">
                      <span>📹</span>
                      <span>تم تحديد موعد مقابلة شخصية (Online)</span>
                    </span>
                    <span className="text-[10px] font-bold bg-white text-amber-800 px-2 py-0.5 rounded-full border border-amber-200">
                      Google Meet
                    </span>
                  </div>

                  <div className="grid grid-cols-2 gap-2 text-xs py-1">
                    <div>
                      <span className="text-neutralMuted block">الموعد:</span>
                      <strong className="text-neutralDark text-sm">{found.interview.date}</strong>
                    </div>
                    <div>
                      <span className="text-neutralMuted block">الوقت:</span>
                      <strong className="text-neutralDark text-sm">{found.interview.time}</strong>
                    </div>
                  </div>

                  {found.interview.meetLink && (
                    <a 
                      href={found.interview.meetLink}
                      target="_blank"
                      className="block w-full text-center h-11 leading-[44px] bg-gradient-to-r from-amber-500 to-amber-600 text-white font-bold rounded-2xl text-xs shadow-md shadow-amber-500/25 hover:opacity-95"
                    >
                      الانضمام إلى المقابلة عبر Google Meet ➔
                    </a>
                  )}
                </div>
              )}

              {/* CV Status */}
              {found.cvViewed && (
                <div className="p-3.5 bg-amber-50/50 border border-amber-200 rounded-2xl text-xs text-amber-900 flex items-center gap-2">
                  <span>👁️</span>
                  <span>تم فحص ومراجعة سيرتك الذاتية من قبل مسؤول التوظيف (عبدالرحمن).</span>
                </div>
              )}

            </div>
          ) : (
            <div className="bg-white rounded-3xl p-8 card-shadow border border-amber-100 text-center text-xs text-neutralMuted">
              لم يتم العثور على طلب بهذا الرقم. تأكد من إدخال الرمز بشكل صحيح.
            </div>
          )}
        </div>
      );
    }

          app.code.toLowerCase().includes(searchQuery.toLowerCase()) ||
          app.phone.includes(searchQuery);
        return matchesStatus && matchesSearch;
      });

      return (
        <div className="space-y-5 animate-fade-in">
          
          {/* TOP ADMIN BANNER */}
          <div className="bg-white rounded-3xl p-6 card-shadow border border-amber-100 flex flex-wrap items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-xl">👋</span>
                <h2 className="text-xl font-extrabold text-neutralDark">لوحة تحكم التوظيف — عبدالرحمن</h2>
              </div>
              <p className="text-xs text-neutralMuted mt-0.5">مكتب المستشار للمحاماة (moabdo038@gmail.com)</p>
            </div>

            {/* Quick Actions */}
            <div className="flex gap-2">
              <button
                onClick={onResetAll}
                className="text-xs font-bold px-3 py-2 rounded-xl bg-red-50 text-red-700 border border-red-200 hover:bg-red-100"
                title="مسح البيانات وتصفير العداد إلى APP-0001"
              >
                🗑️ تصفير العداد
              </button>
            </div>
          </div>

          {/* STATS CARDS */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div className="bg-white rounded-2xl p-4 card-shadow border border-amber-100">
              <span className="text-xs text-neutralMuted block">إجمالي المتقدمين</span>
              <strong className="text-2xl font-black text-neutralDark">{applicants.length}</strong>
            </div>
            <div className="bg-white rounded-2xl p-4 card-shadow border border-amber-100">
              <span className="text-xs text-neutralMuted block">في المراجعة</span>
              <strong className="text-2xl font-black text-amber-600">
                {applicants.filter(a => a.status === 'SUBMITTED' || a.status === 'CV_VIEWED').length}
              </strong>
            </div>
            <div className="bg-white rounded-2xl p-4 card-shadow border border-amber-100">
              <span className="text-xs text-neutralMuted block">مختصرين / مقابلات</span>
              <strong className="text-2xl font-black text-purple-600">
                {applicants.filter(a => a.status === 'SHORTLISTED' || a.status === 'INTERVIEW_SCHEDULED').length}
              </strong>
            </div>
            <div className="bg-white rounded-2xl p-4 card-shadow border border-amber-100">
              <span className="text-xs text-neutralMuted block">مقبولين</span>
              <strong className="text-2xl font-black text-green-600">
                {applicants.filter(a => a.status === 'ACCEPTED').length}
              </strong>
            </div>
          </div>

          {/* SEARCH & FILTERS */}
          <div className="bg-white rounded-3xl p-4 card-shadow border border-amber-100 flex flex-col sm:flex-row gap-3">
            <input 
              type="text" 
              placeholder="🔍 بحث بالاسم أو الهاتف أو الرمز (APP-0001)..."
              value={searchQuery}
              onChange={e => setSearchQuery(e.target.value)}
              className="flex-1 h-11 px-4 rounded-xl bg-[#FFFDF7] border border-amber-200 text-xs focus:outline-none focus:border-amber-500"
            />
            
            <div className="flex gap-1 overflow-x-auto no-scrollbar pb-1 sm:pb-0">
              {[
                { id: 'ALL', label: 'الكل' },
                { id: 'SUBMITTED', label: 'جديد' },
                { id: 'SHORTLISTED', label: 'مختصر' },
                { id: 'INTERVIEW_SCHEDULED', label: 'مقابلات' },
                { id: 'ACCEPTED', label: 'مقبول' },
              ].map(f => (
                <button
                  key={f.id}
                  onClick={() => setFilterStatus(f.id)}
                  className={`px-3 h-11 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${
                    filterStatus === f.id ? 'bg-amber-500 text-white shadow-sm' : 'bg-amber-50 text-neutralDark hover:bg-amber-100'
                  }`}
                >
                  {f.label}
                </button>
              ))}
            </div>
          </div>

          {/* MAIN DATA LIST */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
            
            {/* APPLICANTS CARDS LIST */}
            <div className="md:col-span-1 space-y-3">
              <h3 className="text-xs font-bold text-neutralMuted px-1">قائمة الطلبات ({filtered.length})</h3>

              {filtered.length === 0 ? (
                <div className="bg-white rounded-2xl p-8 card-shadow border border-amber-100 text-center text-xs text-neutralMuted">
                  لا توجد طلبات مطابقة حالياً.
                </div>
              ) : (
                filtered.map(app => (
                  <div
                    key={app.id}
                    onClick={() => {
                      setSelectedApplicant(app);
                      onUpdateStatus(app.id, 'CV_VIEWED');
                    }}
                    className={`bg-white rounded-2xl p-4 card-shadow border cursor-pointer transition-all ${
                      selectedApplicant?.id === app.id 
                        ? 'border-amber-500 ring-2 ring-amber-200' 
                        : 'border-amber-100 hover:border-amber-300'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      {app.photoBase64 ? (
                        <img src={app.photoBase64} alt="" className="w-12 h-12 rounded-xl object-cover border border-amber-200" />
                      ) : (
                        <div className="w-12 h-12 rounded-xl bg-amber-100 text-amber-800 flex items-center justify-center font-bold text-sm">
                          👤
                        </div>
                      )}

                      <div className="flex-1 min-w-0">
                        <div className="flex justify-between items-center">
                          <strong className="text-xs font-extrabold text-neutralDark truncate block">{app.fullName}</strong>
                          <span className="font-mono text-[10px] font-bold text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded border border-amber-200">
                            {app.code}
                          </span>
                        </div>
                        <p className="text-[11px] text-neutralMuted mt-0.5">{app.qualification} • {app.yearsExperience} سنوات خبرة</p>
                        
                        <div className="flex items-center justify-between mt-2 pt-2 border-t border-amber-50">
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                            app.status === 'ACCEPTED' ? 'bg-green-100 text-green-800' :
                            app.status === 'SHORTLISTED' ? 'bg-amber-100 text-amber-800' :
                            'bg-orange-50 text-amber-800'
                          }`}>
                            {app.status}
                          </span>
                          <span className="text-[10px] text-neutralMuted">{app.city}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                ))
              )}
            </div>

            {/* APPLICANT FULL PROFILE DRAWER */}
            <div className="md:col-span-2">
              {selectedApplicant ? (
                <div className="bg-white rounded-3xl p-6 card-shadow border border-amber-100 space-y-6 sticky top-20 animate-fade-in">
                  
                  {/* Profile Header */}
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-amber-100 pb-4">
                    <div className="flex items-center gap-3">
                      {selectedApplicant.photoBase64 ? (
                        <img 
                          src={selectedApplicant.photoBase64} 
                          alt="" 
                          className="w-16 h-16 rounded-2xl object-cover border-2 border-amber-400 shadow-md"
                        />
                      ) : (
                        <div className="w-16 h-16 rounded-2xl bg-amber-100 text-amber-800 flex items-center justify-center font-bold text-2xl">
                          👤
                        </div>
                      )}
                      <div>
                        <div className="flex items-center gap-2">
                          <h3 className="font-extrabold text-lg text-neutralDark">{selectedApplicant.fullName}</h3>
                          <span className="font-mono text-xs font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200">
                            {selectedApplicant.code}
                          </span>
                        </div>
                        <p className="text-xs text-neutralMuted mt-0.5">
                          📞 {selectedApplicant.phone} {selectedApplicant.email && `• ✉️ ${selectedApplicant.email}`}
                        </p>
                      </div>
                    </div>

                    {/* Quick Status dropdown & Actions */}
                    <div className="flex items-center gap-2">
                      <select
                        value={selectedApplicant.status}
                        onChange={(e) => onUpdateStatus(selectedApplicant.id, e.target.value)}
                        className="h-10 px-3 rounded-xl bg-amber-50 border border-amber-300 text-xs font-bold text-amber-900 focus:outline-none"
                      >
                        <option value="SUBMITTED">SUBMITTED (جديد)</option>
                        <option value="CV_VIEWED">CV_VIEWED (تم الفحص)</option>
                        <option value="SHORTLISTED">SHORTLISTED (مختصر)</option>
                        <option value="INTERVIEW_SCHEDULED">INTERVIEW_SCHEDULED (مقابلة)</option>
                        <option value="ACCEPTED">ACCEPTED (مقبول ✓)</option>
                        <option value="REJECTED">REJECTED (مرفوض ✕)</option>
                      </select>

                      <button
                        onClick={() => setScheduleModalOpen(true)}
                        className="h-10 px-3.5 bg-gradient-to-r from-amber-500 to-amber-600 text-white rounded-xl text-xs font-bold shadow-sm flex items-center gap-1"
                      >
                        <span>📅</span>
                        <span>جدولة مقابلة</span>
                      </button>
                    </div>
                  </div>

                  {/* Direct Contact Buttons (Phone / WhatsApp) */}
                  <div className="flex gap-2">
                    <a 
                      href={`https://wa.me/${selectedApplicant.phone.replace(/[^0-9]/g, '')}`}
                      target="_blank"
                      className="flex-1 h-10 rounded-xl bg-green-50 text-green-700 border border-green-200 text-xs font-bold flex items-center justify-center gap-1.5 hover:bg-green-100"
                    >
                      <span>💬</span>
                      <span>محادثة واتساب مباشرة</span>
                    </a>
                    <a 
                      href={`tel:${selectedApplicant.phone}`}
                      className="flex-1 h-10 rounded-xl bg-blue-50 text-blue-700 border border-blue-200 text-xs font-bold flex items-center justify-center gap-1.5 hover:bg-blue-100"
                    >
                      <span>📞</span>
                      <span>اتصال هاتفي</span>
                    </a>
                  </div>

                  {/* DATA GRID */}
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs bg-amber-50/40 p-4 rounded-2xl border border-amber-200">
                    <div><span className="text-neutralMuted block">العمر:</span> <strong>{selectedApplicant.age} سنة</strong></div>
                    <div><span className="text-neutralMuted block">الجنسية:</span> <strong>{selectedApplicant.nationality}</strong></div>
                    <div><span className="text-neutralMuted block">المدينة:</span> <strong>{selectedApplicant.city}</strong></div>
                    <div><span className="text-neutralMuted block">المؤهل:</span> <strong>{selectedApplicant.qualification}</strong></div>
                    <div><span className="text-neutralMuted block">سنوات الخبرة:</span> <strong>{selectedApplicant.yearsExperience} سنوات</strong></div>
                    <div><span className="text-neutralMuted block">الراتب المتوقع:</span> <strong>{selectedApplicant.expectedSalary || 'لم يحدد'}</strong></div>
                    <div className="sm:col-span-2"><span className="text-neutralMuted block">الوظيفة السابقة:</span> <strong>{selectedApplicant.currentJob || 'لا يوجد'}</strong></div>
                    <div><span className="text-neutralMuted block">مستوى Excel:</span> <strong>{selectedApplicant.excelLevel || 'غير محدد'}</strong></div>
                    <div className="col-span-2 sm:col-span-3"><span className="text-neutralMuted block">البرامج المحاسبية:</span> <strong>{selectedApplicant.accountingSoftware || 'لم يحدد'}</strong></div>
                    <div><span className="text-neutralMuted block">خبرة VAT:</span> <strong>{selectedApplicant.hasVatExp || 'لا'}</strong></div>
                  </div>

                  {/* CV DOWNLOAD / VIEW BOX */}
                  <div className="p-4 bg-white rounded-2xl border-2 border-amber-200 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-sm">
                    <div className="flex items-center gap-3 text-right">
                      <span className="text-3xl">📑</span>
                      <div>
                        <strong className="text-xs text-neutralDark block">ملف السيرة الذاتية (CV)</strong>
                        <span className="text-[11px] text-neutralMuted">{selectedApplicant.cvName || 'CV_Accountant.pdf'}</span>
                      </div>
                    </div>

                    {selectedApplicant.cvBase64 ? (
                      <a
                        href={selectedApplicant.cvBase64}
                        download={selectedApplicant.cvName || 'CV.pdf'}
                        className="px-5 h-10 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm"
                      >
                        <span>📥</span>
                        <span>تحميل ومعاينة الـ CV</span>
                      </a>
                    ) : (
                      <button 
                        onClick={() => alert('تم تسجيل فحص السيرة الذاتية')}
                        className="px-4 h-10 bg-neutralDark text-white rounded-xl text-xs font-bold"
                      >
                        فحص الـ CV
                      </button>
                    )}
                  </div>

                  {/* INTERVIEW STATUS IF SCHEDULED */}
                  {selectedApplicant.interview && (
                    <div className="bg-purple-50 border border-purple-200 rounded-2xl p-4 text-xs space-y-2">
                      <strong className="text-purple-900 block text-sm">📹 مقابلة شخصية مجدولة</strong>
                      <div className="flex gap-4 text-purple-800">
                        <span>📅 التاريخ: <strong>{selectedApplicant.interview.date}</strong></span>
                        <span>⏰ الوقت: <strong>{selectedApplicant.interview.time}</strong></span>
                      </div>
                      <a 
                        href={selectedApplicant.interview.meetLink} 
                        target="_blank" 
                        className="inline-block text-purple-700 font-bold underline mt-1"
                      >
                        رابط Google Meet: {selectedApplicant.interview.meetLink}
                      </a>
                    </div>
                  )}

                  {/* RECRUITER NOTES */}
                  <div>
                    <h4 className="font-extrabold text-xs text-neutralMuted mb-2">ملاحظات سرية للإدارة</h4>
                    <div className="space-y-2 mb-3">
                      {selectedApplicant.notes && selectedApplicant.notes.map((n, i) => (
                        <div key={i} className="bg-amber-50/70 border border-amber-200 p-2.5 rounded-xl text-xs text-amber-900 flex justify-between">
                          <span>💬 {n.text}</span>
                          <span className="text-[10px] text-amber-700/60">{n.date}</span>
                        </div>
                      ))}
                    </div>

                    <div className="flex gap-2">
                      <input 
                        type="text" 
                        id="newNoteInput"
                        placeholder="أضف تقييم أو ملاحظة داخلية للمرشح..."
                        className="flex-1 h-10 px-3 rounded-xl bg-[#FFFDF7] border border-amber-200 text-xs focus:outline-none focus:border-amber-500"
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') {
                            const val = e.target.value.trim();
                            if (val) {
                              onAddNote(selectedApplicant.id, val);
                              e.target.value = '';
                            }
                          }
                        }}
                      />
                      <button
                        onClick={() => {
                          const el = document.getElementById('newNoteInput');
                          if (el && el.value.trim()) {
                            onAddNote(selectedApplicant.id, el.value.trim());
                            el.value = '';
                          }
                        }}
                        className="px-4 h-10 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold"
                      >
                        إضافة
                      </button>
                    </div>
                  </div>

                </div>
              ) : (
                <div className="bg-white rounded-3xl p-12 card-shadow border border-amber-100 text-center text-xs text-neutralMuted">
                  <span className="text-4xl block mb-2">👈</span>
                  <span>اختر مرشحاً من القائمة الجانبية لعرض كافة بياناته وصورته وسيرته الذاتية</span>
                </div>
              )}
            </div>

          </div>

          {/* SCHEDULE MODAL */}
          {scheduleModalOpen && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full card-shadow border border-amber-200 space-y-4">
                <h3 className="font-extrabold text-base text-neutralDark">
                  جدولة مقابلة لـ: {selectedApplicant?.fullName}
                </h3>
                
                <div>
                  <label className="block text-xs font-bold text-neutralDark mb-1">تاريخ المقابلة</label>
                  <input 
                    type="date" 
                    value={interviewDate}
                    onChange={e => setInterviewDate(e.target.value)}
                    className="w-full h-11 px-3 rounded-xl border border-amber-200 text-xs"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-neutralDark mb-1">وقت المقابلة</label>
                  <input 
                    type="time" 
                    value={interviewTime}
                    onChange={e => setInterviewTime(e.target.value)}
                    className="w-full h-11 px-3 rounded-xl border border-amber-200 text-xs"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-neutralDark mb-1">رابط Google Meet</label>
                  <input 
                    type="text" 
                    value={meetLink}
                    onChange={e => setMeetLink(e.target.value)}
                    className="w-full h-11 px-3 rounded-xl border border-amber-200 text-xs"
                  />
                </div>

                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => {
                      onScheduleInterview(selectedApplicant.id, {
                        date: interviewDate,
                        time: interviewTime,
                        meetLink: meetLink
                      });
                      setScheduleModalOpen(false);
                      alert('تم حفظ موعد المقابلة بنجاح وسيظهر للمتقدم في صفحة الاستعلام!');
                    }}
                    className="flex-1 h-11 bg-gradient-to-r from-amber-500 to-amber-600 text-white font-bold rounded-xl text-xs shadow-md"
                  >
                    حفظ وإرسال الموعد
                  </button>
                  <button
                    onClick={() => setScheduleModalOpen(false)}
                    className="px-4 h-11 border border-amber-200 text-neutralDark font-bold rounded-xl text-xs"
                  >
                    إلغاء
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount React Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
