<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>المستشار للمحاماة | بوابة استقطاب الكفاءات</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            emeraldLaw: {
              50: '#F0F7F6',
              100: '#E1EFEF',
              200: '#B8DCD8',
              300: '#83BFB8',
              400: '#4D9B92',
              500: '#20796F',
              600: '#146058',
              700: '#0E4943',
              800: '#0B3B36',
              900: '#072623',
              950: '#041614',
            },
            sandGold: {
              50: '#FAF6EE',
              100: '#F5EDDD',
              200: '#EBD9BA',
              300: '#DFC293',
              400: '#D1A96C',
              500: '#C29147',
              600: '#A47432',
              700: '#7E5526',
            },
            luxDark: '#0A1413',
            luxMuted: '#586A67',
          },
          animation: {
            'fade-up': 'fadeUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            fadeUp: {
              '0%': { opacity: '0', transform: 'translateY(12px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    * { 
      font-family: 'Cairo', sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }
    body { 
      background: linear-gradient(180deg, rgba(8, 38, 35, 0.84) 0%, rgba(5, 24, 22, 0.90) 100%), 
                  url('https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=2000&q=85') center/cover fixed no-repeat;
      color: #0A1413; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .lux-hero-bg {
      background: linear-gradient(135deg, rgba(11, 59, 54, 0.88) 0%, rgba(4, 22, 20, 0.92) 100%), 
                  url('https://images.unsplash.com/photo-1497215842964-222b430dc094?auto=format&fit=crop&w=1600&q=85') center/cover no-repeat;
    }
    .lux-card-shadow {
      box-shadow: 0 16px 40px -6px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.15);
    }
    .lux-card-hover {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .lux-card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 50px -8px rgba(0, 0, 0, 0.35), 0 0 0 2px #C89B53;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen text-[#0A1413]">

  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- UNIFIED CRISP VECTOR ICON SYSTEM ---
    const Icon = {
      Scale: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
          <path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
          <path d="M7 21h10"/>
          <path d="M12 3v18"/>
          <path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>
        </svg>
      ),
      Briefcase: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          <rect width="20" height="14" x="2" y="6" rx="2"/>
        </svg>
      ),
      User: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      ),
      FileText: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
          <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
          <path d="M10 9H8"/>
          <path d="M16 13H8"/>
          <path d="M16 17H8"/>
        </svg>
      ),
      Camera: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
          <circle cx="12" cy="13" r="3"/>
        </svg>
      ),
      Search: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
      ),
      Shield: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      ),
      Check: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      ),
      Calendar: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <rect width="18" height="18" x="3" y="4" rx="2"/>
          <line x1="16" x2="16" y1="2" y2="6"/>
          <line x1="8" x2="8" y1="2" y2="6"/>
          <line x1="3" x2="21" y1="10" y2="10"/>
        </svg>
      ),
      Video: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <path d="m22 8-6 4 6 4V8Z"/>
          <rect width="14" height="12" x="2" y="6" rx="2"/>
        </svg>
      ),
      Phone: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
      ),
      MessageSquare: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      ),
      UploadCloud: ({ className = "w-6 h-6" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/>
          <path d="M12 12v9"/>
          <path d="m16 16-4-4-4 4"/>
        </svg>
      ),
      Download: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" x2="12" y1="15" y2="3"/>
        </svg>
      ),
      Trash: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 6h18"/>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
        </svg>
      ),
      Eye: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      ),
      ArrowLeft: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M19 12H5"/>
          <path d="m12 19-7-7 7-7"/>
        </svg>
      ),
      Building: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <rect width="16" height="20" x="4" y="2" rx="2" ry="2"/>
          <path d="M9 22v-4h6v4"/>
          <path d="M8 6h.01"/>
          <path d="M16 6h.01"/>
          <path d="M8 10h.01"/>
          <path d="M16 10h.01"/>
          <path d="M8 14h.01"/>
          <path d="M16 14h.01"/>
        </svg>
      ),
    };

    const STORAGE_KEY = 'hireflow_applicants_v5';
    const SEQ_KEY = 'hireflow_seq_v5';

    function App() {
      const [view, setView] = useState('welcome');
      const [applicants, setApplicants] = useState([]);
      const [lastSubmittedCode, setLastSubmittedCode] = useState('');
      const [selectedApplicant, setSelectedApplicant] = useState(null);
      const [isAdminAuthModalOpen, setIsAdminAuthModalOpen] = useState(false);
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);

      useEffect(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            setApplicants(JSON.parse(saved));
          } catch(e) {
            setApplicants([]);
          }
        }
      }, []);

      const saveApplicants = (newList) => {
        setApplicants(newList);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(newList));
      };

      const handleFormSubmit = (formData) => {
        let currentSeq = parseInt(localStorage.getItem(SEQ_KEY) || '0', 10);
        currentSeq += 1;
        localStorage.setItem(SEQ_KEY, currentSeq.toString());

        const codeStr = 'APP-' + String(currentSeq).padStart(4, '0');

        const newApplicant = {
          id: String(Date.now()),
          code: codeStr,
          submittedAt: new Date().toLocaleDateString('ar-SA', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
          status: 'SUBMITTED',
          cvViewed: false,
          cvViewedAt: null,
          interview: null,
          notes: [],
          ...formData
        };

        const updated = [newApplicant, ...applicants];
        saveApplicants(updated);
        setLastSubmittedCode(codeStr);
        setView('success');
      };

      const updateApplicantStatus = (id, newStatus) => {
        const updated = applicants.map(app => {
          if (app.id === id) {
            return {
              ...app,
              status: newStatus,
              cvViewed: newStatus === 'CV_VIEWED' ? true : app.cvViewed,
              cvViewedAt: newStatus === 'CV_VIEWED' && !app.cvViewedAt ? new Date().toLocaleDateString('ar-SA') : app.cvViewedAt
            };
          }
          return app;
        });
        saveApplicants(updated);
        if (selectedApplicant && selectedApplicant.id === id) {
          setSelectedApplicant(updated.find(a => a.id === id));
        }
      };

      const handleScheduleInterview = (id, interviewData) => {
        const updated = applicants.map(app => {
          if (app.id === id) {
            return {
              ...app,
              status: 'INTERVIEW_SCHEDULED',
              interview: interviewData
            };
          }
          return app;
        });
        saveApplicants(updated);
        if (selectedApplicant && selectedApplicant.id === id) {
          setSelectedApplicant(updated.find(a => a.id === id));
        }
      };

      const handleAddNote = (id, noteText) => {
        const updated = applicants.map(app => {
          if (app.id === id) {
            return {
              ...app,
              notes: [...(app.notes || []), { text: noteText, date: new Date().toLocaleDateString('ar-SA') }]
            };
          }
          return app;
        });
        saveApplicants(updated);
        if (selectedApplicant && selectedApplicant.id === id) {
          setSelectedApplicant(updated.find(a => a.id === id));
        }
      };

      const handleResetAll = () => {
        if (confirm('هل تريد مسح جميع المتقدمين وتصفير العداد إلى APP-0001؟')) {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(SEQ_KEY);
          setApplicants([]);
          setSelectedApplicant(null);
          alert('تم تصفير البيانات والترقيم بنجاح.');
        }
      };

      return (
        <div className="min-h-screen flex flex-col">
          
          {/* ================= 1. DEDICATED HEADER ================= */}
          <header className="bg-white/90 backdrop-blur-md border-b border-[#EAE4DC]/60 sticky top-0 z-40 px-4 py-3.5 shadow-md">
            <div className="max-w-4xl mx-auto flex items-center justify-between">
              
              {/* Logo / Brand */}
              <div 
                className="flex items-center gap-3 cursor-pointer group"
                onClick={() => setView('welcome')}
              >
                <div className="w-10 h-10 rounded-2xl bg-emeraldLaw-800 text-white flex items-center justify-center shadow-md shadow-emeraldLaw-900/15 group-hover:scale-105 transition-transform">
                  <Icon.Scale className="w-5 h-5 text-[#EBD9BA]" />
                </div>
                <div>
                  <h1 className="font-extrabold text-sm text-neutralDark leading-tight tracking-tight">المستشار للمحاماة</h1>
                  <p className="text-[11px] text-emeraldLaw-800 font-bold">بوابة التوظيف واستقطاب الكفاءات</p>
                </div>
              </div>

              {/* Header Navigation Links */}
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setView('welcome')}
                  className={`text-xs font-bold px-3 py-2 rounded-xl transition-colors ${view === 'welcome' ? 'bg-emeraldLaw-50 text-emeraldLaw-800' : 'text-neutralDark hover:bg-[#F3EFE9]'}`}
                >
                  الرئيسية
                </button>
                <button
                  onClick={() => setView('form')}
                  className={`text-xs font-bold px-3.5 py-2 rounded-xl transition-colors ${view === 'form' ? 'bg-emeraldLaw-800 text-white shadow-sm' : 'text-neutralDark hover:bg-[#F3EFE9]'}`}
                >
                  تقديم طلب
                </button>
                <button
                  onClick={() => setView('track')}
                  className={`text-xs font-bold px-3 py-2 rounded-xl transition-colors ${view === 'track' ? 'bg-emeraldLaw-50 text-emeraldLaw-800' : 'text-neutralDark hover:bg-[#F3EFE9]'}`}
                >
                  متابعة الطلب
                </button>
                {isAdminLoggedIn && view === 'admin' && (
                  <button
                    onClick={() => { setIsAdminLoggedIn(false); setView('welcome'); }}
                    className="text-xs font-bold px-3 py-1.5 rounded-xl bg-red-50 text-red-700 border border-red-200 hover:bg-red-100"
                  >
                    خروج الإدارة
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* ================= 2. MAIN BODY CONTENT ================= */}
          <main className="flex-1 max-w-4xl w-full mx-auto px-4 py-5 md:py-8">
            {view === 'welcome' && (
              <WelcomeGateway 
                onSelectApply={() => setView('form')}
                onSelectTrack={() => setView('track')}
              />
            )}

            {view === 'form' && (
              <ApplicantForm 
                onSubmit={handleFormSubmit} 
                onBack={() => setView('welcome')}
              />
            )}

            {view === 'success' && (
              <SuccessCard 
                code={lastSubmittedCode} 
                onGoTrack={() => setView('track')} 
                onNewApply={() => setView('form')}
                onGoHome={() => setView('welcome')}
              />
            )}

            {view === 'track' && (
              <TrackView 
                applicants={applicants} 
                defaultCode={lastSubmittedCode}
                onBack={() => setView('welcome')}
              />
            )}

            {view === 'admin' && isAdminLoggedIn && (
              <AdminDashboard 
                applicants={applicants}
                selectedApplicant={selectedApplicant}
                setSelectedApplicant={setSelectedApplicant}
                onUpdateStatus={updateApplicantStatus}
                onScheduleInterview={handleScheduleInterview}
                onAddNote={handleAddNote}
                onResetAll={handleResetAll}
              />
            )}
          </main>

          {/* ================= 3. DEDICATED FOOTER (With Invisible Admin Click on Copyright Text) ================= */}
          <footer className="mt-auto bg-emeraldLaw-950/95 backdrop-blur-md border-t border-emeraldLaw-900/60 text-white/80 py-8 px-4 text-xs">
            <div className="max-w-4xl mx-auto space-y-6">
              
              <div className="flex flex-col sm:flex-row items-center justify-between gap-4 border-b border-white/10 pb-6 text-center sm:text-right">
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center text-[#EBD9BA]">
                    <Icon.Scale className="w-5 h-5" />
                  </div>
                  <div>
                    <h3 className="font-extrabold text-white text-sm">مكتب المستشار للمحاماة والاستشارات القانونية</h3>
                    <p className="text-[11px] text-white/60">بوابة التوظيف المالي والإداري · الرياض</p>
                  </div>
                </div>

                <div className="flex gap-4 text-xs font-medium text-white/70">
                  <button onClick={() => setView('welcome')} className="hover:text-white transition-colors">الرئيسية</button>
                  <button onClick={() => setView('form')} className="hover:text-white transition-colors">تقديم على وظيفة</button>
                  <button onClick={() => setView('track')} className="hover:text-white transition-colors">استعلام عن طلب</button>
                </div>
              </div>

              {/* Bottom Copyright Text — Secretly acts as the Admin Portal Trigger! */}
              <div className="text-center sm:text-right text-[11px]">
                <p 
                  onClick={() => setIsAdminAuthModalOpen(true)}
                  className="text-white/40 hover:text-white/60 transition-colors inline-block cursor-default select-none"
                  title=""
                >
                  © 2026 جميع الحقوق محفوظة لمكتب المستشار للمحاماة والاستشارات القانونية.
                </p>
              </div>

            </div>
          </footer>

          {/* ================= 4. STRICT ADMIN AUTH MODAL ================= */}
          {isAdminAuthModalOpen && (
            <AdminAuthModal 
              onSuccess={() => {
                setIsAdminLoggedIn(true);
                setIsAdminAuthModalOpen(false);
                setView('admin');
              }}
              onClose={() => setIsAdminAuthModalOpen(false)}
            />
          )}

        </div>
      );
    }

    /* ---------------- 0. LUXURY WELCOME GATEWAY ---------------- */
    function WelcomeGateway({ onSelectApply, onSelectTrack }) {
      return (
        <div className="max-w-3xl mx-auto space-y-6 md:space-y-8 animate-fade-up">
          
          {/* HERO LUXURY CARD */}
          <div className="lux-hero-bg rounded-[32px] p-7 md:p-12 text-white relative overflow-hidden shadow-2xl border border-white/15">
            <div className="absolute inset-0 bg-gradient-to-t from-emeraldLaw-950/90 via-transparent to-black/20 pointer-events-none"></div>

            <div className="relative z-10 space-y-4 max-w-xl text-right">
              <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/15 backdrop-blur-md border border-white/25 text-[#EBD9BA] text-xs font-bold shadow-sm">
                <Icon.Scale className="w-3.5 h-3.5 text-[#EBD9BA]" />
                <span>مكتب المستشار للمحاماة والاستشارات القانونية</span>
              </div>

              <h2 className="text-3xl md:text-5xl font-extrabold tracking-tight leading-tight drop-shadow-md">
                بوابة التوظيف <br className="hidden sm:block" />
                <span className="text-[#EBD9BA]">واستقطاب الكفاءات المالية</span>
              </h2>

              <p className="text-xs md:text-sm text-white/95 leading-relaxed font-normal pt-1 drop-shadow">
                نرحب بالكفاءات المحاسبية المتميزة للانضمام إلى فريق عملنا في مدينة الرياض. اختر الإجراء المناسب للمتابعة:
              </p>
            </div>
          </div>

          {/* TWO PRIMARY INTERACTIVE CHOICE CARDS */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-5 pt-2">

        const file = e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          alert('يرجى اختيار صورة صحيحة (JPG أو PNG)');
          return;
        }
        const reader = new FileReader();
        reader.onloadend = () => {
          setFormData(prev => ({
            ...prev,
            photoBase64: reader.result,
            photoName: file.name
          }));
        };
        reader.readAsDataURL(file);
      };

      const handleCvUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 8 * 1024 * 1024) {
          alert('حجم السيرة الذاتية يجب ألا يتجاوز 8 ميجابايت');
          return;
        }
        const reader = new FileReader();
        reader.onloadend = () => {
          setFormData(prev => ({
            ...prev,
            cvBase64: reader.result,
            cvName: file.name
          }));
        };
        reader.readAsDataURL(file);

            {/* CARDS LIST */}
            <div className="md:col-span-1 space-y-3">
              <h3 className="text-xs font-bold text-white px-1">قائمة الطلبات ({filtered.length})</h3>

              {filtered.length === 0 ? (
                <div className="bg-white/95 backdrop-blur-md rounded-2xl p-8 lux-card-shadow border border-white/80 text-center text-xs text-luxMuted">
                  لا توجد طلبات مطابقة حالياً.
                </div>
              ) : (
                filtered.map(app => (
                  <div
                    key={app.id}
                    onClick={() => {
                      setSelectedApplicant(app);
                      onUpdateStatus(app.id, 'CV_VIEWED');
                    }}
                    className={`bg-white/95 backdrop-blur-md rounded-2xl p-4 lux-card-shadow lux-card-hover border cursor-pointer transition-all ${
                      selectedApplicant?.id === app.id 
                        ? 'border-emeraldLaw-800 ring-2 ring-emeraldLaw-200' 
                        : 'border-white/80'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      {app.photoBase64 ? (
                        <img src={app.photoBase64} alt="" className="w-12 h-12 rounded-xl object-cover border border-[#EAE4DC]" />
                      ) : (
                        <div className="w-12 h-12 rounded-xl bg-emeraldLaw-50 text-emeraldLaw-800 flex items-center justify-center font-bold text-sm">
                          <Icon.User className="w-5 h-5" />
                        </div>
                      )}

                      <div className="flex-1 min-w-0">
                        <div className="flex justify-between items-center">
                          <strong className="text-xs font-extrabold text-neutralDark truncate block">{app.fullName}</strong>
                          <span className="font-mono text-[10px] font-bold text-emeraldLaw-800 bg-emeraldLaw-50 px-1.5 py-0.5 rounded border border-emeraldLaw-100">
                            {app.code}
                          </span>
                        </div>
                        <p className="text-[11px] text-luxMuted mt-0.5">{app.qualification} • {app.yearsExperience} سنوات خبرة</p>
                        
                        <div className="flex items-center justify-between mt-2 pt-2 border-t border-[#F3EFE9]">
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                            app.status === 'ACCEPTED' ? 'bg-green-100 text-green-800' :
                            app.status === 'SHORTLISTED' ? 'bg-emeraldLaw-100 text-emeraldLaw-800' :
                            'bg-emeraldLaw-50 text-emeraldLaw-800'
                          }`}>
                            {app.status}
                          </span>
                          <span className="text-[10px] text-luxMuted">{app.city}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                ))
              )}
            </div>

            {/* PROFILE DRAWER */}
            <div className="md:col-span-2">
              {selectedApplicant ? (
                <div className="bg-white/95 backdrop-blur-md rounded-[28px] p-6 lux-card-shadow border border-white/80 space-y-6 sticky top-20 animate-fade-up">
                  
                  {/* Header */}
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-[#F3EFE9] pb-4">
                    <div className="flex items-center gap-3">
                      {selectedApplicant.photoBase64 ? (
                        <img 
                          src={selectedApplicant.photoBase64} 
                          alt="" 
                          className="w-16 h-16 rounded-2xl object-cover border-2 border-emeraldLaw-700 shadow-md"
                        />
                      ) : (
                        <div className="w-16 h-16 rounded-2xl bg-emeraldLaw-50 text-emeraldLaw-800 flex items-center justify-center font-bold text-2xl">
                          <Icon.User className="w-8 h-8" />
                        </div>
                      )}
                      <div>
                        <div className="flex items-center gap-2">
                          <h3 className="font-extrabold text-lg text-neutralDark">{selectedApplicant.fullName}</h3>
                          <span className="font-mono text-xs font-bold text-emeraldLaw-800 bg-emeraldLaw-50 px-2 py-0.5 rounded-full border border-emeraldLaw-100">
                            {selectedApplicant.code}
                          </span>
                        </div>
                        <p className="text-xs text-luxMuted mt-0.5">
                          {selectedApplicant.phone} {selectedApplicant.email && `• ${selectedApplicant.email}`}
                        </p>
                      </div>
                    </div>

                    <div className="flex items-center gap-2">
                      <select
                        value={selectedApplicant.status}
                        onChange={(e) => onUpdateStatus(selectedApplicant.id, e.target.value)}
                        className="h-10 px-3 rounded-xl bg-[#FAF8F5] border border-[#EAE4DC] text-xs font-bold text-neutralDark focus:outline-none"
                      >
                        <option value="SUBMITTED">SUBMITTED (جديد)</option>
                        <option value="CV_VIEWED">CV_VIEWED (تم الفحص)</option>
                        <option value="SHORTLISTED">SHORTLISTED (مختصر)</option>
                        <option value="INTERVIEW_SCHEDULED">INTERVIEW_SCHEDULED (مقابلة)</option>
                        <option value="ACCEPTED">ACCEPTED (مقبول ✓)</option>
                        <option value="REJECTED">REJECTED (مرفوض ✕)</option>
                      </select>

                      <button
                        onClick={() => setScheduleModalOpen(true)}
                        className="h-10 px-3.5 bg-emeraldLaw-800 hover:bg-emeraldLaw-900 text-white rounded-xl text-xs font-bold shadow-sm flex items-center gap-1"
                      >
                        <Icon.Calendar className="w-4 h-4" />
                        <span>مقابلة</span>
                      </button>
                    </div>
                  </div>

                  {/* Direct Contact Buttons */}
                  <div className="flex gap-2">
                    <a 
                      href={`https://wa.me/${selectedApplicant.phone.replace(/[^0-9]/g, '')}`}
                      target="_blank"
                      className="flex-1 h-10 rounded-xl bg-green-50 text-green-800 border border-green-200 text-xs font-bold flex items-center justify-center gap-1.5 hover:bg-green-100"
                    >
                      <Icon.MessageSquare className="w-4 h-4" />
                      <span>واتساب مباشر</span>
                    </a>
                    <a 
                      href={`tel:${selectedApplicant.phone}`}
                      className="flex-1 h-10 rounded-xl bg-emeraldLaw-50 text-emeraldLaw-800 border border-emeraldLaw-200 text-xs font-bold flex items-center justify-center gap-1.5 hover:bg-emeraldLaw-100"
                    >
                      <Icon.Phone className="w-4 h-4" />
                      <span>اتصال هاتفي</span>
                    </a>
                  </div>

                  {/* DATA GRID */}
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs bg-[#FAF8F5] p-4 rounded-2xl border border-[#EAE4DC]">
                    <div><span className="text-luxMuted block">العمر:</span> <strong>{selectedApplicant.age} سنة</strong></div>
                    <div><span className="text-luxMuted block">الجنسية:</span> <strong>{selectedApplicant.nationality}</strong></div>
                    <div><span className="text-luxMuted block">المدينة:</span> <strong>{selectedApplicant.city}</strong></div>
                    <div><span className="text-luxMuted block">المؤهل:</span> <strong>{selectedApplicant.qualification}</strong></div>
                    <div><span className="text-luxMuted block">سنوات الخبرة:</span> <strong>{selectedApplicant.yearsExperience} سنوات</strong></div>
                    <div><span className="text-luxMuted block">الراتب المتوقع:</span> <strong>{selectedApplicant.expectedSalary || 'لم يحدد'}</strong></div>
                    <div className="sm:col-span-2"><span className="text-luxMuted block">الوظيفة السابقة:</span> <strong>{selectedApplicant.currentJob || 'لا يوجد'}</strong></div>
                    <div><span className="text-luxMuted block">مستوى Excel:</span> <strong>{selectedApplicant.excelLevel || 'غير محدد'}</strong></div>
                    <div className="col-span-2 sm:col-span-3"><span className="text-luxMuted block">البرامج المحاسبية:</span> <strong>{selectedApplicant.accountingSoftware || 'لم يحدد'}</strong></div>
                    <div><span className="text-luxMuted block">خبرة VAT:</span> <strong>{selectedApplicant.hasVatExp || 'لا'}</strong></div>
                  </div>

                  {/* CV BOX */}
                  <div className="p-4 bg-white rounded-2xl border-2 border-[#EAE4DC] flex flex-col sm:flex-row items-center justify-between gap-3 shadow-sm">
                    <div className="flex items-center gap-3 text-right">
                      <div className="w-10 h-10 bg-emeraldLaw-50 text-emeraldLaw-800 rounded-xl flex items-center justify-center">
                        <Icon.FileText className="w-5 h-5" />
                      </div>
                      <div>
                        <strong className="text-xs text-neutralDark block">ملف السيرة الذاتية (CV)</strong>
                        <span className="text-[11px] text-luxMuted">{selectedApplicant.cvName || 'CV_Accountant.pdf'}</span>
                      </div>
                    </div>

                    {selectedApplicant.cvBase64 ? (
                      <a
                        href={selectedApplicant.cvBase64}
                        download={selectedApplicant.cvName || 'CV.pdf'}
                        className="px-5 h-10 bg-emeraldLaw-800 hover:bg-emeraldLaw-900 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm"
                      >
                        <Icon.Download className="w-4 h-4" />
                        <span>تحميل ومعاينة الـ CV</span>
                      </a>
                    ) : (
                      <button 
                        onClick={() => alert('تم تسجيل فحص السيرة الذاتية')}
                        className="px-4 h-10 bg-neutralDark text-white rounded-xl text-xs font-bold"
                      >
                        فحص الـ CV
                      </button>
                    )}
                  </div>

                  {/* INTERVIEW BANNER */}
                  {selectedApplicant.interview && (
                    <div className="bg-purple-50 border border-purple-200 rounded-2xl p-4 text-xs space-y-2">
                      <strong className="text-purple-900 block text-sm flex items-center gap-1.5">
                        <Icon.Video className="w-4 h-4" />
                        <span>مقابلة شخصية مجدولة</span>
                      </strong>
                      <div className="flex gap-4 text-purple-800">
                        <span>📅 التاريخ: <strong>{selectedApplicant.interview.date}</strong></span>
                        <span>⏰ الوقت: <strong>{selectedApplicant.interview.time}</strong></span>
                      </div>
                      <a 
                        href={selectedApplicant.interview.meetLink} 
                        target="_blank" 
                        className="inline-block text-purple-700 font-bold underline mt-1"
                      >
                        رابط Google Meet: {selectedApplicant.interview.meetLink}
                      </a>
                    </div>
                  )}

                  {/* NOTES */}
                  <div>
                    <h4 className="font-extrabold text-xs text-luxMuted mb-2">ملاحظات سرية للإدارة</h4>
                    <div className="space-y-2 mb-3">
                      {selectedApplicant.notes && selectedApplicant.notes.map((n, i) => (
                        <div key={i} className="bg-amber-50/80 border border-amber-200 p-2.5 rounded-xl text-xs text-amber-900 flex justify-between">
                          <span>💬 {n.text}</span>
                          <span className="text-[10px] text-amber-700/60">{n.date}</span>
                        </div>
                      ))}
                    </div>

                    <div className="flex gap-2">
                      <input 
                        type="text" 
                        id="newNoteInput"
                        placeholder="أضف تقييم أو ملاحظة داخلية للمرشح..."
                        className="flex-1 h-10 px-3 rounded-xl bg-[#FAF8F5] border border-[#EAE4DC] text-xs focus:outline-none focus:border-emeraldLaw-700"
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') {
                            const val = e.target.value.trim();
                            if (val) {
                              onAddNote(selectedApplicant.id, val);
                              e.target.value = '';
                            }
                          }
                        }}
                      />
                      <button
                        onClick={() => {
                          const el = document.getElementById('newNoteInput');
                          if (el && el.value.trim()) {
                            onAddNote(selectedApplicant.id, el.value.trim());
                            el.value = '';
                          }
                        }}
                        className="px-4 h-10 bg-emeraldLaw-800 hover:bg-emeraldLaw-900 text-white rounded-xl text-xs font-bold"
                      >
                        إضافة
                      </button>
                    </div>
                  </div>

                </div>
              ) : (
                <div className="bg-white/95 backdrop-blur-md rounded-[28px] p-12 lux-card-shadow border border-white/80 text-center text-xs text-luxMuted">
                  <span className="text-4xl block mb-2"><Icon.User className="w-10 h-10 mx-auto text-luxMuted/50" /></span>
                  <span>اختر مرشحاً من القائمة الجانبية لعرض كافة بياناته وصورته وسيرته الذاتية</span>
                </div>
              )}
            </div>

          </div>

          {/* SCHEDULE MODAL */}
          {scheduleModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-up">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full lux-card-shadow border border-[#EAE4DC] space-y-4">
                <h3 className="font-extrabold text-base text-neutralDark">
                  جدولة مقابلة لـ: {selectedApplicant?.fullName}
                </h3>
                
                <div>
                  <label className="block text-xs font-bold text-neutralDark mb-1">تاريخ المقابلة</label>
                  <input 
                    type="date" 
                    value={interviewDate}
                    onChange={e => setInterviewDate(e.target.value)}
                    className="w-full h-11 px-3 rounded-xl border border-[#EAE4DC] text-xs"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-neutralDark mb-1">وقت المقابلة</label>
                  <input 
                    type="time" 
                    value={interviewTime}
                    onChange={e => setInterviewTime(e.target.value)}
                    className="w-full h-11 px-3 rounded-xl border border-[#EAE4DC] text-xs"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-neutralDark mb-1">رابط Google Meet</label>
                  <input 
                    type="text" 
                    value={meetLink}
                    onChange={e => setMeetLink(e.target.value)}
                    className="w-full h-11 px-3 rounded-xl border border-[#EAE4DC] text-xs"
                  />
                </div>

                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => {
                      onScheduleInterview(selectedApplicant.id, {
                        date: interviewDate,
                        time: interviewTime,
                        meetLink: meetLink
                      });
                      setScheduleModalOpen(false);
                      alert('تم حفظ موعد المقابلة بنجاح وسيظهر للمتقدم في صفحة الاستعلام!');
                    }}
                    className="flex-1 h-11 bg-emeraldLaw-800 hover:bg-emeraldLaw-900 text-white font-bold rounded-xl text-xs shadow-md"
                  >
                    حفظ وإرسال الموعد
                  </button>
                  <button
                    onClick={() => setScheduleModalOpen(false)}
                    className="px-4 h-11 border border-[#EAE4DC] text-neutralDark font-bold rounded-xl text-xs"
                  >
                    إلغاء
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
