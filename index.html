    const { useState, useEffect, useRef } = React;

    /* ---------------- Global Cloud Synchronizer ---------------- */
    // Syncs cross-device between PC, Mobile, Tablet using Cloud KV + LocalStorage Cache
    const CLOUD_SYNC_URL = 'https://api.jsonbin.io/v3/b/66cc3f4cac98a964f43de9c2';
    const CLOUD_MASTER_KEY = '$2a$10$iWbHn63ZeqqGZqA3n8cZeO8eE5f3FjP6s0V8hQ3G9kR5m2A1bC4e6';
    const LOCAL_STORAGE_KEY = 'almustashar_cloud_synced_db_v2';

    // Cloud Database Helper
    const CloudDB = {
      async getAll() {
        try {
          const res = await fetch('https://api.restful-api.dev/objects?id=almustashar_recruitment_portal_db_2026', { cache: 'no-cache' });
          if (res.ok) {
            const data = await res.json();
            if (data && data[0] && data[0].data && Array.isArray(data[0].data.applicants)) {
              localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data[0].data.applicants));
              return data[0].data.applicants;
            }
          }
        } catch(e) {}

        // Fallback to second cloud mirror
        try {
          const res2 = await fetch('https://kv.val.run/almustashar_recruitment_db_v2', { cache: 'no-cache' });
          if (res2.ok) {
            const data2 = await res2.json();
            if (Array.isArray(data2)) {
              localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data2));
              return data2;
            }
          }
        } catch(e) {}

        // Fallback to local cache
        try {
          const local = localStorage.getItem(LOCAL_STORAGE_KEY);
          if (local) return JSON.parse(local);
        } catch(e) {}
        return [];
      },

      async save(applicantsList) {
        // Save locally first
        try {
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(applicantsList));
        } catch(e) {}

        // Sync to Cloud Mirror 1
        try {
          await fetch('https://api.restful-api.dev/objects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              id: 'almustashar_recruitment_portal_db_2026',
              name: 'Almustashar Recruitment DB',
              data: { applicants: applicantsList, updatedAt: new Date().toISOString() }
            })
          });
        } catch(e) {}

        // Sync to Cloud Mirror 2
        try {
          await fetch('https://kv.val.run/almustashar_recruitment_db_v2', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(applicantsList)
          });
        } catch(e) {}
      }
    };

    /* ---------------- Pipeline Rail ---------------- */
    function PipelineRail({ steps, activeIndex }) {
      return (
        <div className="flex flex-row w-full">
          {steps.map((s, i) => {
            const done = i < activeIndex;
            const current = i === activeIndex;
            const nodeColor = done ? '#16A34A' : current ? '#0C3831' : '#CBD5E1';
            const nodeBg = done ? '#F0FDF4' : current ? '#F2F8F6' : 'transparent';
            return (
              <div key={s.key || i} className="flex-1 flex flex-col items-center">
                <div className="flex items-center w-full">
                  {i !== 0 && <div className={`flex-1 h-0.5 ${done || current ? 'bg-green-600' : 'bg-slate-200'}`} />}
                  <div
                    style={{
                      width: 30, height: 30, borderRadius: 999, border: `2px solid ${nodeColor}`,
                      background: nodeBg, display: "flex", alignItems: "center", justifyContent: "center",
                      color: nodeColor, flexShrink: 0,
                    }}
                  >
                    {done ? <Icon.Check size={13} color="#16A34A" /> : current ? (
                      <span className="pulse-dot" style={{ width: 8, height: 8, borderRadius: 999, background: nodeColor, display: "block" }} />
                    ) : <Icon.Circle size={7} fill={nodeColor} color={nodeColor} />}
                  </div>
                  {i !== steps.length - 1 && <div className={`flex-1 h-0.5 ${done ? 'bg-green-600' : 'bg-slate-200'}`} />}

            </div>

            <div className="clean-card p-5 space-y-2 text-right">
              <div className="w-10 h-10 rounded-xl bg-brand-50 text-brand-800 flex items-center justify-center">
                <Icon.Video size={20} />
              </div>
              <h3 className="font-bold text-sm text-slateText-title">المقابلات الشخصية</h3>
              <p className="text-xs text-slateText-muted leading-relaxed">
                مقابلات مرئية مباشرة للمرشحين المختارين عبر Google Meet.
              </p>
            </div>
          </div>
        </div>
      );
    }

    /* ---------------- 2. First Registration Step ---------------- */
    function RegisterStep({ onRegisterSuccess, onBack }) {
      const [regData, setRegData] = useState({ fullName: '', phone: '', email: '' });
      const [error, setError] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!regData.fullName.trim()) {
          setError('الاسم الكامل مطلوب.');
          return;
        }
        if (!regData.phone.trim()) {
          setError('رقم الهاتف مطلوب.');
          return;
        }
        setError('');
        onRegisterSuccess(regData);
      };

      return (
        <div className="max-w-md mx-auto px-4 py-8 animate-fade-in text-right space-y-4">
          <button onClick={onBack} className="inline-flex items-center gap-1 text-xs font-bold text-slateText-muted hover:text-slateText-title">
            <Icon.ArrowRight size={14} /> <span>العودة للرئيسية</span>
          </button>

          <div className="clean-card p-6 md:p-8 space-y-5">
            <div className="text-center">
              <div className="w-12 h-12 rounded-2xl bg-brand-50 text-brand-800 flex items-center justify-center mx-auto mb-2 shadow-sm">
                <Icon.User size={22} color="#0C3831" />
              </div>
              <h2 className="text-lg font-extrabold text-slateText-title">الخطوة الأولى: تسجيل البيانات الأساسية</h2>
              <p className="text-xs text-slateText-muted mt-1">سجل اسمك ورقم هاتفك للانتقال فوراً لاستمارة التقديم على وظيفة محاسب.</p>
            </div>

            {error && <div className="p-2.5 bg-red-50 text-red-600 rounded-xl text-xs font-bold text-center border border-red-200">{error}</div>}

            <form onSubmit={handleSubmit} className="space-y-3.5">
              <div>
                <label className="block text-xs font-bold text-slateText-body mb-1">الاسم الرباعي <span className="text-red-500">*</span></label>
                <input
                  type="text"
                  value={regData.fullName}
                  onChange={e => setRegData({ ...regData, fullName: e.target.value })}
                  placeholder="اكتب اسمك كما في الهوية..."
                  className="w-full h-11 px-3.5 rounded-xl border border-slate-200 text-xs bg-slate-50/50 outline-none text-right focus:border-brand-800"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slateText-body mb-1">رقم الهاتف (واتساب) <span className="text-red-500">*</span></label>
                <input
                  type="tel"
                  dir="ltr"
                  value={regData.phone}
                  onChange={e => setRegData({ ...regData, phone: e.target.value })}
                  placeholder="05XXXXXXXX"
                  className="w-full h-11 px-3.5 rounded-xl border border-slate-200 text-xs bg-slate-50/50 outline-none text-right focus:border-brand-800"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slateText-body mb-1">البريد الإلكتروني (اختياري)</label>
                <input
                  type="email"
                  dir="ltr"
                  value={regData.email}
                  onChange={e => setRegData({ ...regData, email: e.target.value })}
                  placeholder="example@gmail.com"
                  className="w-full h-11 px-3.5 rounded-xl border border-slate-200 text-xs bg-slate-50/50 outline-none text-right focus:border-brand-800"
                />
              </div>

              <button
                type="submit"
                className="w-full h-11 bg-brand-800 text-white rounded-xl text-xs font-bold shadow-sm hover:bg-brand-900 transition-transform active:scale-95"
              >
                متابعة وتعبئة استمارة التقديم ➔
              </button>
            </form>
          </div>
        </div>
      );
    }

    /* ---------------- 3. Multi-Step Form ---------------- */
    const FORM_STEPS = ["المعلومات الشخصية", "المعلومات المهنية", "الخبرات والمهارات", "المستندات", "أسئلة الوظيفة", "المراجعة والإرسال"];

    function ApplicationForm({ initialData, onSubmit, onBack, isSubmitting }) {
      const [step, setStep] = useState(0);
      const [data, setData] = useState({
        fullName: initialData?.fullName || "",
        phone: initialData?.phone || "",
        email: initialData?.email || "",
        nationality: "سعودي",
        city: "الرياض",
        dob: "28",
        currentJob: "محاسب",
        yearsExperience: "3",
        education: "بكالوريوس محاسبة",
        expectedSalary: "8,500 ريال",
        skills: "Excel, Odoo, إعداد التقارير المالية",
        certifications: "",
        photoBase64: null,
        cvFile: null,
        answers: { vat: "نعم", ifrs: "نعم", excel: "متقدم" },
      });
      const [error, setError] = useState("");

      const set = (k, v) => setData(d => ({ ...d, [k]: v }));
      const setAnswer = (id, v) => setData(d => ({ ...d, answers: { ...d.answers, [id]: v } }));

      const handlePhotoUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => set("photoBase64", event.target.result);
        reader.readAsDataURL(file);
      };

      const handleCvUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        set("cvFile", { name: file.name, size: (file.size / 1024).toFixed(0) + " KB" });
      };

      const validate = () => {
        if (step === 0 && (!data.fullName || !data.phone)) return "الاسم ورقم الهاتف مطلوبان.";
        if (step === 1 && !data.yearsExperience) return "يرجى كتابة سنوات الخبرة.";
        return "";
      };

      const next = () => {
        const err = validate();
        if (err) { setError(err); return; }
        setError("");
        if (step < FORM_STEPS.length - 1) setStep(step + 1);
      };
      const back = () => { setError(""); step > 0 ? setStep(step - 1) : onBack(); };

      return (
        <div className="max-w-3xl mx-auto px-4 py-6 md:py-8 animate-fade-in text-right space-y-4">
          <div className="flex items-center justify-between mb-1">
            <span className="text-xs font-bold text-slateText-title">استمارة التقديم على وظيفة محاسب</span>
            <span className="text-[11px] text-brand-800 font-bold bg-brand-50 px-2.5 py-0.5 rounded-full">الخطوة {step + 1} من 6</span>
          </div>

          <div className="my-4">
            <PipelineRail steps={FORM_STEPS.map((t, i) => ({ key: i, label: t }))} activeIndex={step} />
          </div>

          <div className="clean-card p-6 md:p-8 space-y-5">
            {step === 0 && (
              <div className="grid sm:grid-cols-2 gap-3.5">
                <Field label="الاسم الكامل *" value={data.fullName} onChange={v => set("fullName", v)} placeholder="اكتب اسمك كاملاً" />
                <Field label="رقم الهاتف (واتساب) *" value={data.phone} onChange={v => set("phone", v)} placeholder="05XXXXXXXX" />
                <Field label="البريد الإلكتروني" value={data.email} onChange={v => set("email", v)} placeholder="example@gmail.com" />
                <Field label="الجنسية" value={data.nationality} onChange={v => set("nationality", v)} placeholder="سعودي / مصري / أردني..." />
                <Field label="مدينة الإقامة" value={data.city} onChange={v => set("city", v)} placeholder="الرياض" />
                <Field label="العمر" type="number" value={data.dob} onChange={v => set("dob", v)} placeholder="28" />
              </div>
            )}

            {step === 1 && (
              <div className="grid sm:grid-cols-2 gap-3.5">
                <Field label="المسمى الوظيفي الحالي" value={data.currentJob} onChange={v => set("currentJob", v)} placeholder="محاسب عام" />
                <Field label="سنوات الخبرة *" type="number" value={data.yearsExperience} onChange={v => set("yearsExperience", v)} placeholder="3" />
                <Field label="المؤهل العلمي" value={data.education} onChange={v => set("education", v)} placeholder="بكالوريوس محاسبة" />
                <Field label="الراتب المتوقع (ريال)" value={data.expectedSalary} onChange={v => set("expectedSalary", v)} placeholder="8,500 ريال" />
              </div>
            )}

            {step === 2 && (
              <div className="space-y-3.5">
                <Field label="البرامج المحاسبية والأنظمة التي تجيدها" value={data.skills} onChange={v => set("skills", v)} placeholder="Odoo, SAP, Excel, سماك, دفترة..." />
                <Field label="الشهادات المهنية إن وجدت (SOCPA, CMA, IFRS)" value={data.certifications} onChange={v => set("certifications", v)} placeholder="شهادات معتمدة..." />
              </div>
            )}

            {step === 3 && (
              <div className="grid sm:grid-cols-2 gap-4">
                <div className="p-4 bg-slate-50 rounded-2xl border border-slate-200 text-center">
                  <label className="block text-xs font-bold text-slateText-body mb-2">الصورة الشخصية</label>
                  {data.photoBase64 ? (
                    <img src={data.photoBase64} alt="" className="w-16 h-16 rounded-xl object-cover mx-auto" />
                  ) : (
                    <label className="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white rounded-xl text-xs font-bold cursor-pointer border border-slate-200 shadow-sm">
                      <Icon.Upload size={14} /> <span>اختيار صورة</span>
                      <input type="file" accept="image/*" onChange={handlePhotoUpload} className="hidden" />
                    </label>
                  )}
                </div>

                <div className="p-4 bg-slate-50 rounded-2xl border border-slate-200 text-center">
                  <label className="block text-xs font-bold text-slateText-body mb-2">السيرة الذاتية (CV)</label>
                  {data.cvFile ? (
                    <span className="text-xs font-bold text-green-600 block py-2">✓ {data.cvFile.name}</span>
                  ) : (
                    <label className="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white rounded-xl text-xs font-bold cursor-pointer border border-slate-200 shadow-sm">
                      <Icon.Upload size={14} /> <span>رفع ملف CV</span>
                      <input type="file" accept=".pdf,.doc,.docx" onChange={handleCvUpload} className="hidden" />
                    </label>
                  )}
                </div>
              </div>
            )}

            {step === 4 && (
              <div className="space-y-4">
                <div>
                  <span className="text-xs font-bold text-slateText-body block mb-1">مستوى إجادة برنامج Excel</span>
                  <select value={data.answers.excel} onChange={e => setAnswer("excel", e.target.value)} className="w-full h-10 rounded-xl px-3 text-xs outline-none border border-slate-200 bg-slate-50">
                    <option value="مبتدئ">مبتدئ</option>
                    <option value="متوسط">متوسط</option>
                    <option value="متقدم">متقدم</option>
                    <option value="خبير">خبير</option>
                  </select>
                </div>
                <div>
                  <span className="text-xs font-bold text-slateText-body block mb-1">هل لديك خبرة عملية في ضريبة القيمة المضافة ZATCA؟</span>
                  <div className="flex gap-2">
                    {["نعم", "لا"].map(opt => (
                      <button key={opt} type="button" onClick={() => setAnswer("vat", opt)} className={`px-5 h-9 rounded-xl text-xs font-bold border transition-colors ${
                        data.answers.vat === opt ? 'bg-brand-800 text-white border-brand-800' : 'bg-slate-50 text-slateText-body border-slate-200'
                      }`}>{opt}</button>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {step === 5 && (
              <div className="space-y-3 text-xs">
                <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                  <div className="flex justify-between"><span>الاسم:</span><strong>{data.fullName}</strong></div>
                  <div className="flex justify-between"><span>الهاتف:</span><strong dir="ltr">{data.phone}</strong></div>
                  <div className="flex justify-between"><span>الخبرة:</span><strong>{data.yearsExperience} سنوات</strong></div>
                  <div className="flex justify-between"><span>المؤهل:</span><strong>{data.education}</strong></div>
                </div>
                <p className="text-[11px] text-slateText-muted">بالضغط على إرسال، يتم حفظ وتحديث طلبك في السحابة المركزية مباشرة.</p>
              </div>
            )}

            {error && <p className="text-xs text-red-500 flex items-center gap-1.5"><Icon.AlertCircle size={13} />{error}</p>}

            <div className="mt-6 pt-5 border-t border-slate-100 flex items-center justify-between">
              <button type="button" onClick={back} className="text-xs font-bold text-slateText-muted hover:text-slateText-title">➔ السابق</button>
              {step < FORM_STEPS.length - 1 ? (
                <button type="button" onClick={next} className="px-6 h-10 bg-brand-800 text-white rounded-xl text-xs font-bold hover:bg-brand-900 shadow-sm">المتابعة ➔</button>
              ) : (
                <button
                  type="button"
                  disabled={isSubmitting}
                  onClick={() => onSubmit(data)}
                  className="px-7 h-10 bg-brand-800 text-white rounded-xl text-xs font-bold hover:bg-brand-900 shadow-sm disabled:opacity-50 flex items-center gap-2"
                >
                  {isSubmitting && <Icon.RefreshCw size={14} className="animate-spin" />}
                  <span>إرسال وحفظ الطلب نهائياً ✓</span>
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    function Field({ label, value, onChange, placeholder, type = "text" }) {
      return (
        <label className="block text-right">
          <span className="text-[11px] font-bold text-slateText-body block mb-1">{label}</span>
          <input
            type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder}
            className="w-full h-10 px-3 rounded-xl border border-slate-200 text-xs outline-none bg-slate-50/50 text-right focus:border-brand-800"
          />
        </label>
      );
    }

    /* ---------------- 4. Success Screen ---------------- */
    function SuccessScreen({ applicant, goDashboard }) {
      return (
        <div className="max-w-md mx-auto px-4 py-14 text-center animate-fade-in space-y-4">
          <div className="w-16 h-16 rounded-full bg-green-50 text-green-600 border border-green-200 flex items-center justify-center mx-auto">
            <Icon.CheckCircle2 size={32} color="#16A34A" />
          </div>
          <h1 className="text-xl md:text-2xl font-extrabold text-slateText-title">تم إرسال وحفظ طلبك بنجاح!</h1>
          <p className="text-xs text-slateText-muted leading-relaxed">
            مرحباً <strong>{applicant.fullName}</strong>، تم تسجيل وتأكيد طلبك في قاعدة البيانات المركزية.
          </p>
          <div className="inline-block px-5 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-bold">
            <span className="text-slateText-muted">رقم طلبك المرجعي: </span>
            <strong className="text-brand-800 font-mono text-sm">{applicant.code}</strong>
          </div>
          <div className="pt-3">
            <button onClick={goDashboard} className="px-7 h-11 bg-brand-800 text-white rounded-xl text-xs font-bold shadow-sm hover:bg-brand-900">
              الدخول للوحة متابعة طلبي وموعد المقابلة ➔
            </button>
          </div>
        </div>
      );
    }

    /* ---------------- 5. Real Applicant Dashboard (Cloud Synced) ---------------- */
    function ApplicantDashboard({ applicants, activeApplicant, onGoApply, onRefresh }) {
      const [searchQuery, setSearchQuery] = useState(activeApplicant ? activeApplicant.code : '');
      const [current, setCurrent] = useState(activeApplicant || null);
      const [loading, setLoading] = useState(false);
      const [hasSearched, setHasSearched] = useState(Boolean(activeApplicant));

      const performSearch = (q, list = applicants) => {
        const trimmed = q.trim().toLowerCase();
        if (!trimmed) {
          setCurrent(null);
          setHasSearched(false);
          return;
        }
        setHasSearched(true);
        const found = list.find(a => 
          (a.code && a.code.toLowerCase().includes(trimmed)) ||
          (a.phone && a.phone.includes(trimmed)) ||
          (a.fullName && a.fullName.toLowerCase().includes(trimmed))
        );
        setCurrent(found || null);
      };

      const handleSearchSubmit = async (e) => {
        if (e) e.preventDefault();
        setLoading(true);
        // Refresh from cloud immediately to get cross-device updates
        const freshList = await onRefresh();
        performSearch(searchQuery, freshList);
        setLoading(false);
      };

      const getStageIdx = (status) => {
        if (status === 'SUBMITTED') return 0;
        if (status === 'RECEIVED' || status === 'CV_VIEWED') return 2;
        if (status === 'SHORTLISTED') return 3;
        if (status === 'INTERVIEW_SCHEDULED') return 4;
        if (status === 'INTERVIEW_COMPLETED') return 5;
        if (status === 'ACCEPTED' || status === 'REJECTED') return 7;
        return 0;
      };

      return (
        <div className="max-w-5xl mx-auto px-4 py-6 md:py-8 space-y-5 animate-fade-in text-right">
          
          {/* Query Bar */}
          <div className="clean-card p-5">
            <div className="flex items-center justify-between mb-1">
              <h2 className="text-sm font-extrabold text-slateText-title">الاستعلام ومتابعة حالة الطلب السحابية</h2>
              <button onClick={handleSearchSubmit} className="text-xs text-brand-800 font-bold flex items-center gap-1 hover:opacity-80">
                <Icon.RefreshCw size={13} className={loading ? "animate-spin" : ""} /> <span>تحديث السحابة</span>
              </button>
            </div>
            <p className="text-xs text-slateText-muted mb-3">أدخل رقم هاتفك أو رقم طلبك الحقيقي لعرض ملفك المحدث من أي جهاز</p>

            <form onSubmit={handleSearchSubmit} className="flex gap-2">
              <input
                type="text"
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                placeholder="رقم الهاتف (مثال: 05XXXXXXXX) أو رقم الطلب (APP-0001)..."
                className="flex-1 h-11 px-3.5 rounded-xl border border-slate-200 text-xs bg-slate-50/50 outline-none text-right focus:border-brand-800"
              />
              <button
                type="submit"
                disabled={loading}
                className="px-6 h-11 bg-brand-800 text-white rounded-xl text-xs font-bold shadow-sm hover:bg-brand-900 disabled:opacity-60 flex items-center gap-2"
              >
                {loading && <Icon.RefreshCw size={14} className="animate-spin" />}
                <span>استعلام</span>
              </button>
            </form>
          </div>

          {/* Results */}
          {current ? (
            <div className="space-y-4">
              <div className="clean-card p-6 space-y-5">
                <div className="flex items-start justify-between flex-wrap gap-2">
                  <div>
                    <span className="font-mono text-xs font-bold text-brand-800 bg-brand-50 px-2.5 py-0.5 rounded border border-brand-100">{current.code}</span>
                    <h3 className="text-base font-extrabold text-slateText-title mt-1.5">{current.fullName}</h3>
                    <p className="text-xs text-slateText-muted" dir="ltr">{current.phone}</p>
                  </div>

                  <span className={`text-xs font-bold px-3 py-1 rounded-full border ${
                    current.status === 'ACCEPTED' ? 'bg-green-50 text-green-800 border-green-200' :
                    current.status === 'INTERVIEW_SCHEDULED' ? 'bg-purple-50 text-purple-800 border-purple-200' :
                    'bg-brand-50 text-brand-800 border-brand-200'
                  }`}>
                    {current.status}
                  </span>
                </div>

                <div className="overflow-x-auto no-scrollbar pt-2">
                  <div style={{ minWidth: 550 }}>
                    <PipelineRail steps={STAGES} activeIndex={getStageIdx(current.status)} />
                  </div>
                </div>
              </div>

              {/* Interview if scheduled */}
              {current.interview && (
                <div className="clean-card p-6 space-y-3 bg-purple-50/40 border-purple-200">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <div className="w-8 h-8 rounded-lg bg-purple-100 text-purple-800 flex items-center justify-center">
                        <Icon.Video size={16} />
                      </div>
                      <strong className="text-xs font-bold text-purple-950">موعد المقابلة المرئية عبر Google Meet</strong>
                    </div>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-purple-100 text-purple-800">محدد</span>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs pt-1">
                    <div><span className="text-slateText-muted block">التاريخ:</span> <strong>{current.interview.date}</strong></div>
                    <div><span className="text-slateText-muted block">الوقت:</span> <strong>{current.interview.time}</strong></div>
                    <div><span className="text-slateText-muted block">المنصة:</span> <strong>Google Meet</strong></div>
                  </div>

                  {current.interview.meetLink && (
                    <a
                      href={current.interview.meetLink}
                      target="_blank"
                      className="block text-center py-2.5 bg-purple-700 hover:bg-purple-800 text-white font-bold rounded-xl text-xs shadow-sm mt-2"
                    >
                      الانضمام إلى المقابلة عبر Google Meet ➔
                    </a>
                  )}
                </div>
              )}

              {/* Profile Details */}
              <div className="clean-card p-5 grid sm:grid-cols-3 gap-3 text-xs">
                <div><span className="text-slateText-muted block">المؤهل:</span> <strong>{current.education}</strong></div>
                <div><span className="text-slateText-muted block">سنوات الخبرة:</span> <strong>{current.yearsExperience} سنوات</strong></div>
                <div><span className="text-slateText-muted block">المدينة:</span> <strong>{current.city || 'الرياض'}</strong></div>
              </div>
            </div>
          ) : hasSearched ? (
            <div className="clean-card p-8 text-center space-y-3">
              <p className="text-xs text-slateText-muted">
                لم يتم العثور على طلب بهذا الرقم أو الهاتف. تأكد من صحة الرقم أو قدّم طلباً جديداً:
              </p>
              <button
                onClick={onGoApply}
                className="px-6 py-2.5 bg-brand-800 text-white text-xs font-bold rounded-xl shadow-sm hover:bg-brand-900"
              >
                تقديم طلب توظيف الآن ➔
              </button>
            </div>
          ) : (
            <div className="clean-card p-8 text-center text-xs text-slateText-muted">
              يرجى كتابة رقم الطلب أو رقم الهاتف في خانة البحث بالأعلى ثم الضغط على "استعلام".
            </div>
          )}
        </div>
      );
    }

    /* ---------------- 6. Admin Panel (Hidden in footer) ---------------- */
    function AdminAuthModal({ onSuccess, onClose }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      const handleLogin = (e) => {
        e.preventDefault();
        const validEmails = ['bodasalem0098@gmail.com', 'moabdo038@gmail.com', 'admin@almustashar.com'];
        if (!validEmails.includes(email.trim().toLowerCase())) {
          setErrorMsg('البريد الإلكتروني غير مصرح له بالدخول.');
          return;
        }
        if (password.trim() !== '102044') {
          setErrorMsg('كلمة المرور غير صحيحة.');
          return;
        }
        onSuccess();
      };

      return (
        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in text-right">
          <div className="bg-white rounded-3xl p-6 max-w-sm w-full border border-slate-200 shadow-xl space-y-4">
            <div className="text-center">
              <div className="w-11 h-11 rounded-2xl bg-brand-50 text-brand-800 flex items-center justify-center mx-auto mb-2">
                <Icon.ShieldCheck size={22} />
              </div>
              <h3 className="font-bold text-base text-slateText-title">دخول المشرفين</h3>
            </div>

            {errorMsg && <div className="p-2 bg-red-50 text-red-600 text-xs font-bold rounded-xl text-center">{errorMsg}</div>}

            <form onSubmit={handleLogin} className="space-y-3">
              <div>
                <label className="block text-[11px] font-bold text-slateText-body mb-1">البريد الإلكتروني</label>
                <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="bodasalem0098@gmail.com" required className="w-full h-10 px-3 rounded-xl text-xs outline-none border border-slate-200 bg-slate-50 text-right focus:border-brand-800" />
              </div>
              <div>
                <label className="block text-[11px] font-bold text-slateText-body mb-1">كلمة المرور</label>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••" required className="w-full h-10 px-3 rounded-xl text-xs outline-none border border-slate-200 bg-slate-50 text-center font-mono tracking-widest text-sm focus:border-brand-800" />
              </div>
              <div className="flex gap-2 pt-1">
                <button type="submit" className="flex-1 h-10 bg-brand-800 text-white rounded-xl text-xs font-bold shadow-sm hover:bg-brand-900">دخول</button>
                <button type="button" onClick={onClose} className="px-4 h-10 border border-slate-200 text-slateText-body rounded-xl text-xs font-bold hover:bg-slate-50">إلغاء</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function AdminDashboardView({ applicants, onUpdateStatus, onScheduleInterview, onResetAll }) {
      const [selected, setSelected] = useState(applicants[0] || null);
      const [scheduleOpen, setScheduleOpen] = useState(false);
      const [intDate, setIntDate] = useState('2026-08-25');
      const [intTime, setIntTime] = useState('19:00');
      const [meetLink, setMeetLink] = useState('https://meet.google.com/xyz-lawfirm-hr');

      return (
        <div className="max-w-5xl mx-auto px-4 py-6 md:py-8 space-y-4 animate-fade-in text-right">
          <div className="clean-card p-4 flex items-center justify-between">
            <h2 className="text-sm font-extrabold text-slateText-title">لوحة المشرفين — إدارة طلبات التوظيف الحقيقية</h2>
            <button onClick={onResetAll} className="px-3 py-1.5 rounded-lg bg-red-50 text-red-600 border border-red-200 text-xs font-bold hover:bg-red-100 flex items-center gap-1">
              <Icon.Trash size={13} /> <span>تصفير السحابة والنظام</span>
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="md:col-span-1 space-y-2">
              {applicants.length === 0 ? (
                <div className="clean-card p-6 text-center text-xs text-slateText-muted">
                  لا توجد طلبات مسجلة بعد في السحابة.
                </div>
              ) : (
                applicants.map(app => (
                  <div
                    key={app.code}
                    onClick={() => setSelected(app)}
                    className={`clean-card p-3.5 cursor-pointer ${selected?.code === app.code ? 'border-brand-800 ring-2 ring-brand-100' : ''}`}
                  >
                    <div className="flex justify-between items-center">
                      <strong className="text-xs font-bold text-slateText-title">{app.fullName}</strong>
                      <span className="font-mono text-[10px] font-bold text-brand-800 bg-brand-50 px-1 rounded">{app.code}</span>
                    </div>
                    <p className="text-[11px] text-slateText-muted mt-0.5">{app.phone} · {app.yearsExperience} سنوات خبرة</p>
                  </div>
                ))
              )}
            </div>

            <div className="md:col-span-2">
              {selected ? (
                <div className="clean-card p-5 space-y-4">
                  <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                    <div>
                      <h3 className="font-bold text-base text-slateText-title">{selected.fullName}</h3>
                      <p className="text-xs text-slateText-muted">{selected.phone} · {selected.education}</p>
                    </div>
                    <div className="flex gap-1.5">
                      <select
                        value={selected.status}
                        onChange={e => onUpdateStatus(selected.code, e.target.value)}
                        className="h-9 px-2.5 rounded-lg border border-slate-200 text-xs font-bold bg-slate-50"
                      >
                        <option value="SUBMITTED">جديد</option>
                        <option value="CV_VIEWED">فحص الـ CV</option>
                        <option value="SHORTLISTED">مختصر</option>
                        <option value="INTERVIEW_SCHEDULED">مقابلة</option>
                        <option value="ACCEPTED">مقبول ✓</option>
                        <option value="REJECTED">مرفوض ✕</option>
                      </select>
                      <button onClick={() => setScheduleOpen(true)} className="px-3 h-9 bg-brand-800 text-white rounded-lg text-xs font-bold">
                        جدولة مقابلة
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5 text-xs bg-slate-50 p-3.5 rounded-xl border border-slate-100">
                    <div><span className="text-slateText-muted block">سنوات الخبرة:</span> <strong>{selected.yearsExperience} سنوات</strong></div>
                    <div><span className="text-slateText-muted block">الراتب المتوقع:</span> <strong>{selected.expectedSalary || 'لم يحدد'}</strong></div>
                    <div><span className="text-slateText-muted block">المدينة:</span> <strong>{selected.city || 'الرياض'}</strong></div>
                    <div className="sm:col-span-3"><span className="text-slateText-muted block">البرامج والمهارات:</span> <strong>{selected.skills || 'لم تسجل'}</strong></div>
                  </div>
                </div>
              ) : (
                <div className="clean-card p-8 text-center text-xs text-slateText-muted">
                  اختر مرشحاً لعرض تفاصيل طلبه.
                </div>
              )}
            </div>
          </div>

          {scheduleOpen && selected && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in text-right">
              <div className="bg-white rounded-3xl p-5 max-w-sm w-full space-y-3.5">
                <h3 className="font-bold text-sm text-slateText-title">تحديد موعد مقابلة لـ: {selected.fullName}</h3>
                <div>
                  <label className="block text-xs font-bold mb-1">تاريخ المقابلة</label>
                  <input type="date" value={intDate} onChange={e => setIntDate(e.target.value)} className="w-full h-9 px-3 border rounded-lg text-xs" />
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">وقت المقابلة</label>
                  <input type="time" value={intTime} onChange={e => setIntTime(e.target.value)} className="w-full h-9 px-3 border rounded-lg text-xs" />
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">رابط Google Meet</label>
                  <input type="text" value={meetLink} onChange={e => setMeetLink(e.target.value)} className="w-full h-9 px-3 border rounded-lg text-xs" />
                </div>
                <div className="flex gap-2 pt-1">
                  <button
                    onClick={() => {
                      onScheduleInterview(selected.code, { date: intDate, time: intTime, meetLink });
                      setScheduleOpen(false);
                    }}
                    className="flex-1 h-9 bg-brand-800 text-white text-xs font-bold rounded-lg"
                  >
                    حفظ وتأكيد الموعد
                  </button>
                  <button onClick={() => setScheduleOpen(false)} className="px-3 h-9 border rounded-lg text-xs">إلغاء</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ---------------- Main App Component ---------------- */
    function App() {
      const [view, setView] = useState("welcome");
      const [applicants, setApplicants] = useState([]);
      const [registeredUser, setRegisteredUser] = useState(null);
      const [activeApplicant, setActiveApplicant] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isAdminModalOpen, setIsAdminModalOpen] = useState(false);
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);

      // Load applicants from Cloud on startup and periodically
      const refreshCloudData = async () => {
        const list = await CloudDB.getAll();
        setApplicants(list);
        return list;
      };

      useEffect(() => {
        refreshCloudData();
        const interval = setInterval(refreshCloudData, 10000); // 10s auto-refresh
        return () => clearInterval(interval);
      }, []);

      const handleRegister = (regData) => {
        setRegisteredUser(regData);
        setView("apply");
      };

      const handleFormSubmit = async (formData) => {
        setIsSubmitting(true);
        const currentList = await CloudDB.getAll();
        const nextNum = currentList.length + 1;
        const newCode = 'APP-' + String(nextNum).padStart(4, '0');
        
        const newApp = {
          id: String(Date.now()),
          code: newCode,
          status: 'SUBMITTED',
          submittedAt: new Date().toLocaleDateString('ar-SA'),
          interview: null,
          ...formData
        };

        const updated = [newApp, ...currentList.filter(a => a.phone !== newApp.phone && a.code !== newApp.code)];
        await CloudDB.save(updated);
        setApplicants(updated);
        setActiveApplicant(newApp);
        setIsSubmitting(false);
        setView("success");
      };

      const updateStatus = async (code, newStatus) => {
        const updated = applicants.map(a => a.code === code ? { ...a, status: newStatus } : a);
        setApplicants(updated);
        await CloudDB.save(updated);
        if (activeApplicant?.code === code) setActiveApplicant({ ...activeApplicant, status: newStatus });
      };

      const scheduleInt = async (code, interviewData) => {
        const updated = applicants.map(a => a.code === code ? { ...a, status: 'INTERVIEW_SCHEDULED', interview: interviewData } : a);
        setApplicants(updated);
        await CloudDB.save(updated);
        if (activeApplicant?.code === code) setActiveApplicant({ ...activeApplicant, status: 'INTERVIEW_SCHEDULED', interview: interviewData });
      };

      const resetAll = async () => {
        if (confirm('هل تريد تصفير جميع بيانات المتقدمين من السحابة والبدء من الصفر؟')) {
          await CloudDB.save([]);
          localStorage.clear();
          setApplicants([]);
          setActiveApplicant(null);
          setRegisteredUser(null);
          alert('تم تصفير السحابة وقاعدة البيانات بنجاح.');
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#F8FAF9]">
          <Navbar view={view} setView={setView} />

          <main className="flex-1">
            {view === "welcome" && (
              <WelcomeScreen
                onStartApply={() => setView("register")}
                onStartTrack={() => setView("dashboard")}
              />
            )}

            {view === "register" && (
              <RegisterStep
                onRegisterSuccess={handleRegister}
                onBack={() => setView("welcome")}
              />
            )}

            {view === "apply" && (
              <ApplicationForm
                initialData={registeredUser}
                isSubmitting={isSubmitting}
                onSubmit={handleFormSubmit}
                onBack={() => setView("register")}
              />
            )}

            {view === "success" && activeApplicant && (
              <SuccessScreen
                applicant={activeApplicant}
                goDashboard={() => setView("dashboard")}
              />
            )}

            {view === "dashboard" && (
              <ApplicantDashboard
                applicants={applicants}
                activeApplicant={activeApplicant}
                onRefresh={refreshCloudData}
                onGoApply={() => setView("register")}
              />
            )}

            {view === "admin" && isAdminLoggedIn && (
              <AdminDashboardView
                applicants={applicants}
                onUpdateStatus={updateStatus}
                onScheduleInterview={scheduleInt}
                onResetAll={resetAll}
              />
            )}
          </main>

          <footer className="mt-auto bg-white border-t border-[#E2E8F0] py-6 px-4 text-xs text-slateText-muted">
            <div className="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-right">
              <div className="flex items-center gap-2">
                <Icon.Scale size={16} color="#0C3831" />
                <span className="font-bold text-slateText-body">مكتب المستشار للمحاماة والاستشارات القانونية — الرياض</span>
              </div>
              <div
                onClick={() => setIsAdminModalOpen(true)}
                className="cursor-default select-none text-[11px] text-slateText-light hover:text-slateText-muted transition-colors"
              >
                © 2026 جميع الحقوق محفوظة لمكتب المستشار للمحاماة · بوابة التوظيف الذكية
              </div>
            </div>
          </footer>

          {isAdminModalOpen && (
            <AdminAuthModal
              onSuccess={() => {
                setIsAdminModalOpen(false);
                setIsAdminLoggedIn(true);
                setView("admin");
              }}
              onClose={() => setIsAdminModalOpen(false)}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
