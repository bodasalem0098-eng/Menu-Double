  <script>
    tailwind.config = {
      theme: {

          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],

  <style>
    * {

      -webkit-tap-highlight-color: transparent;

    body { 
      background-color: #F8FAF9;
      color: #0F172A; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .clean-card {
      background: #FFFFFF;
      border: 1px solid #E5E9E7;

      border-radius: 20px;
    }
    .clean-card-hover {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .clean-card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(12, 56, 49, 0.08), 0 0 0 1.5px #1B6B5D;

    .no-scrollbar::-webkit-scrollbar { display: none; }

<body class="bg-[#F8FAF9] text-[#0F172A]">

  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- CRISP VECTOR ICONS ---

          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      ),
      Check: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      ),
      Calendar: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <rect width="18" height="18" x="3" y="4" rx="2"/>
          <line x1="16" x2="16" y1="2" y2="6"/>
          <line x1="8" x2="8" y1="2" y2="6"/>
          <line x1="3" x2="21" y1="10" y2="10"/>
        </svg>
      ),
      Video: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <path d="m22 8-6 4 6 4V8Z"/>
          <rect width="14" height="12" x="2" y="6" rx="2"/>
        </svg>
      ),
      Phone: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
      ),
      MessageSquare: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      ),
      UploadCloud: ({ className = "w-6 h-6" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/>
          <path d="M12 12v9"/>
          <path d="m16 16-4-4-4 4"/>
        </svg>
      ),
      Download: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" x2="12" y1="15" y2="3"/>
        </svg>
      ),
      Trash: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 6h18"/>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
        </svg>
      ),
      Building: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <rect width="16" height="20" x="4" y="2" rx="2" ry="2"/>

          <path d="M8 6h.01"/>
          <path d="M16 6h.01"/>
          <path d="M8 10h.01"/>
          <path d="M16 10h.01"/>
          <path d="M8 14h.01"/>
          <path d="M16 14h.01"/>
        </svg>
      ),
      Server: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <rect width="20" height="8" x="2" y="2" rx="2" ry="2"/>
          <rect width="20" height="8" x="2" y="14" rx="2" ry="2"/>
          <line x1="6" x2="6.01" y1="6" y2="6"/>
          <line x1="6" x2="6.01" y1="18" y2="18"/>
        </svg>
      ),
    };

    const STORAGE_KEY = 'almustashar_hr_system_v1';
    const SEQ_KEY = 'almustashar_hr_seq_v1';

    function getStoredApplicants() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) {
          const parsed = JSON.parse(data);
          if (Array.isArray(parsed)) return parsed;
        }
      } catch(e) {}
      return [];
    }

    function matchApplicant(applicant, queryStr) {
      if (!queryStr || !applicant) return false;
      const toEng = (s) => (s || '').toString().replace(/[٠١٢٣٤٥٦٧٨٩]/g, d => "0123456789"["٠١٢٣٤٥٦٧٨٩".indexOf(d)]);
      const rawQ = toEng(queryStr).toLowerCase().trim();
      const cleanQ = rawQ.replace(/[\s\-_#+()]/g, '');
      const digitsOnlyQ = rawQ.replace(/\D/g, '');

      // Match Code
      const appCode = toEng(applicant.code || '').toLowerCase().replace(/[\s\-_#]/g, '');
      if (appCode === cleanQ || appCode.includes(cleanQ)) return true;

      // Match Phone
      const appPhone = toEng(applicant.phone || '').replace(/\D/g, '');
      if (digitsOnlyQ && appPhone) {
        if (appPhone.includes(digitsOnlyQ) || digitsOnlyQ.includes(appPhone)) return true;
        if (digitsOnlyQ.length >= 7 && appPhone.slice(-7) === digitsOnlyQ.slice(-7)) return true;
      }

      // Match Name
      const appName = (applicant.fullName || '').toLowerCase();
      if (appName && appName.includes(rawQ)) return true;

      return false;
    }

    function App() {
      const [view, setView] = useState('welcome');
      const [applicants, setApplicants] = useState(getStoredApplicants);
      const [lastSubmitted, setLastSubmitted] = useState(null);
      const [selectedApplicant, setSelectedApplicant] = useState(null);
      const [isAdminAuthModalOpen, setIsAdminAuthModalOpen] = useState(false);
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);

      const saveApplicants = (newList) => {
        setApplicants(newList);
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(newList));
        } catch(e) {}
      };

      // Form submission
      const handleFormSubmit = (formData) => {
        let currentSeq = parseInt(localStorage.getItem(SEQ_KEY) || '0', 10);
        currentSeq += 1;
        try {
          localStorage.setItem(SEQ_KEY, currentSeq.toString());
        } catch(e) {}

        const newCode = 'APP-' + String(currentSeq).padStart(4, '0');
        const newApp = {
          id: String(Date.now()),
          code: newCode,
          submittedAt: new Date().toLocaleDateString('ar-SA', { day: 'numeric', month: 'long', year: 'numeric' }),
          status: 'SUBMITTED',
          cvViewed: false,
          interview: null,
          ...formData
        };

        const updated = [newApp, ...applicants.filter(a => a.phone !== newApp.phone)];
        saveApplicants(updated);
        setLastSubmitted(newApp);
        setView('success');
      };

      const updateApplicantStatus = (code, newStatus) => {
        const updated = applicants.map(a => a.code === code ? { ...a, status: newStatus, cvViewed: true } : a);
        saveApplicants(updated);
        if (selectedApplicant && selectedApplicant.code === code) {
          setSelectedApplicant({ ...selectedApplicant, status: newStatus, cvViewed: true });
        }
      };

      const handleScheduleInterview = (code, interviewData) => {
        const updated = applicants.map(a => a.code === code ? { ...a, status: 'INTERVIEW_SCHEDULED', interview: interviewData } : a);
        saveApplicants(updated);
        if (selectedApplicant && selectedApplicant.code === code) {
          setSelectedApplicant({ ...selectedApplicant, status: 'INTERVIEW_SCHEDULED', interview: interviewData });
        }
      };

      const handleResetAll = () => {
        if (confirm('هل تريد تصفير جميع الطلبات في النظام والبدء من الصفر؟')) {
          localStorage.clear();
          setApplicants([]);
          setSelectedApplicant(null);
          alert('تم تصفير النظام بنجاح.');
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#F8FAF9]">
          
          {/* HEADER */}
          <header className="bg-white border-b border-[#E2E8F0] sticky top-0 z-40 px-4 py-3.5 shadow-[0_1px_2px_rgba(0,0,0,0.03)]">
            <div className="max-w-4xl mx-auto flex items-center justify-between">
              
              <div 
                className="flex items-center gap-3 cursor-pointer group"
                onClick={() => setView('welcome')}
              >
                <div className="w-9 h-9 rounded-xl bg-brand-800 text-white flex items-center justify-center shadow-sm group-hover:scale-105 transition-transform">
                  <Icon.Scale className="w-5 h-5 text-[#E1EFEA]" />
                </div>
                <div>
                  <h1 className="font-extrabold text-sm text-slateText-title leading-tight">المستشار للمحاماة</h1>
                  <p className="text-[11px] text-brand-700 font-semibold">بوابة استقطاب الكفاءات المالية</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setView('welcome')}
                  className={`text-xs font-bold px-3 py-1.5 rounded-lg transition-colors ${view === 'welcome' ? 'bg-brand-50 text-brand-800' : 'text-slateText-muted hover:bg-slate-100'}`}
                >
                  الرئيسية
                </button>
                <button
                  onClick={() => setView('form')}
                  className={`text-xs font-bold px-4 py-1.5 rounded-lg transition-colors ${view === 'form' ? 'bg-brand-800 text-white shadow-sm' : 'bg-brand-50 text-brand-800 hover:bg-brand-100'}`}
                >
                  تقديم طلب توظيف
                </button>

                {isAdminLoggedIn ? (
                  <div className="flex items-center gap-1.5 mr-2">
                    <button
                      onClick={() => setView('admin')}
                      className={`text-xs font-bold px-3 py-1.5 rounded-lg transition-colors ${view === 'admin' ? 'bg-brand-800 text-white' : 'bg-slate-100 text-slateText-body'}`}
                    >
                      لوحة الإدارة
                    </button>
                    <button
                      onClick={() => { setIsAdminLoggedIn(false); setView('welcome'); }}
                      className="text-xs font-bold px-2.5 py-1.5 rounded-lg bg-red-50 text-red-600 border border-red-200 hover:bg-red-100"
                    >
                      خروج
                    </button>
                  </div>
                ) : null}
              </div>
            </div>
          </header>

          {/* MAIN */}
          <main className="flex-1 max-w-4xl w-full mx-auto px-4 py-6 md:py-8">
            {view === 'welcome' && (
              <WelcomeView 
                onStartApply={() => setView('form')}
                onOpenAdmin={() => setIsAdminAuthModalOpen(true)}
              />
            )}

            {view === 'form' && (
              <ApplicantForm 
                onSubmit={handleFormSubmit} 
                onBack={() => setView('welcome')}
              />
            )}

            {view === 'success' && lastSubmitted && (
              <SuccessCard 
                applicant={lastSubmitted} 
                onGoHome={() => setView('welcome')}
                onNewApply={() => setView('form')}
              />
            )}

            {view === 'admin' && isAdminLoggedIn && (
              <AdminSystem 
                applicants={applicants}
                selectedApplicant={selectedApplicant}
                setSelectedApplicant={setSelectedApplicant}
                onUpdateStatus={updateApplicantStatus}
                onScheduleInterview={handleScheduleInterview}
                onResetAll={handleResetAll}
              />
            )}
          </main>

          {/* FOOTER */}
          <footer className="mt-auto bg-white border-t border-[#E2E8F0] py-6 px-4 text-xs text-slateText-muted">
            <div className="max-w-4xl mx-auto space-y-4">
              
              <div className="flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-right">
                <div className="flex items-center gap-2">
                  <Icon.Scale className="w-4 h-4 text-brand-700" />
                  <span className="font-bold text-slateText-body">مكتب المستشار للمحاماة والاستشارات القانونية — الرياض</span>
                </div>

                <div className="flex gap-4 text-xs font-semibold text-slateText-muted">
                  <button onClick={() => setView('welcome')} className="hover:text-brand-800">الرئيسية</button>
                  <button onClick={() => setView('form')} className="hover:text-brand-800">تقديم على الوظيفة</button>
                </div>
              </div>

              {/* Secret Admin Portal in Copyright */}
              <div className="text-center sm:text-right pt-2 border-t border-slate-100 text-[11px]">
                <span 
                  onClick={() => setIsAdminAuthModalOpen(true)}
                  className="text-slateText-light hover:text-slateText-muted transition-colors cursor-default select-none"
                >
                  © 2026 جميع الحقوق محفوظة لمكتب المستشار للمحاماة والاستشارات القانونية.
                </span>
              </div>

            </div>
          </footer>

          {/* ADMIN AUTH MODAL */}
          {isAdminAuthModalOpen && (
            <AdminAuthModal 
              onSuccess={() => {
                setIsAdminLoggedIn(true);
                setIsAdminAuthModalOpen(false);
                setView('admin');
              }}
              onClose={() => setIsAdminAuthModalOpen(false)}
            />
          )}

        </div>
      );
    }

    /* ---------------- 0. WELCOME / JOB LANDING VIEW ---------------- */
    function WelcomeView({ onStartApply, onOpenAdmin }) {
      return (
        <div className="max-w-3xl mx-auto space-y-6 animate-fade-in">
          
          {/* HERO BANNER */}
          <div className="bg-brand-800 text-white rounded-3xl p-7 md:p-10 shadow-sm relative overflow-hidden">
            <div className="relative z-10 space-y-4 max-w-xl text-right">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 text-brand-100 text-xs font-bold border border-white/10">
                <Icon.Building className="w-3.5 h-3.5" />
                <span>المملكة العربية السعودية · الرياض</span>
              </div>

              <h2 className="text-2xl md:text-4xl font-extrabold leading-tight text-white">
                استقطاب الكفاءات المالية <br />
                <span className="text-[#E1EFEA]">وظيفة محاسب مالي معتمد</span>
              </h2>

              <p className="text-xs md:text-sm text-white/85 leading-relaxed font-normal">
                يرحب مكتب المستشار للمحاماة والاستشارات القانونية بالكوادر المحاسبية المؤهلة للانضمام إلى فريق العمل المالي والإداري.
              </p>

              <div className="pt-2">
                <button
                  onClick={onStartApply}
                  className="px-7 h-12 bg-white text-brand-900 hover:bg-brand-50 rounded-2xl font-extrabold text-xs shadow-md transition-transform active:scale-95 flex items-center gap-2"
                >
                  <Icon.Briefcase className="w-4 h-4 text-brand-800" />
                  <span>بدء التقديم على الوظيفة الآن ➔</span>
                </button>
              </div>
            </div>
          </div>

          {/* JOB HIGHLIGHTS */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            
            <div className="clean-card p-5 space-y-2">
              <div className="w-10 h-10 rounded-xl bg-brand-50 text-brand-800 flex items-center justify-center">
                <Icon.Briefcase className="w-5 h-5" />
              </div>
              <h3 className="font-bold text-sm text-slateText-title">طبيعة العمل</h3>
              <p className="text-xs text-slateText-muted leading-relaxed">
                دوام كامل (حضوري) بمقر المكتب في مدينة الرياض.
              </p>
            </div>

            <div className="clean-card p-5 space-y-2">
              <div className="w-10 h-10 rounded-xl bg-brand-50 text-brand-800 flex items-center justify-center">
                <Icon.FileText className="w-5 h-5" />
              </div>

              <strong className="text-2xl font-black text-purple-600">
                {applicants.filter(a => a.status === 'SHORTLISTED' || a.status === 'INTERVIEW_SCHEDULED').length}
              </strong>
            </div>
            <div className="clean-card p-4">
              <span className="text-[11px] font-semibold text-slateText-muted block">مقبولين للتوظيف</span>
              <strong className="text-2xl font-black text-green-600">
                {applicants.filter(a => a.status === 'ACCEPTED').length}
              </strong>
            </div>
          </div>

          {/* Search & Filters */}
          <div className="clean-card p-3 flex flex-col sm:flex-row gap-2">
            <div className="flex-1 relative">
              <input 
                type="text" 
                placeholder="بحث بالاسم أو الهاتف أو رقم الطلب (APP-0001)..."
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                className="w-full h-9 pr-8 pl-3 rounded-lg border border-slate-200 text-xs focus:outline-none focus:border-brand-700 bg-slate-50/50"
              />
              <div className="absolute right-2.5 top-2.5 text-slateText-light pointer-events-none">
                <Icon.Search className="w-3.5 h-3.5" />
              </div>
            </div>

            <div className="flex gap-1 overflow-x-auto no-scrollbar">
              {[
                { id: 'ALL', label: 'الكل' },
                { id: 'SUBMITTED', label: 'جديد' },
                { id: 'SHORTLISTED', label: 'مختصر' },
                { id: 'INTERVIEW_SCHEDULED', label: 'مقابلات' },
                { id: 'ACCEPTED', label: 'مقبول' },
              ].map(f => (
                <button
                  key={f.id}
                  onClick={() => setFilterStatus(f.id)}
                  className={`px-3 h-9 rounded-lg text-xs font-bold whitespace-nowrap transition-colors ${
                    filterStatus === f.id ? 'bg-brand-800 text-white' : 'bg-slate-100 text-slateText-body hover:bg-slate-200'
                  }`}
                >
                  {f.label}
                </button>
              ))}
            </div>
          </div>

          {/* Master View */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            
            {/* List */}
            <div className="md:col-span-1 space-y-2">
              {filtered.length === 0 ? (
                <div className="clean-card p-6 text-center text-xs text-slateText-muted">
                  لا توجد طلبات في هذا القسم حالياً.
                </div>
              ) : (
                filtered.map(app => (
                  <div
                    key={app.code}
                    onClick={() => {
                      setSelectedApplicant(app);
                      onUpdateStatus(app.code, 'CV_VIEWED');
                    }}
                    className={`clean-card p-3.5 cursor-pointer transition-all ${
                      selectedApplicant?.code === app.code ? 'border-brand-800 ring-2 ring-brand-100' : 'hover:border-slate-300'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      {app.photoBase64 ? (
                        <img src={app.photoBase64} alt="" className="w-10 h-10 rounded-lg object-cover border border-slate-200" />
                      ) : (
                        <div className="w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center font-bold text-slateText-muted"><Icon.User className="w-4 h-4" /></div>
                      )}

                      <div className="flex-1 min-w-0">
                        <div className="flex justify-between items-center">
                          <strong className="text-xs font-bold text-slateText-title truncate">{app.fullName}</strong>
                          <span className="font-mono text-[10px] font-bold text-brand-700 bg-brand-50 px-1 rounded">{app.code}</span>
                        </div>
                        <p className="text-[11px] text-slateText-muted">{app.qualification} · {app.yearsExperience} سنوات خبرة</p>
                      </div>
                    </div>
                  </div>
                ))
              )}
            </div>

            {/* Details Card */}
            <div className="md:col-span-2">
              {selectedApplicant ? (
                <div className="clean-card p-5 space-y-4 sticky top-16">
                  
                  <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                    <div className="flex items-center gap-3">
                      {selectedApplicant.photoBase64 ? (
                        <img src={selectedApplicant.photoBase64} alt="" className="w-14 h-14 rounded-xl object-cover border border-slate-200" />
                      ) : (
                        <div className="w-14 h-14 rounded-xl bg-slate-100 flex items-center justify-center font-bold text-slateText-muted"><Icon.User className="w-6 h-6" /></div>
                      )}
                      <div>
                        <h3 className="font-bold text-base text-slateText-title">{selectedApplicant.fullName}</h3>
                        <p className="text-xs text-slateText-muted">{selectedApplicant.phone} {selectedApplicant.email && `· ${selectedApplicant.email}`}</p>
                      </div>
                    </div>

                    <div className="flex gap-1.5">
                      <select
                        value={selectedApplicant.status}
                        onChange={e => onUpdateStatus(selectedApplicant.code, e.target.value)}
                        className="h-9 px-2.5 rounded-lg border border-slate-200 text-xs font-bold bg-slate-50 focus:outline-none"
                      >
                        <option value="SUBMITTED">جديد</option>
                        <option value="CV_VIEWED">تم الفحص</option>
                        <option value="SHORTLISTED">مختصر</option>
                        <option value="INTERVIEW_SCHEDULED">مقابلة</option>
                        <option value="ACCEPTED">مقبول ✓</option>
                        <option value="REJECTED">مرفوض ✕</option>
                      </select>
                      <button onClick={() => setScheduleModalOpen(true)} className="h-9 px-3 bg-brand-800 text-white rounded-lg text-xs font-bold">
                        مقابلة
                      </button>
                    </div>
                  </div>

                  {/* Quick Contact */}
                  <div className="flex gap-2">
                    <a href={`https://wa.me/${selectedApplicant.phone.replace(/[^0-9]/g, '')}`} target="_blank" className="flex-1 h-9 rounded-lg bg-green-50 text-green-700 border border-green-200 text-xs font-bold flex items-center justify-center gap-1">
                      <Icon.MessageSquare className="w-3.5 h-3.5" />
                      <span>مراسلة واتساب</span>
                    </a>
                    <a href={`tel:${selectedApplicant.phone}`} className="flex-1 h-9 rounded-lg bg-slate-100 text-slateText-body text-xs font-bold flex items-center justify-center gap-1">
                      <Icon.Phone className="w-3.5 h-3.5" />
                      <span>اتصال هاتفي</span>
                    </a>
                  </div>

                  {/* Profile Details */}
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5 text-xs bg-slate-50/70 p-3.5 rounded-xl border border-slate-200/60">
                    <div><span className="text-slateText-muted block">العمر:</span> <strong>{selectedApplicant.age} سنة</strong></div>
                    <div><span className="text-slateText-muted block">الجنسية:</span> <strong>{selectedApplicant.nationality}</strong></div>
                    <div><span className="text-slateText-muted block">المدينة:</span> <strong>{selectedApplicant.city}</strong></div>
                    <div><span className="text-slateText-muted block">المؤهل:</span> <strong>{selectedApplicant.qualification}</strong></div>
                    <div><span className="text-slateText-muted block">سنوات الخبرة:</span> <strong>{selectedApplicant.yearsExperience} سنوات</strong></div>
                    <div><span className="text-slateText-muted block">الراتب المتوقع:</span> <strong>{selectedApplicant.expectedSalary || 'لم يحدد'}</strong></div>
                    <div className="sm:col-span-2"><span className="text-slateText-muted block">الوظيفة السابقة:</span> <strong>{selectedApplicant.currentJob || 'لا يوجد'}</strong></div>
                    <div><span className="text-slateText-muted block">البرامج:</span> <strong>{selectedApplicant.accountingSoftware || 'لم يحدد'}</strong></div>
                  </div>

                  {/* Interview Status */}
                  {selectedApplicant.interview && (
                    <div className="p-3.5 bg-purple-50 border border-purple-200 rounded-xl text-xs space-y-1 text-purple-950">
                      <strong className="block font-bold">📅 تم تحديد موعد مقابلة شخصية:</strong>
                      <p>التاريخ: <strong>{selectedApplicant.interview.date}</strong> | الوقت: <strong>{selectedApplicant.interview.time}</strong></p>
                      <a href={selectedApplicant.interview.meetLink} target="_blank" className="text-purple-700 font-bold underline block mt-1">
                        رابط Google Meet: {selectedApplicant.interview.meetLink}
                      </a>
                    </div>
                  )}

                  {/* CV File */}
                  <div className="p-3 bg-white rounded-xl border border-slate-200 flex items-center justify-between">
                    <div className="flex items-center gap-2 text-xs">
                      <Icon.FileText className="w-4 h-4 text-brand-700" />
                      <strong className="text-slateText-title">ملف السيرة الذاتية (CV)</strong>
                    </div>
                    <span className="text-xs text-brand-800 font-bold">
                      {selectedApplicant.cvName || 'CV_Applicant.pdf'}
                    </span>
                  </div>

                </div>
              ) : (
                <div className="clean-card p-10 text-center text-xs text-slateText-muted">
                  اختر مرشحاً من القائمة الجانبية لعرض كافة تفاصيل طلبه ومستنداته والتواصل معه.
                </div>
              )}
            </div>

          </div>

          {/* Schedule Modal */}
          {scheduleModalOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in">
              <div className="bg-white rounded-2xl p-5 max-w-sm w-full border border-slate-200 shadow-xl space-y-3.5">
                <h3 className="font-bold text-sm text-slateText-title">جدولة مقابلة لـ: {selectedApplicant?.fullName}</h3>
                
                <div>
                  <label className="block text-xs font-bold text-slateText-body mb-1">تاريخ المقابلة</label>
                  <input type="date" value={interviewDate} onChange={e => setInterviewDate(e.target.value)} className="w-full h-9 px-3 rounded-lg border border-slate-200 text-xs" />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slateText-body mb-1">وقت المقابلة</label>
                  <input type="time" value={interviewTime} onChange={e => setInterviewTime(e.target.value)} className="w-full h-9 px-3 rounded-lg border border-slate-200 text-xs" />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slateText-body mb-1">رابط Google Meet</label>
                  <input type="text" value={meetLink} onChange={e => setMeetLink(e.target.value)} className="w-full h-9 px-3 rounded-lg border border-slate-200 text-xs" />
                </div>

                <div className="flex gap-2 pt-1">
                  <button
                    onClick={() => {
                      onScheduleInterview(selectedApplicant.code, { date: interviewDate, time: interviewTime, meetLink: meetLink });
                      setScheduleModalOpen(false);
                      alert('تم حفظ وتحديد موعد المقابلة بنجاح!');
                    }}
                    className="flex-1 h-9 bg-brand-800 text-white font-bold rounded-lg text-xs"
                  >
                    حفظ وتأكيد الموعد
                  </button>
                  <button onClick={() => setScheduleModalOpen(false)} className="px-3 h-9 border border-slate-200 text-slateText-body rounded-lg text-xs font-bold">
                    إلغاء
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
